name: Map US-IRS-EO-N01 Application Pending Schema
on:
  push:
    branches: [main]
    paths:
      - 'tools/map_us_irs_eo_n01_application_pending.py'
      - '.github/workflows/map-us-irs-eo-n01-application-pending.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify active N01
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view 164 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-IRS-EO-N01/schema-application-pending-map.json
      - name: Inspect exact 2019 schema declarations
        run: python tools/map_us_irs_eo_n01_application_pending.py
      - name: Verify no data rows opened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-IRS-EO-N01/schema-application-pending-map.json').read_text())
          assert e['historical_return_rows_opened']==0
          assert e['future_outcome_rows_opened']==0
          assert e['scientific_contract_changed'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['hits'])
          PY
      - name: Commit mapping evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-IRS-EO-N01/schema-application-pending-map.json
          git commit -m 'Record US-IRS-EO-N01 application-pending schema map'
          git push origin HEAD:main
