name: Run US-FCC-ULS-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-fcc-uls-f01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  f01:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify active authorization and immutable evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 287f0e3dfe203beee3d9ca1f21e67e51ef2db6a5^{commit}
          gh issue view 166 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-FCC-ULS-F01/evidence/attempt-01.json
          test ! -e research/US-FCC-ULS-F01/evidence/attempt-01.md
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260921-US-FCC-ULS-F01-ACTIVE'
          assert cp['active_issue']==166
          assert cp['active_research']=='US-FCC-ULS-F01'
          assert cp['last_decision']=='DEC-242'
          c=Path('research/US-FCC-ULS-F01/README.md').read_text()
          assert 'Microwave and Microwave Broadcast Auxiliary' in c
          assert 'future_cancelled_terminated_membership_opened: false' in c
          assert 'PASS_US_FCC_ULS_F01_MICROWAVE_EXACT_SYSTEM_ID_FUTURE_EVENT_DESIGN_READY' in c
          PY
      - name: Execute frozen 18-gate structural attempt
        env:
          FCC_ULS_F01_ISSUE_BOUND: '1'
          FCC_ULS_F01_CONTRACT_SHA: '287f0e3dfe203beee3d9ca1f21e67e51ef2db6a5'
        run: python tools/run_us_fcc_uls_f01.py
      - name: Verify future-event firewall in evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-FCC-ULS-F01/evidence/attempt-01.json').read_text())
          assert e['future_daily_rows_opened']==0
          assert e['future_cancelled_terminated_membership_opened'] is False
          assert e['daily_entity_body_bytes_consumed']==0
          assert e['future_relationship_computed'] is False
          assert e['predictive_metric_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['name_address_call_sign_only_fuzzy_geo_manual_identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'], e.get('pass_count'), e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FCC-ULS-F01/evidence/attempt-01.json research/US-FCC-ULS-F01/evidence/attempt-01.md
          git commit -m 'Record US-FCC-ULS-F01 immutable attempt 01'
          git push origin HEAD:main
      - name: Report boundary
        run: |
          echo 'Future Microwave daily transaction bodies remained sealed; F01 inspected only the complete baseline body.'
