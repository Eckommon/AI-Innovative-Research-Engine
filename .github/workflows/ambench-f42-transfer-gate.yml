name: AMBENCH F42 P01 source-grounded transfer feasibility gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-f42-transfer-gate.yml'

permissions:
  contents: write

jobs:
  transfer_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate matched nominal and risk-order inputs without simulator performance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, math, re, urllib.request, zipfile
          from pathlib import Path

          DSID='mds2-2507'
          EXPECTED_VERSION='1.0.1'
          EXPECTED_SHA='c57a56cc9c906e4db134d7bfb8618b6678e80dd0318324de0b7baf1ce092a3f4'
          EXPECTED_SIZE=18079576
          EXPECTED_ROWS=25051
          EXPECTED_POSITIVE=7408
          EXPECTED_RUN_LENGTHS=[251,376,251,376,21,40,60,79,99,119,138,158,177,197,217,236,256,275,284,284,284,284,284,284,284,277,257,238,218,199,179,159,140,120,101,81,61,42,22]
          RISK_ORDER=[5,39,6,18,24,22,20,21,23,25,27,17,16,28,29,15,14,13,30,26,31,7,32,19,12,11,33,34,10,8,9,38,35,36,37,1,3,2,4]
          DT=10e-6
          BENCHMARK_POWER_W=600.0
          XY_BUFFER_MM=1.0
          XY_RES_MM=0.05
          Z_MIN_MM=-1.0
          Z_MAX_MM=0.0
          Z_RES_MM=0.025
          GRID_CAP=1_000_000

          out=Path('research/AMBENCH-F42/RESULT.md')
          out.parent.mkdir(parents=True,exist_ok=True)

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'AI-Innovative-Research-Engine/F42'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.read()

          hold=[]
          meta=json.loads(fetch(f'https://data.nist.gov/od/id/{DSID}?format=nerdm').decode('utf-8'))
          version=str(meta.get('version'))
          comps=[c for c in meta.get('components',[]) if c.get('filepath')=='RHF_Command.zip']
          comp=comps[0] if len(comps)==1 else None
          if comp is None:
              hold.append(f'RHF_Command component count={len(comps)}')
              raw=b''; got_sha=None; size_ok=False; hash_ok=False
          else:
              raw=fetch(comp['downloadURL'])
              got_sha=hashlib.sha256(raw).hexdigest()
              nerdm_sha=(comp.get('checksum') or {}).get('hash')
              size_ok=(len(raw)==comp.get('size')==EXPECTED_SIZE)
              hash_ok=(got_sha==nerdm_sha==EXPECTED_SHA)
              if version!=EXPECTED_VERSION or not size_ok or not hash_ok:
                  hold.append('version/size/checksum mismatch')

          member=None; rows=[]; run_ranges=[]
          if not hold:
              z=zipfile.ZipFile(io.BytesIO(raw))
              rx=re.compile(r'(?:^|/)RHF_P01_layer0001\.csv$',re.I)
              members=[n for n in z.namelist() if rx.search(n)]
              if len(members)!=1:
                  hold.append(f'P01 member count={len(members)}')
              else:
                  member=members[0]
                  text=z.read(member).decode('utf-8-sig',errors='strict')
                  parsed=[]; blank=0; malformed=0
                  for line_no,row in enumerate(csv.reader(io.StringIO(text))):
                      if not row or all(not c.strip() for c in row):
                          blank+=1; continue
                      if len(row)!=4:
                          malformed+=1; continue
                      try:
                          x,y,p,t=map(float,row)
                      except Exception:
                          malformed+=1; continue
                      if not all(math.isfinite(v) for v in (x,y,p,t)):
                          malformed+=1; continue
                      parsed.append((x,y,p,t))
                  rows=parsed
                  if blank or malformed or len(rows)!=EXPECTED_ROWS:
                      hold.append(f'row integrity blank={blank} malformed={malformed} parsed={len(rows)}')

          # Recover exact maximal positive-power source runs.
          if not hold:
              start=None
              for i,(_,_,p,_) in enumerate(rows):
                  if p>0 and start is None:
                      start=i
                  if p<=0 and start is not None:
                      run_ranges.append((start,i-1)); start=None
              if start is not None:
                  run_ranges.append((start,len(rows)-1))
              lengths=[b-a+1 for a,b in run_ranges]
              positive=sum(lengths)
              if lengths!=EXPECTED_RUN_LENGTHS or positive!=EXPECTED_POSITIVE:
                  hold.append(f'F41 run identity drift lengths_match={lengths==EXPECTED_RUN_LENGTHS} positive={positive}')
              if len(run_ranges)!=39 or sorted(RISK_ORDER)!=list(range(1,40)):
                  hold.append('run count or frozen risk order invalid')
          else:
              lengths=[]; positive=0

          leading_off=trailing_off=0; gaps=[]
          if not hold:
              leading_off=run_ranges[0][0]
              gaps=[run_ranges[i][0]-run_ranges[i-1][1]-1 for i in range(1,len(run_ranges))]
              trailing_off=len(rows)-1-run_ranges[-1][1]
              if any(g<1 for g in gaps):
                  hold.append('expected source-native laser-off separation missing')
              if leading_off+sum(gaps)+trailing_off+positive!=len(rows):
                  hold.append('source timing partition does not sum to total rows')

          # Positive-point geometry and one common rigid translation.
          run_points={}
          if not hold:
              allpos=[]
              for rid,(a,b) in enumerate(run_ranges,start=1):
                  pts=[(rows[i][0],rows[i][1]) for i in range(a,b+1)]
                  run_points[rid]=pts
                  allpos.extend(pts)
              minx=min(x for x,y in allpos); maxx=max(x for x,y in allpos)
              miny=min(y for x,y in allpos); maxy=max(y for x,y in allpos)
              width=maxx-minx; height=maxy-miny
              translated={rid:[(x-minx,y-miny) for x,y in pts] for rid,pts in run_points.items()}
          else:
              minx=maxx=miny=maxy=width=height=0.0; translated={}

          # Derived frozen-resolution domain.
          if not hold:
              x_span=width+2*XY_BUFFER_MM
              y_span=height+2*XY_BUFFER_MM
              z_span=Z_MAX_MM-Z_MIN_MM
              nx=int(math.ceil(x_span/XY_RES_MM))+1
              ny=int(math.ceil(y_span/XY_RES_MM))+1
              nz=int(math.ceil(z_span/Z_RES_MM))+1
              grid_points=nx*ny*nz
              if grid_points>GRID_CAP:
                  hold.append(f'derived grid points {grid_points} exceeds cap {GRID_CAP}')
          else:
              nx=ny=nz=grid_points=0

          # Generate source-grounded spot-command transfer. No simulator is executed.
          def path_text(order):
              lines=['Mode\tX(mm)\tY(mm)\tZ(mm)\tPmod\tVel(m/s)/Time(s)']
              first_run=order[0]
              x0,y0=translated[first_run][0]
              if leading_off>0:
                  lines.append(f'1\t{x0:.15g}\t{y0:.15g}\t0\t0\t{leading_off*DT:.15g}')
              for pos,rid in enumerate(order):
                  if pos>0:
                      xstart,ystart=translated[rid][0]
                      d=gaps[pos-1]*DT
                      lines.append(f'1\t{xstart:.15g}\t{ystart:.15g}\t0\t0\t{d:.15g}')
                  for x,y in translated[rid]:
                      lines.append(f'1\t{x:.15g}\t{y:.15g}\t0\t1\t{DT:.15g}')
              if trailing_off>0:
                  xend,yend=translated[order[-1]][-1]
                  lines.append(f'1\t{xend:.15g}\t{yend:.15g}\t0\t0\t{trailing_off*DT:.15g}')
              return '\n'.join(lines)+'\n'

          if not hold:
              nominal_order=list(range(1,40))
              nominal=path_text(nominal_order)
              reordered=path_text(RISK_ORDER)
              nominal_hash=hashlib.sha256(nominal.encode()).hexdigest()
              reordered_hash=hashlib.sha256(reordered.encode()).hexdigest()
              distinct=nominal_hash!=reordered_hash

              # Per-run translated geometry identity is independent of case ordering.
              run_geom_hashes={rid:hashlib.sha256(('\n'.join(f'{x:.15g},{y:.15g}' for x,y in translated[rid])+'\n').encode()).hexdigest() for rid in range(1,40)}
              source_geom_hashes={rid:hashlib.sha256(('\n'.join(f'{x-minx:.15g},{y-miny:.15g}' for x,y in run_points[rid])+'\n').encode()).hexdigest() for rid in range(1,40)}
              geometry_ok=(run_geom_hashes==source_geom_hashes)

              on_time=positive*DT
              off_time=(leading_off+sum(gaps)+trailing_off)*DT
              total_time=len(rows)*DT
              energy_proxy=on_time*BENCHMARK_POWER_W
              nominal_on_commands=sum(len(translated[r]) for r in nominal_order)
              reordered_on_commands=sum(len(translated[r]) for r in RISK_ORDER)
              timing_ok=(nominal_on_commands==reordered_on_commands==positive and abs(on_time+off_time-total_time)<=1e-12)

              gate='PASS_F42_SOURCE_GROUNDED_PATH_TRANSFER_READY' if distinct and geometry_ok and timing_ok and grid_points<=GRID_CAP else ('REJECT_F42_ORDER_NOT_DISTINCT' if not distinct else 'HOLD_F42_MAPPING_OR_RESOURCE_GAP')
          else:
              nominal_hash=reordered_hash=None; distinct=False; geometry_ok=False; timing_ok=False
              on_time=off_time=total_time=energy_proxy=0.0
              gate='HOLD_F42_MAPPING_OR_RESOURCE_GAP'

          lines_out=[
              '---','id: AMBENCH-F42-RESULT','type: source-grounded-path-order-transfer-feasibility-result','created: 2026-08-24','custom_simulator_performance_executed: false','physical_outcome_values_inspected: false','incremental_monetary_cost_usd: 0','---','',
              '# AMBENCH-F42 Result — P01 Source-Grounded Path-Order Transfer Feasibility',
              '# AMBENCH-F42 결과 — P01 Source-Grounded Path-Order Transfer 타당성','',
              '## Boundary / 경계','- Only checksum-frozen P01 process-input commands and pinned 3DThesis input syntax are used.','- No custom 3DThesis performance simulation is executed.','- No MPM/encoder/analysis/microscopy outcome value is used.','',
              '## Source integrity / source 무결성',f'- NERDm_version: `{version}`',f'- archive_size_match: `{size_ok}`',f'- archive_sha256_local: `{got_sha}`',f'- archive_sha256_match: `{hash_ok}`',f'- P01_member: `{member}`',f'- parsed_rows: `{len(rows)}`',f'- positive_rows: `{positive}`',f'- source_native_runs: `{len(run_ranges)}`','',
              '## Source timing partition / source timing 분할',f'- leading_off_rows: `{leading_off}`',f'- inter_run_gap_count: `{len(gaps)}`',f'- inter_run_gap_rows: `{gaps}`',f'- trailing_off_rows: `{trailing_off}`',f'- laser_on_time_s: `{on_time:.15g}`',f'- laser_off_time_s: `{off_time:.15g}`',f'- total_modeled_time_s: `{total_time:.15g}`',f'- benchmark_energy_proxy_J_at_600W: `{energy_proxy:.15g}`','',
              '## Geometry/domain transfer / geometry-domain transfer',f'- source_positive_bbox_x_mm: `[{minx:.15g}, {maxx:.15g}]`',f'- source_positive_bbox_y_mm: `[{miny:.15g}, {maxy:.15g}]`',f'- translated_width_mm: `{width:.15g}`',f'- translated_height_mm: `{height:.15g}`',f'- frozen_xy_buffer_mm: `{XY_BUFFER_MM}`',f'- grid_shape_xyz: `[{nx}, {ny}, {nz}]`',f'- derived_grid_points: `{grid_points}`',f'- grid_cap: `{GRID_CAP}`','',
              '## Matched generated inputs / 동일 생성 입력',f'- nominal_order: `{list(range(1,40))}`',f'- risk_order: `{RISK_ORDER}`',f'- nominal_path_sha256: `{nominal_hash}`',f'- risk_order_path_sha256: `{reordered_hash}`',f'- path_hashes_distinct: `{distinct}`',f'- per_run_geometry_preserved: `{geometry_ok}`',f'- positive_count_and_total_time_invariants: `{timing_ok}`',''
          ]
          if hold:
              lines_out+=['## Hold reasons / HOLD 이유']+[f'- `{x}`' for x in hold]+['']
          lines_out+=['## Frozen F42 gate / 고정 F42 판정',f'**`{gate}`**','']
          if gate=='PASS_F42_SOURCE_GROUNDED_PATH_TRANSFER_READY':
              lines_out+=['Nominal and F41 risk-order P01 transfers are distinct while preserving exact source-native positive-run geometry, positive command count, source-derived timing budget, common benchmark energy proxy and one deterministic bounded domain. A separately preregistered path-order-only performance experiment may now be designed; F42 itself authorizes no performance result.']
          elif gate=='REJECT_F42_ORDER_NOT_DISTINCT':
              lines_out+=['Faithful transfer collapses the frozen F41 risk order to the nominal generated input. Do not alter the order or mapping to rescue the path branch.']
          else:
              lines_out+=['The frozen source-to-runtime transfer cannot satisfy required identity/resource invariants without reinterpretation. Do not execute performance.']

          out.write_text('\n'.join(lines_out)+'\n',encoding='utf-8')
          PY

      - name: Persist F42 transfer gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/AMBENCH-F42/RESULT.md
          if git diff --cached --quiet; then
            echo 'No F42 result change.'
          else
            git commit -m 'record AMBENCH-F42 P01 path-order transfer gate'
            git push
          fi
