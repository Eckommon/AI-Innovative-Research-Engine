name: Activate US-IRS-EO-N01
on:
  push:
    branches: [main]
    paths:
      - 'tools/activate_us_irs_eo_n01.py'
      - '.github/workflows/activate-us-irs-eo-n01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pre-Issue contract and live Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 70898f12e1b1fb2ad233aaf0a1cb13ff49d73fe8^{commit}
          test ! -e registry/DEC-239.md
          gh issue view 164 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert str(cp['active_issue']).lower() in {'none','null','n/a'}
          assert cp['active_research']=='NONE'
          assert cp['last_completed_issue']==163
          assert cp['last_completed_research']=='US-IRS-EO-F01'
          assert cp['last_decision']=='DEC-238'
          c=Path('research/US-IRS-EO-N01/README.md').read_text(encoding='utf-8')
          assert 'status: CONTRACT_FROZEN_PRE_ISSUE' in c
          assert 'future_outcome_membership_opened: false' in c
          assert 'PASS_US_IRS_EO_N01_MATCHED_GOVERNANCE_INDEPENDENCE_DESIGN_IDENTIFIABLE' in c
          PY
      - name: Activate canonical state
        run: python tools/activate_us_irs_eo_n01.py
      - name: Verify active mirrors
        run: python tools/check_checkpoint.py
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/DEC-239.md registry/DECISION_LOG.md context/checkpoint.json STATUS.md context/SESSION_HANDOFF.md
          git commit -m 'Activate US-IRS-EO-N01'
          git push origin HEAD:main
      - name: Confirm outcome firewall
        run: |
          echo 'Only frozen IRS 2019 Form 990 historical index/XML sources are authorized.'
          echo 'Automatic Revocation membership remains unopened.'
          echo 'E01 unauthorized; cost=0 USD.'
