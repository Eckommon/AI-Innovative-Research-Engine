name: US GRID F01 final support and EBA snapshot

on:
  push:
    paths:
      - ".github/workflows/us-grid-f01-final-support.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-support:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet openpyxl
      - name: Freeze final support cohort and EBA bytes
        shell: bash
        run: |
          python - <<'PY'
          import io, os, hashlib, urllib.request, zipfile
          from collections import defaultdict, Counter
          from datetime import datetime, date
          import openpyxl

          LBNL="https://eta-publications.lbl.gov/sites/default/files/2026-05/lbnl_ix_queue_data_file_thru2025.xlsx"
          EBA="https://www.eia.gov/opendata/bulk/EBA.zip"
          OUT="research/US-GRID-F01/FINAL_SUPPORT_PREFLIGHT.md"

          BA={
            "AEC":"AECI","APS":"AZPS","Avista":"AVA","BPA":"BPAT","CAISO":"CISO",
            "CPUD":"CHPD","Dominion":"SCEG","EPE":"EPE","ERCOT":"ERCO","FPL":"FPL",
            "GrantPUD":"GCPD","IID":"IID","IP":"IPCO","ISO-NE":"ISNE","JEA":"JEA",
            "LADWP":"LDWP","LGE-KU":"LGEE","MISO":"MISO","NWMT":"NWMT","NYISO":"NYIS",
            "PGE":"PGE","PJM":"PJM","PNM":"PNM","PSCo":"PSCO","PSE":"PSEI","S-C":"SC",
            "SEC":"SEC","SMUD":"BANC","SOCO":"SOCO","SPP":"SWPP","SRP":"SRP",
            "SRP_ANPP":"SRP","SRP_Gila":"SRP","SRP_PV-PC":"SRP","SRP_SWV":"SRP",
            "TEC":"TEC","TEP":"TEPC","TPU":"TPWR","TVA":"TVA","WAPA-DSW":"WALC",
            "WAPA-RM":"WACM"
          }
          EXCLUDED={"BHCT","BHP","CLPT","CSU","Duke","GTC","MPC","N-C","NVE","OUC",
                    "PRPA","PacifiCorp","TSGT","WAPA-IS","WAPA-MPP","WAPA-SN"}

          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=180) as r:
                  return r.read(), dict(r.headers), r.geturl()

          def d(v):
              if isinstance(v,datetime): return v
              if isinstance(v,date): return datetime(v.year,v.month,v.day)
              if v is None: return None
              s=str(v).strip()
              for f in ("%Y-%m-%d %H:%M:%S","%Y-%m-%d"):
                  try:return datetime.strptime(s,f)
                  except: pass
              return None

          # LBNL structural pass
          b,_,_=fetch(LBNL)
          lsha=hashlib.sha256(b).hexdigest()
          wb=openpyxl.load_workbook(io.BytesIO(b),read_only=True,data_only=True)
          ws=wb["03. Complete Queue Data"]
          hr=None; hs=None
          for i,row in enumerate(ws.iter_rows(min_row=1,max_row=10,values_only=True),1):
              vals=[str(x).strip() if x is not None else "" for x in row]
              if "q_id" in vals and "entity" in vals:
                  hr=i; hs=vals; break
          ix={h:i for i,h in enumerate(hs) if h}
          cols=["q_id","entity","q_status","q_date","on_date","wd_date","ia_date"]
          rows=[]
          for row in ws.iter_rows(min_row=hr+1,values_only=True):
              if not any(x is not None for x in row): continue
              r={c:row[ix[c]] for c in cols}
              if str(r["entity"] or "").strip(): rows.append(r)

          start=datetime(2019,1,1); end=datetime(2025,12,31,23,59,59)
          entered=[r for r in rows if d(r["q_date"]) and start<=d(r["q_date"])<=end]
          qentered=[r for r in entered if str(r["entity"]).strip() in BA]
          completed=[r for r in qentered if str(r["q_status"]).strip()=="operational" and d(r["on_date"]) and d(r["on_date"])<=end]
          invalid=[r for r in completed if d(r["on_date"])<d(r["q_date"])]

          groups=defaultdict(list)
          for r in completed:
              groups[(str(r["entity"]).strip(),str(r["q_id"]).strip())].append(r)
          dups={k:v for k,v in groups.items() if len(v)>1}
          sem=["q_status","q_date","on_date","wd_date","ia_date"]
          conflicts={k:v for k,v in dups.items() if len({tuple(str(r[c]) for c in sem) for r in v})>1}
          exact={k:v for k,v in dups.items() if len({tuple(str(r[c]) for c in cols) for r in v})==1}
          unique={}
          for r in completed:
              k=(str(r["entity"]).strip(),str(r["q_id"]).strip())
              if k in conflicts: continue
              unique.setdefault(k,r)
          byba=Counter(BA[k[0]] for k in unique)

          # hash EBA without parsing any member values
          req=urllib.request.Request(EBA,headers={"User-Agent":"Mozilla/5.0"})
          h=hashlib.sha256(); total=0
          tmp="/tmp/EBA.zip"
          with urllib.request.urlopen(req,timeout=300) as resp, open(tmp,"wb") as f:
              final_url=resp.geturl()
              ctype=resp.headers.get("Content-Type","")
              while True:
                  chunk=resp.read(8*1024*1024)
                  if not chunk: break
                  h.update(chunk); f.write(chunk); total+=len(chunk)
          ehash=h.hexdigest()
          with zipfile.ZipFile(tmp) as z:
              members=[(i.filename,i.file_size,i.compress_size) for i in z.infolist()]
          os.remove(tmp)

          coverage=len(qentered)/len(entered) if entered else 0
          lines=["---","id: US-GRID-F01-FINAL-SUPPORT-PREFLIGHT","type: outcome-blind-final-support-preflight",
                 "created: 2026-09-04","relationship_outcome_computed: false","eia_operating_values_opened: false",
                 "qualified_entities: 41","excluded_entities: 16","incremental_monetary_cost_usd: 0","---","",
                 "# US-GRID-F01 Final Support & EIA-930 Bulk Snapshot Preflight","",
                 "## Frozen identity universe","",
                 f"- qualified LBNL entities: **{len(BA)}**",
                 f"- prospectively excluded entities: **{len(EXCLUDED)}**",
                 "- exact mapping contract: `ALIAS_ADJUDICATION.md`.","",
                 "## Frozen common cohort","",
                 "- q_date: **2019-01-01 through 2025-12-31**",
                 "- completed-project candidate: `q_status=operational` + explicit `on_date<=2025-12-31`",
                 "- no elapsed-duration statistic was calculated.","",
                 f"- all queue rows entering 2019–2025: **{len(entered)}**",
                 f"- qualified-entity queue rows: **{len(qentered)}**",
                 f"- qualified row coverage: **{coverage:.6%}**",
                 f"- operational + explicit on_date rows: **{len(completed)}**",
                 f"- invalid on_date < q_date: **{len(invalid)}**",
                 f"- completed-cohort duplicate `entity+q_id` groups: **{len(dups)}**",
                 f"- exact duplicate groups: **{len(exact)}**",
                 f"- semantic-conflict groups: **{len(conflicts)}**",
                 f"- unique completed project keys after frozen duplicate rule: **{len(unique)}**","",
                 "### Completed-project cardinality by EIA BA (structural only)","",
                 "| EIA BA | Unique completed project keys |","|---|---:|"]
          for ba,n in byba.most_common():
              lines.append(f"| `{ba}` | {n} |")
          lines += ["","## Frozen source bytes","",
                    f"- LBNL workbook SHA-256: `{lsha}`",
                    f"- EIA EBA final URL: `{final_url}`",
                    f"- EIA EBA ZIP bytes: **{total}**",
                    f"- EIA EBA ZIP SHA-256: `{ehash}`",
                    f"- Content-Type: `{ctype}`","",
                    "### EBA ZIP member inventory (names/sizes only; values unopened)","",
                    "| Member | Uncompressed bytes | Compressed bytes |","|---|---:|---:|"]
          for n,s,c in members:
              lines.append(f"| `{n}` | {s} | {c} |")
          lines += ["","## Fail-closed rules","",
                    "1. Future outcome-bearing work must use only the 41 qualified entities and their frozen BA mapping.",
                    "2. Exact duplicate rows may collapse only if all source fields used by the experiment are identical.",
                    "3. Any conflicting `entity+q_id` is excluded; no preferred row is selected.",
                    "4. A project is eligible for the IR→COD outcome only if it entered queue on/after 2019-01-01, is source-status operational, has explicit q_date/on_date, has on_date>=q_date, and on_date<=2025-12-31.",
                    "5. EIA operating values were not parsed in F01. A future experiment must preregister its EIA metric before opening relevant EBA values.",
                    "","## Gate-ready structural conclusion","",
                    "The source snapshots, BA identity subset, bounded common cohort, direct source-defined IR→COD date pair, and duplicate/null rules are now all frozen without computing queue durations or EIA operating relationships.",
                    "","Incremental monetary cost remained **0 USD**.",""]
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          open(OUT,"w",encoding="utf-8").write("\n".join(lines))
          PY
      - name: Commit final support preflight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/US-GRID-F01/FINAL_SUPPORT_PREFLIGHT.md
          git diff --cached --quiet || git commit -m "record US-GRID-F01 final support preflight"
          git push
