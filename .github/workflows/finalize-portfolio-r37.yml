name: Finalize PORTFOLIO-R37 Selection
on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_portfolio_r37.py'
      - '.github/workflows/finalize-portfolio-r37.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen R37 evidence and live Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 7ad2e9bf392d3e8fdf41982d7e1a800eca377f5a^{commit}
          git cat-file -e 5c79e690f5ea4745a9ca6be18829e8e6178a1509^{commit}
          git cat-file -e 3c2e70376ddbfd8d34d72f68fbedaae2183df5f3^{commit}
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert str(cp['active_issue']) in {'157','#157'}
          assert cp['active_research']=='PORTFOLIO-R37'
          assert cp['last_decision']=='DEC-226'
          score=Path('research/PORTFOLIO-R37/SCORECARD.md').read_text()
          assert 'SELECT_US_FSIS_SAMPLE_001_ESTABLISHMENT_SAMPLING_TO_RECALL_F01' in score
          req=urllib.request.Request('https://api.github.com/repos/Eckommon/AI-Innovative-Research-Engine/issues/157',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r: issue=json.load(r)
          assert issue['state']=='open'
          PY
      - name: Build terminal durable state
        run: python tools/finalize_portfolio_r37.py
      - name: Verify local checkpoint mirrors
        run: python tools/check_checkpoint.py
      - name: Commit terminal state locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/PORTFOLIO-R37/RESULT.md registry/DEC-227.md registry/DECISION_LOG.md context/checkpoint.json STATUS.md context/SESSION_HANDOFF.md
          git commit -m 'Finalize PORTFOLIO-R37 FSIS sampling selection'
      - name: Close Issue 157 completed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url='https://api.github.com/repos/Eckommon/AI-Innovative-Research-Engine/issues/157'
          data=json.dumps({'state':'closed','state_reason':'completed'}).encode()
          req=urllib.request.Request(url,data=data,method='PATCH',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r: x=json.load(r)
          assert x['state']=='closed'
          PY
      - name: Push terminal state
        run: git push origin HEAD:main
      - name: Confirm selection boundary
        run: |
          echo 'R37 selected FSIS sampling candidate only for a separate outcome-blind F01.'
          echo 'No future recall membership opened; no novelty/causal/ranking claim; cost=0 USD.'
