name: Run US-FRA-RR-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-fra-rr-f01.yml'
  workflow_dispatch:
  issues:
    types: [edited]
permissions:
  contents: write
  issues: read
jobs:
  fra-rr-f01:
    if: github.event_name != 'issues' || github.event.issue.number == 196
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 492e2a29261e786fe115fa9eaf2f89a8862fa5a6^{commit}
          gh issue view 196 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-FRA-RR-F01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261008-US-FRA-RR-F01-ACTIVE'
          assert cp['active_issue']==196
          assert cp['active_research']=='US-FRA-RR-F01'
          assert cp['last_decision']=='DEC-304'
          PY
      - name: Install deterministic HTTP dependency
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5'
      - name: Execute frozen FRA 18-gate attempt
        env:
          FRA_F01_BOUND: '1'
          FRA_F01_CONTRACT_SHA: '492e2a29261e786fe115fa9eaf2f89a8862fa5a6'
        run: python tools/run_us_fra_rr_f01.py
      - name: Verify future and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-FRA-RR-F01/evidence/attempt-01.json').read_text())
          assert e['future_2026plus_accident_membership_opened'] is False
          assert e['future_rows_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['prior_accident_predictor_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FRA-RR-F01/evidence/attempt-01.json research/US-FRA-RR-F01/evidence/attempt-01.md
          git commit -m 'Record US-FRA-RR-F01 immutable attempt 01'
          git push origin HEAD:main
