name: US-BRIDGE-F01 Key-Year-v4 Outcome-Blind Feasibility

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_us_bridge_f01_v4.py'
      - '.github/workflows/us-bridge-f01-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-f01-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile frozen runner and v4 wrapper
        run: python -m py_compile tools/run_us_bridge_f01.py tools/run_us_bridge_f01_v4.py
      - name: Run corrected key-year fail-closed F01
        run: python tools/run_us_bridge_f01_v4.py
      - name: Verify outcome-blind and implementation invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/US-BRIDGE-F01/EXECUTION_RESULT.json').read_text())
          m=json.loads(Path('research/US-BRIDGE-F01/SOURCE_MANIFEST.json').read_text())
          assert r['condition_rating_values_opened'] is False
          assert r['condition_rating_row_bytes_sliced'] is False
          assert r['relationship_computed'] is False
          assert r['fuzzy_repair_used'] is False
          assert r['incremental_monetary_cost_usd'] == 0
          assert r['raw_source_bytes_persisted'] is False
          assert r['duplicate_key_fail_closed_at_key_year_level'] is True
          assert r['supersedes_technical_run'] == 34790222911
          assert m['condition_values_accessed'] is False
          assert all(x['condition_values_accessed'] is False for x in m['annual_sources'])
          for x in m['annual_sources']:
              assert x['eligible_unique_bridge_keys'] == x['unique_bridge_keys'] - x['duplicate_canonical_keys_excluded']
              assert x['duplicate_canonical_keys_excluded'] <= x['duplicate_canonical_keys']
          print('US_BRIDGE_F01_V4_OUTCOME_BLIND_VERIFY_PASS', r['gate'])
          PY
      - name: Commit corrected durable derived evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-BRIDGE-F01/EXECUTION_RESULT.json research/US-BRIDGE-F01/SOURCE_MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Re-execute US-BRIDGE-F01 with key-year duplicate fail-closed semantics'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
      - name: Confirm COST-001 boundary
        run: |
          echo 'Standard public-repository GitHub-hosted runner only.'
          echo 'No paid API, larger/GPU runner, or artifact upload.'
