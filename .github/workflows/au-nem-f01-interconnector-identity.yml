name: AU NEM F01 interconnector identity

on:
  push:
    paths:
      - ".github/workflows/au-nem-f01-interconnector-identity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify AEMO interconnector to region identity
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,zipfile,hashlib,urllib.request,time
          from pathlib import Path

          URL="https://www.nemweb.com.au/Data_Archive/Wholesale_Electricity/MMSDM/2026/MMSDM_2026_06/MMSDM_Historical_Data_SQLLoader/DATA/PUBLIC_ARCHIVE%23INTERCONNECTOR%23FILE01%23202606010000.zip"
          EXPECT={"N-Q-MNSP1","NSW1-QLD1","T-V-MNSP1","V-S-MNSP1","V-SA","VIC1-NSW1"}

          def get(url,attempts=3):
              for a in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req,timeout=120) as r:
                          return r.read(),r.geturl()
                  except Exception:
                      if a+1==attempts: raise
                      time.sleep(5*(a+1))

          def sha(b): return hashlib.sha256(b).hexdigest()

          raw,final=get(URL)
          z=zipfile.ZipFile(io.BytesIO(raw))
          members=[n for n in z.namelist() if n.lower().endswith(".csv")]
          if len(members)!=1: raise RuntimeError("Unexpected members "+repr(z.namelist()))
          mb=z.read(members[0])
          txt=mb.decode("utf-8-sig")
          rows=list(csv.reader(io.StringIO(txt)))
          header=None; data=[]
          for row in rows:
              if len(row)<4: continue
              if row[0].strip()=="I":
                  header=[x.strip() for x in row[4:]]
              elif row[0].strip()=="D" and header:
                  vals=row[4:4+len(header)]
                  data.append({header[i]:(vals[i].strip() if i<len(vals) else "") for i in range(len(header))})

          found={}
          for r in data:
              iid=r.get("INTERCONNECTORID","")
              if iid in EXPECT:
                  found[iid]=(r.get("REGIONFROM",""),r.get("REGIONTO",""),r.get("DESCRIPTION",""))
          missing=EXPECT-set(found)
          if missing:
              raise RuntimeError("Monthly INTERCONNECTOR archive does not contain all current IDs: "+repr(sorted(missing))+" found="+repr(found))

          lines=[
              "---",
              "id: AU-NEM-F01-INTERCONNECTOR-IDENTITY",
              "created: 2026-09-05",
              "relationship_outcome_computed: false",
              "weather_values_parsed: false",
              "incremental_monetary_cost_usd: 0",
              "---","",
              "# AU-NEM-F01 Interconnector Identity","",
              "- AEMO archive URL: "+final,
              "- ZIP SHA-256: "+sha(raw),
              "- member: "+members[0],
              "- member SHA-256: "+sha(mb),
              "- schema: "+repr(header),
              "- data rows: **"+str(len(data))+"**","",
              "| Interconnector ID | Region from | Region to | Description |",
              "|---|---|---|---|"
          ]
          for iid in sorted(found):
              a,b,d=found[iid]
              lines.append("| "+iid+" | "+a+" | "+b+" | "+d+" |")
          lines += ["",
                    "All six current DispatchIS interconnector identities map to source-defined AEMO region endpoints without text inference.",
                    "",
                    "Incremental monetary cost remained **0 USD**.",""]
          Path("research/AU-NEM-F01/INTERCONNECTOR_IDENTITY.md").write_text("\n".join(lines),encoding="utf-8")
          PY
      - name: Commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/AU-NEM-F01/INTERCONNECTOR_IDENTITY.md
          git diff --cached --quiet || git commit -m "verify AU-NEM interconnector region identity"
          git push
