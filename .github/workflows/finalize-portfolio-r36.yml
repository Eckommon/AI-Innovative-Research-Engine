name: Finalize PORTFOLIO-R36 Selection
on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_portfolio_r36.py'
      - '.github/workflows/finalize-portfolio-r36.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen R36 evidence and live Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 6550f4cfbde9df2702c793b902d7676f05700d61^{commit}
          git cat-file -e c1a36a8fb522a2aa51a724ac4b78c05421a73d73^{commit}
          git cat-file -e 3a62ddae3e6fce7684d0d71da6de2d5e9045f9f5^{commit}
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert str(cp['active_issue']) in {'155','#155'}
          assert cp['active_research']=='PORTFOLIO-R36'
          assert cp['last_decision']=='DEC-222'
          score=Path('research/PORTFOLIO-R36/SCORECARD.md').read_text()
          assert 'SELECT_US_EIA_GEN_001_GENERATOR_COMMISSIONING_SLIPPAGE_F01' in score
          req=urllib.request.Request('https://api.github.com/repos/Eckommon/AI-Innovative-Research-Engine/issues/155',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r: issue=json.load(r)
          assert issue['state']=='open'
          PY
      - name: Build terminal durable state
        run: python tools/finalize_portfolio_r36.py
      - name: Verify local checkpoint mirrors
        run: python tools/check_checkpoint.py
      - name: Commit terminal state locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/PORTFOLIO-R36/RESULT.md registry/DEC-223.md registry/DECISION_LOG.md context/checkpoint.json STATUS.md context/SESSION_HANDOFF.md
          git commit -m 'Finalize PORTFOLIO-R36 EIA generator selection'
      - name: Close Issue 155 completed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url='https://api.github.com/repos/Eckommon/AI-Innovative-Research-Engine/issues/155'
          data=json.dumps({'state':'closed','state_reason':'completed'}).encode()
          req=urllib.request.Request(url,data=data,method='PATCH',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r: x=json.load(r)
          assert x['state']=='closed'
          PY
      - name: Push terminal state
        run: git push origin HEAD:main
      - name: Confirm selection boundary
        run: |
          echo 'R36 selected EIA generator candidate only for a separate outcome-blind F01.'
          echo 'No candidate outcome rows opened; no novelty/causal/ranking claim; cost=0 USD.'
