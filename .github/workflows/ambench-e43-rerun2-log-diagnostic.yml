name: AMBENCH E43 rerun attempt2 log diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-e43-rerun2-log-diagnostic.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract attempt 2 Step 3 error
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/AMBENCH-E43
          python - <<'PY'
          import io, os, re, urllib.request, zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; run_id=32648786267; attempt=2
          url=f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/logs'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AI-Innovative-Research-Engine/E43-rerun2-log'})
          with urllib.request.urlopen(req,timeout=90) as r: raw=r.read()
          z=zipfile.ZipFile(io.BytesIO(raw))
          pat=re.compile(r'(Traceback|TimeoutError|timed out|HTTPError|URLError|Exception|Process completed with exit code)',re.I)
          ev=[]
          for name in z.namelist():
              txt=z.read(name).decode('utf-8',errors='replace'); lines=txt.splitlines()
              ids=[i for i,l in enumerate(lines) if pat.search(l)]
              keep=set()
              for i in ids: keep.update(range(max(0,i-4),min(len(lines),i+5)))
              for i in sorted(keep):
                  line=re.sub(r'(?i)(authorization:|bearer)\s+\S+',r'\1 [MASKED]',lines[i])
                  ev.append(f'[{name}] {line}')
          ev=ev[-120:]
          out=['---','id: AMBENCH-E43-RERUN2-FAILURE-DIAGNOSTIC','type: exact-rerun-error-diagnostic','created: 2026-09-03','historical_run_id: 32648786267','run_attempt: 2','performance_output_accessed: false','experiment_contract_changed: false','incremental_monetary_cost_usd: 0','---','','# AMBENCH-E43 Rerun Attempt 2 Failure Diagnostic / 재실행 2차 실패 진단','','```text',*ev,'```','']
          Path('research/AMBENCH-E43/RERUN2_FAILURE_DIAGNOSTIC.md').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add research/AMBENCH-E43/RERUN2_FAILURE_DIAGNOSTIC.md
          git commit -m 'record AMBENCH-E43 rerun attempt2 failure diagnostic'
          git push
