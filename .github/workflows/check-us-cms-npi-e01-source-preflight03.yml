name: Check US-CMS-NPI-E01 Future Source Preflight 03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-us-cms-npi-e01-source-preflight03.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-preflight-03:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify E01 active state and immutable prior preflight
        run: |
          test -e research/US-CMS-NPI-E01/evidence/source-preflight-01.json
          test ! -e research/US-CMS-NPI-E01/evidence/source-preflight-03.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261013-US-CMS-NPI-E01-ACTIVE'
          assert cp['active_issue']==203
          assert cp['active_research']=='US-CMS-NPI-E01'
          assert cp['last_decision']=='DEC-318'
          p1=json.loads(Path('research/US-CMS-NPI-E01/evidence/source-preflight-01.json').read_text())
          assert p1['zip_body_opened'] is False
          assert p1['future_membership_opened'] is False
          assert p1['anchor_token']=='100526_101126'
          p2=json.loads(Path('research/US-CMS-NPI-E01/evidence/source-preflight-02.json').read_text())
          assert p2['preflight']==2
          assert p2['disposition']=='WAIT_SOURCE_US_CMS_NPI_E01'
          assert p2['metadata_only'] is True
          assert p2['zip_body_opened'] is False and p2['future_membership_opened'] is False
          assert p2['incremental_monetary_cost_usd']==0
          PY
      - name: Install deterministic HTTP dependency
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5'
      - name: Verify preflight 03 syntax
        run: python -m py_compile tools/check_us_cms_npi_e01_source_preflight03.py
      - name: Execute metadata-only source preflight 03
        run: python tools/check_us_cms_npi_e01_source_preflight03.py
      - name: Verify no future body was opened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-CMS-NPI-E01/evidence/source-preflight-03.json').read_text())
          assert e['preflight']==3
          assert e['metadata_only'] is True
          assert e['zip_body_opened'] is False
          assert e['future_membership_opened'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e['qualifying_count'],e.get('earliest_qualifying'))
          PY
      - name: Commit immutable source preflight 03
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-CMS-NPI-E01/evidence/source-preflight-03.json research/US-CMS-NPI-E01/evidence/source-preflight-03.md
          git commit -m 'Record US-CMS-NPI-E01 source preflight 03'
          git push origin HEAD:main
