name: CA GRAIN E02 Preregistered Relationship Test

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_ca_grain_e02.py'
      - '.github/workflows/ca-grain-e02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner
        run: python -m py_compile tools/run_ca_grain_e02.py
      - name: Execute frozen CA-GRAIN-E02 test
        run: python tools/run_ca_grain_e02.py
      - name: Commit derived result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/CA-GRAIN-E02/STAGE_B_PRIMARY_RESULT.json research/CA-GRAIN-E02/RESULT.md
          git diff --cached --quiet || git commit -m 'Record preregistered CA-GRAIN-E02 result'
          git push
