name: AMBENCH-E03 Frozen Thermal Feature Extraction

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/AMBENCH-E03/TRIGGER.md'
      - '.github/workflows/ambench-e03-pr.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HDF5 reader
        run: python -m pip install --disable-pip-version-check h5py

      - name: Download and verify frozen thermography snapshot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/raw work/logs work/result
          URL='https://data.nist.gov/od/ds/ark:/88434/mds2-2716/_v/1.3.1/Thermography/AMB2022-03-718-AMMT-StaringCamera_Signal.h5'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o work/raw/thermography.h5
          ACTUAL=$(sha256sum work/raw/thermography.h5 | awk '{print $1}')
          EXPECTED='f6fe21ec911707f72e7efda2932c77eae2b75d84765848878fe5beb6b728cd43'
          echo "bytes=$(stat -c%s work/raw/thermography.h5)" | tee work/logs/integrity.txt
          echo "actual_sha256=$ACTUAL" | tee -a work/logs/integrity.txt
          echo "expected_sha256=$EXPECTED" | tee -a work/logs/integrity.txt
          test "$ACTUAL" = "$EXPECTED"

      - name: Extract preregistered outcome-blind features
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/features.txt
          import csv, math
          import h5py, numpy as np
          from pathlib import Path

          def scalar(v):
              a=np.asarray(v).reshape(-1)
              return float(a[0])

          def identity(name):
              t=name.removeprefix('Line_').split('_')
              if len(t)==2:
                  return t[0], int(t[1])
              if len(t)==3:
                  return f'{t[0]}.{t[1]}', int(t[2])
              raise ValueError(name)

          def hist_quantile(hist,q):
              n=int(hist[1:].sum())
              if n<=0: return float('nan')
              rank=max(1,math.ceil(q*n))
              c=np.cumsum(hist[1:])
              return float(np.searchsorted(c,rank,side='left')+1)

          fields=[
            'group','process_case','repeat','laser_power_W','scan_speed_mm_s','spot_size_um',
            'thermal_nonzero_fraction','thermal_positive_mean_dl','thermal_positive_std_dl',
            'thermal_positive_p90_dl','thermal_positive_p99_dl','thermal_max_dl',
            'thermal_active_pixels_frame_mean','thermal_active_pixels_frame_max',
            'thermal_frame_sum_mean_dl','thermal_frame_sum_max_dl'
          ]
          rows=[]
          with h5py.File('work/raw/thermography.h5','r') as f:
              td=f['ThermalData']
              names=sorted(k for k in td if k.startswith('Line_'))
              if len(names)!=21: raise SystemExit(f'Expected 21 tracks, got {len(names)}')
              for name in names:
                  g=td[name]; ds=g['Signal']
                  hist=np.zeros(4096,dtype=np.int64)
                  pos_n=0; pos_sum=0.0; pos_sq=0.0; vmax=0
                  active=[]; frame_sums=[]
                  total=int(np.prod(ds.shape))
                  for start in range(0,ds.shape[0],25):
                      a=ds[start:min(start+25,ds.shape[0])]
                      mask=a>0
                      vals=a[mask]
                      if vals.size:
                          h=np.bincount(vals.ravel(),minlength=4096)
                          hist[:len(h)] += h
                          vf=vals.astype(np.float64)
                          pos_n += int(vals.size)
                          pos_sum += float(vf.sum())
                          pos_sq += float(np.square(vf).sum())
                          vmax=max(vmax,int(vals.max()))
                      active.extend(mask.sum(axis=(1,2)).astype(np.int64).tolist())
                      frame_sums.extend(a.sum(axis=(1,2),dtype=np.uint64).astype(np.float64).tolist())
                  mean=pos_sum/pos_n if pos_n else float('nan')
                  var=max(0.0,pos_sq/pos_n-mean*mean) if pos_n else float('nan')
                  case,rep=identity(name)
                  row={
                    'group':name,'process_case':case,'repeat':rep,
                    'laser_power_W':scalar(g.attrs['laser_power']),
                    'scan_speed_mm_s':scalar(g.attrs['scan_speed']),
                    'spot_size_um':scalar(g.attrs['spot_size']),
                    'thermal_nonzero_fraction':pos_n/total,
                    'thermal_positive_mean_dl':mean,
                    'thermal_positive_std_dl':math.sqrt(var),
                    'thermal_positive_p90_dl':hist_quantile(hist,0.90),
                    'thermal_positive_p99_dl':hist_quantile(hist,0.99),
                    'thermal_max_dl':vmax,
                    'thermal_active_pixels_frame_mean':float(np.mean(active)),
                    'thermal_active_pixels_frame_max':float(np.max(active)),
                    'thermal_frame_sum_mean_dl':float(np.mean(frame_sums)),
                    'thermal_frame_sum_max_dl':float(np.max(frame_sums)),
                  }
                  rows.append(row)
                  print('TRACK',row)

          expected_cases={'0','1.1','1.2','2.1','2.2','3.1','3.2'}
          if {r['process_case'] for r in rows} != expected_cases: raise SystemExit('Unexpected case set')
          for case in expected_cases:
              reps=sorted(r['repeat'] for r in rows if r['process_case']==case)
              if reps != [1,2,3]: raise SystemExit(f'Bad repeats for {case}: {reps}')
          for r in rows:
              for k in fields[6:]:
                  if not math.isfinite(float(r[k])): raise SystemExit(f'Non-finite {k} in {r["group"]}')

          out=Path('work/result/thermal_features.csv')
          with out.open('w',newline='',encoding='utf-8') as fh:
              w=csv.DictWriter(fh,fieldnames=fields); w.writeheader(); w.writerows(rows)
          print('FEATURE_ROWS',len(rows))
          print('FEATURE_COLUMNS',fields)
          PY

      - name: Upload frozen feature evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambench-e03-run3-frozen-features
          path: |
            work/logs/
            work/result/
          if-no-files-found: error
          retention-days: 30
