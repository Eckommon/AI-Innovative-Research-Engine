name: Probe US-FTA-TRANSIT-N01 Schema

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-us-fta-transit-n01-schema.yml'
      - 'tools/probe_us_fta_transit_n01_schema.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify F01 terminal boundary
        run: |
          python -m py_compile tools/probe_us_fta_transit_n01_schema.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c == {
            'checkpoint_id':'CHK-20260916-US-FTA-TRANSIT-F01-TERMINAL',
            'active_issue':'none',
            'active_research':'NONE',
            'last_completed_issue':147,
            'last_completed_research':'US-FTA-TRANSIT-F01',
            'last_decision':'DEC-207',
            'updated':'2026-09-16',
          }
          assert 'PASS_US_FTA_TRANSIT_F01_AGENCY_MODE_TIME_JOIN_READY' in Path('research/US-FTA-TRANSIT-F01/RESULT.md').read_text()
          print('N01_SCHEMA_PREFLIGHT_BOUNDARY_PASS')
          PY

      - name: Probe official metadata only
        run: python tools/probe_us_fta_transit_n01_schema.py

      - name: Verify no outcome values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/US-FTA-TRANSIT-N01/SCHEMA_PREFLIGHT.json')
          r=json.loads(p.read_text())
          assert r['protocol']=='US-FTA-TRANSIT-N01-SCHEMA-PREFLIGHT'
          assert r['outcome_values_opened'] is False
          assert r['relationship_computed'] is False
          assert r['incremental_monetary_cost_usd']==0
          assert set(r['sources'])=={'breakdowns','monthly_modal','major_safety_events'}
          assert r['sources']['breakdowns']['dataset_id']=='amkt-4ehs'
          assert r['sources']['monthly_modal']['dataset_id']=='5ti2-5uiv'
          assert r['sources']['major_safety_events']['dataset_id']=='9ivb-8ae9'
          print('N01_SCHEMA_PREFLIGHT_OUTPUT_PASS')
          PY

      - name: Commit schema preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FTA-TRANSIT-N01/SCHEMA_PREFLIGHT.json
          git commit -m 'Record US-FTA-TRANSIT-N01 schema preflight'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm zero-cost boundary
        run: |
          echo 'Official DOT/FTA metadata only; no safety outcome values queried.'
          echo 'Incremental monetary cost: 0 USD.'
