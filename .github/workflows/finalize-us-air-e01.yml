name: Finalize US AIR E01 durable SoT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-us-air-e01.yml'
      - 'tools/finalize_us_air_e01.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate finalizer
        run: python -m py_compile tools/finalize_us_air_e01.py

      - name: Validate committed Stage B and write durable final state
        run: python tools/finalize_us_air_e01.py

      - name: Commit final US-AIR-E01 SoT atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/US-AIR-E01/RESULT.md \
            research/US-AIR-E01/README.md \
            registry/CLM-137.md \
            registry/DEC-126.md \
            registry/CLAIM_LEDGER.md \
            registry/DECISION_LOG.md \
            STATUS.md \
            context/SESSION_HANDOFF.md \
            context/checkpoint.json
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "Finalize US-AIR-E01 relationship-tested pass and portfolio return"
            git push
          fi
