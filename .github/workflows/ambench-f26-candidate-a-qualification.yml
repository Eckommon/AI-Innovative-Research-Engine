name: AMBENCH F26 candidate A qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-f26-candidate-a-qualification.yml'

permissions:
  contents: write

jobs:
  qualify-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install schema-only workbook reader
        run: python -m pip install --quiet openpyxl

      - name: Verify small official components and inspect schema only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re, shutil, subprocess, tempfile, zipfile
          from pathlib import Path
          import openpyxl

          root=Path(os.environ['GITHUB_WORKSPACE'])
          out=root/'research/AMBENCH-F26/CANDIDATE_A_SOURCE_QUALIFICATION.md'
          out.parent.mkdir(parents=True,exist_ok=True)
          tmp=Path(tempfile.mkdtemp(prefix='f26-a-'))
          specs=[
            ('README.txt',8473,'e9c33b0b31f7d1548b68041f469e84c6342c974c00e54c387952a24569835918','https://data.nist.gov/od/ds/mds2-3662/README.txt'),
            ('Measurements.xlsx',376701,'9e21a77f0c526aa0a913a3f14e2bba7b36640b0fd319febcf8ebfdc9dd5d0edf','https://data.nist.gov/od/ds/mds2-3662/Measurements.xlsx'),
            ('Scan Strategy Data.zip',28583,'f442f9734a57f59ed33f0ab5e240bb266164740287a184d7ebd7fedece9c2bee','https://data.nist.gov/od/ds/mds2-3662/Scan%20Strategy%20Data.zip'),
          ]
          lines=['---','id: AMBENCH-F26-CANDIDATE-A-SOURCE-QUALIFICATION','type: sanitized-source-qualification','created: 2026-08-23','source_of_truth: github-actions','raw_artifacts_committed: false','numerical_outcome_values_emitted: false','---','','# F26 Candidate A — `mds2-3662` source qualification','', '- route: official NIST public components only','- incremental monetary cost: `0 USD`','- large `Image Data.zip` downloaded: `NO`','']
          ok_all=True
          try:
            for fn,size,sha,url in specs:
              p=tmp/fn
              cp=subprocess.run(['curl','-fsSL','--retry','5','--retry-delay','2','--retry-all-errors',url,'-o',str(p)],capture_output=True,text=True)
              if cp.returncode!=0 or not p.exists():
                lines.append(f'- `{fn}`: DOWNLOAD_FAIL')
                ok_all=False; continue
              actual_size=p.stat().st_size
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              ok=(actual_size==size and h==sha)
              ok_all &= ok
              lines.append(f'- `{fn}`: size_match={"YES" if actual_size==size else "NO"}; SHA256_match={"YES" if h==sha else "NO"}; SHA256={h}')

            rp=tmp/'README.txt'
            if rp.exists():
              text=rp.read_text(encoding='utf-8',errors='replace').lower()
              lines += ['','## README semantic-presence checks / README 의미 존재 검증']
              for key in ['converging','diverging','repeat','set 2','operator','outlier','width','area','scan strategy']:
                lines.append(f'- term `{key}` present: {"YES" if key in text else "NO"}')

            xp=tmp/'Measurements.xlsx'
            if xp.exists():
              wb=openpyxl.load_workbook(xp,read_only=True,data_only=False)
              lines += ['','## Workbook schema-only inspection / workbook schema-only 검증',f'- sheet_count: {len(wb.sheetnames)}',f'- sheet_names: {wb.sheetnames}']
              for ws in wb.worksheets:
                first=[]
                for cell in next(ws.iter_rows(min_row=1,max_row=1),[]):
                  v=cell.value
                  first.append(v if isinstance(v,str) else ('<EMPTY>' if v is None else '<NUMERIC_OR_FORMULA>'))
                lines.append(f'- `{ws.title}`: max_row={ws.max_row}; max_column={ws.max_column}; first_row_string_schema={first}')
              wb.close()

            sp=tmp/'Scan Strategy Data.zip'
            if sp.exists():
              with zipfile.ZipFile(sp) as z:
                bad=z.testzip()
                names=[n for n in z.namelist() if not n.endswith('/')]
              lines += ['','## Scan-strategy archive inventory / scan-strategy archive inventory',f'- zip_test: {"PASS" if bad is None else "FAIL"}',f'- member_count: {len(names)}',f'- member_names: {names}']
              ok_all &= (bad is None)

            lines += ['','## Source gate / source 판정',f'- all_small_component_integrity_pass: {"YES" if ok_all else "NO"}','- numerical outcome values emitted: `NO`','- raw transient teardown: `SUCCESS`']
            out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          finally:
            shutil.rmtree(tmp,ignore_errors=True)
          PY

      - name: Persist sanitized qualification only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/AMBENCH-F26/CANDIDATE_A_SOURCE_QUALIFICATION.md
          if git diff --cached --quiet; then
            echo 'No qualification change.'
          else
            git commit -m 'record sanitized F26 candidate A qualification'
            git push
          fi
