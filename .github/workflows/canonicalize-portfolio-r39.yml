name: Canonicalize PORTFOLIO-R39 Terminal Selection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonicalize-portfolio-r39.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen R39 evidence and completed Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 9d6a16975bc02638aae938f20b6591ffe02d1fa9^{commit}
          git cat-file -e a835ed4eb46cb6634f7c55408029651819a74748^{commit}
          git cat-file -e 776cf5702778cfd4e994a0c668b38f1dd6cd2019^{commit}
          git cat-file -e 1fc531a3537e70863989002b99f858380b63f229^{commit}
          gh issue view 162 --repo '${{ github.repository }}' --json state,stateReason --jq '.state + ":" + (.stateReason // "")' | grep -Eq '^CLOSED:(COMPLETED|completed)$'
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260918-US-FDIC-BRANCH-N01-TERMINAL'
          assert cp['last_decision']=='DEC-235'
          assert cp['last_completed_issue']==161
          s=Path('research/PORTFOLIO-R39/SCORECARD.md').read_text()
          assert '`US-IRS-EO-001` | 5 | 5 | 5 | 5 | 4 | 5 | 5 | 5 | 2 | **41** | **SELECT_F01**' in s
          assert 'candidate_outcomes_opened: false' in s
          PY
      - name: Build terminal canonical state
        run: python tools/canonicalize_portfolio_r39.py
      - name: Verify checkpoint mirrors
        run: python tools/check_checkpoint.py
      - name: Commit terminal canonical state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/DEC-236.md registry/DECISION_LOG.md context/checkpoint.json STATUS.md context/SESSION_HANDOFF.md
          git commit -m 'Canonicalize PORTFOLIO-R39 IRS EO selection'
      - name: Push canonical state
        run: git push origin HEAD:main
      - name: Confirm boundary
        run: |
          echo 'R39 science unchanged; IRS EO F01 selected 41/45.'
          echo 'Future automatic-revocation membership unopened; prior nonfiling exposure prohibited; cost=0 USD.'
