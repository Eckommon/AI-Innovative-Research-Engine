name: US WW F01 CWNS Popup Probe

on:
  push:
    branches: [main]
    paths:
      - 'tools/probe_us_ww_f01_cwns_popup.py'
      - '.github/workflows/us-ww-f01-cwns-popup-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe
        run: python -m py_compile tools/probe_us_ww_f01_cwns_popup.py
      - name: Inspect nationwide CSV popup route
        run: python tools/probe_us_ww_f01_cwns_popup.py
      - name: Commit popup route artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WW-F01/CWNS_NATIONAL_POPUP_ROUTE.json
          git diff --cached --quiet || git commit -m 'Inspect US-WW-F01 CWNS national CSV popup route'
          git push
