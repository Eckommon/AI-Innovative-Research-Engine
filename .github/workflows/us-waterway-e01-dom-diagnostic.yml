name: US WATERWAY E01 DOM diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-waterway-e01-dom-diagnostic.yml'
      - 'tools/us_waterway_e01_dom_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic
        run: python -m py_compile tools/us_waterway_e01_dom_diagnostic.py
      - name: Install browser dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Run outcome-blind DOM diagnostic
        run: python tools/us_waterway_e01_dom_diagnostic.py
      - name: Commit structural diagnostic only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WATERWAY-E01/STAGE_A_DOM_DIAGNOSTIC.json research/US-WATERWAY-E01/STAGE_A_DOM_DIAGNOSTIC.md
          git commit -m 'Record US-WATERWAY-E01 DOM diagnostic'
          git push
