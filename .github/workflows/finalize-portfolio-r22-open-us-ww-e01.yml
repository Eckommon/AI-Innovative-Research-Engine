name: Finalize PORTFOLIO R22 and Open US WW E01

on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_portfolio_r22_open_us_ww_e01.py'
      - '.github/workflows/finalize-portfolio-r22-open-us-ww-e01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate finalizer
        run: python -m py_compile tools/finalize_portfolio_r22_open_us_ww_e01.py
      - name: Finalize R22 selection and authorize E01
        run: python tools/finalize_portfolio_r22_open_us_ww_e01.py
      - name: Commit canonical transition atomically
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json registry/CLAIM_LEDGER.md registry/DECISION_LOG.md registry/CLM-159.md registry/DEC-163.md registry/DEC-164.md research/PORTFOLIO-R22/RESULT.md research/US-WW-E01/README.md
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Select US-WW-E01 and authorize preregistered test"
          git push origin HEAD:main
