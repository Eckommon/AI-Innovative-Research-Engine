name: PORTFOLIO R15 USGS negative-discharge probe

on:
  push:
    branches: [main]
    paths:
      - 'tools/portfolio_r15_usgs_negative_probe.py'
      - '.github/workflows/portfolio-r15-usgs-negative-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe
        run: python -m py_compile tools/portfolio_r15_usgs_negative_probe.py
      - name: Run outcome-blind source-semantics probe
        run: python tools/portfolio_r15_usgs_negative_probe.py
      - name: Commit derived R15 probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/PORTFOLIO-R15/USGS_NEGATIVE_DISCHARGE_SEMANTICS.json research/PORTFOLIO-R15/USGS_NEGATIVE_DISCHARGE_SEMANTICS.md
          git diff --cached --quiet || git commit -m 'Record R15 USGS negative-discharge source semantics'
          git push
