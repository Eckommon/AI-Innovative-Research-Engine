name: Activate PORTFOLIO-R35

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-portfolio-r35.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pre-Issue contract and live Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git log -1 --format=%H -- research/PORTFOLIO-R35/README.md)" = "4febd519dfae899897bed8d2c8ab45edb85fb33c"
          test "$(gh api repos/${GITHUB_REPOSITORY}/issues/153 --jq .state)" = "open"
          python - <<'PY'
          from pathlib import Path
          p=Path('research/PORTFOLIO-R35/README.md').read_text()
          assert 'candidate_outcomes_opened: false' in p
          assert 'Exactly four candidates are authorized' in p
          assert 'scorecard exactly once' in p.lower()
          print('PORTFOLIO_R35_PREISSUE_VERIFY_PASS')
          PY

      - name: Activate canonical state
        run: python tools/activate_portfolio_r35.py

      - name: Verify active mirrors
        run: |
          python tools/check_checkpoint.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['active_issue']==153
          assert c['active_research']=='PORTFOLIO-R35'
          assert c['last_decision']=='DEC-218'
          assert 'PORTFOLIO_R35_ACTIVE__SOURCE_LITERATURE_REVALIDATION_PENDING' in Path('STATUS.md').read_text()
          print('PORTFOLIO_R35_ACTIVE_MIRRORS_PASS')
          PY

      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions-bot@users.noreply.github.com'
          git add STATUS.md context/checkpoint.json context/SESSION_HANDOFF.md registry/DEC-218.md registry/DECISION_LOG.md
          git commit -m 'Activate PORTFOLIO-R35'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm outcome firewall
        run: echo 'Candidate outcomes remain unopened; only source/literature revalidation is authorized.'
