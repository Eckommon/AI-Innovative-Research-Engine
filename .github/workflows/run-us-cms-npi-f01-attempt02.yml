name: Run US-CMS-NPI-F01 Attempt 02
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-cms-npi-f01-attempt02.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  cms-npi-f01-attempt02:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify correction boundary and evidence slots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 18646fff22a499fedb058df397269281e62793b8^{commit}
          git cat-file -e 2f3325e4d7c0a3f664ef600752f68ad4ebc59df3^{commit}
          git cat-file -e 1f314a9d23877b5e0b11e027766c5097853eff68^{commit}
          gh issue view 201 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test -e research/US-CMS-NPI-F01/evidence/attempt-01.json
          test ! -e research/US-CMS-NPI-F01/evidence/attempt-02.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/US-CMS-NPI-F01/evidence/attempt-01.json').read_text())
          assert a['attempt_valid'] is False
          assert a['implementation_error']['message']=='DEACTIVATION_CSV_NOT_FOUND'
          assert all(g['pass'] for g in a['gates'] if g['gate']<=12)
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261013-US-CMS-NPI-F01-ACTIVE'
          assert cp['active_issue']==201
          assert cp['last_decision']=='DEC-314'
          corr=Path('research/US-CMS-NPI-F01/IMPLEMENTATION_CORRECTION_02.md').read_text()
          assert 'scientific_threshold_changed: false' in corr
          assert 'identity_rule_changed: false' in corr
          assert 'future_update_firewall_changed: false' in corr
          PY
      - name: Install deterministic XLSX parser dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'openpyxl==3.1.5'
      - name: Execute frozen Attempt 02
        run: python tools/run_us_cms_npi_f01_attempt02.py
      - name: Verify future-update and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-CMS-NPI-F01/evidence/attempt-02.json').read_text())
          assert e['weekly_body_opened'] is False
          assert e['later_monthly_body_opened'] is False
          assert e['future_deactivation_membership_opened'] is False
          assert e['future_entity_rows_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['deactivation_history_exposure_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 02 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-CMS-NPI-F01/evidence/attempt-02.json research/US-CMS-NPI-F01/evidence/attempt-02.md
          git commit -m 'Record US-CMS-NPI-F01 immutable attempt 02'
          git push origin HEAD:main
