name: Activate US-BRIDGE-N01 Canonical State

on:
  push:
    branches: [main]
    paths:
      - 'tools/activate_us_bridge_n01.py'
      - '.github/workflows/activate-us-bridge-n01.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile activation
        run: python -m py_compile tools/activate_us_bridge_n01.py
      - name: Verify Issue 131 is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api repos/${{ github.repository }}/issues/131 --jq .state)
          test "$state" = "open"
      - name: Activate canonical N01 state
        run: python tools/activate_us_bridge_n01.py
      - name: Verify checkpoint schema and mirrors
        run: |
          python tools/check_checkpoint.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert set(c) == {'checkpoint_id','active_issue','active_research','last_completed_issue','last_completed_research','last_decision','updated'}
          assert c['active_issue'] == 131
          assert c['active_research'] == 'US-BRIDGE-N01'
          assert c['last_decision'] == 'DEC-178'
          assert '`DEC-178`' in Path('registry/DECISION_LOG.md').read_text()
          print('US_BRIDGE_N01_ACTIVATION_VERIFY_PASS')
          PY
      - name: Commit activation atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json registry/DECISION_LOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate US-BRIDGE-N01 outcome-blind design gate'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Confirm COST-001 boundary
        run: |
          echo 'Standard public-repository GitHub-hosted runner only.'
          echo 'Incremental monetary cost: 0 USD.'
