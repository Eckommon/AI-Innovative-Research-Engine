name: US WATERWAY E02 Stage B

on:
  push:
    branches: [main]
    paths:
      - 'tools/us_waterway_e02_stage_b.py'
      - '.github/workflows/us-waterway-e02-stage-b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner
        run: python -m py_compile tools/us_waterway_e01_stage_b.py tools/us_waterway_e02_stage_b.py
      - name: Install numerical and browser dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy selenium
      - name: Run frozen E02 signed-flow Stage B
        run: python tools/us_waterway_e02_stage_b.py
      - name: Commit derived E02 Stage B artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WATERWAY-E02/STAGE_B_SOURCE_MANIFEST.json research/US-WATERWAY-E02/STAGE_B_PRIMARY_RESULT.json research/US-WATERWAY-E02/STAGE_B_GAGE_YEAR_PANEL.csv research/US-WATERWAY-E02/STAGE_B_GAGE_QUALITY.csv research/US-WATERWAY-E02/STAGE_B_SENSITIVITY_RESULT.json research/US-WATERWAY-E02/STAGE_B_RESULT.md
          git diff --cached --quiet || git commit -m 'Record US-WATERWAY-E02 signed-flow Stage B result'
          git push
