name: Finalize PORTFOLIO R23 and Open US RCRA F01

on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_portfolio_r23_open_us_rcra_f01.py'
      - '.github/workflows/finalize-portfolio-r23-open-us-rcra-f01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate finalizer
        run: python -m py_compile tools/finalize_portfolio_r23_open_us_rcra_f01.py
      - name: Finalize R23 selection and authorize RCRA F01
        run: python tools/finalize_portfolio_r23_open_us_rcra_f01.py
      - name: Commit canonical transition atomically
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json registry/CLAIM_LEDGER.md registry/DECISION_LOG.md registry/CLM-161.md registry/DEC-166.md registry/DEC-167.md research/PORTFOLIO-R23/RESULT.md research/US-RCRA-F01/README.md
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Select US-RCRA-F01 and authorize outcome-blind feasibility"
          git push origin HEAD:main
