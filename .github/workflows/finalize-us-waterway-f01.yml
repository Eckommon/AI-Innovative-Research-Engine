name: Finalize US WATERWAY F01 JOIN_READY

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-us-waterway-f01.yml'
      - 'tools/finalize_us_waterway_f01.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate finalizer
        run: python -m py_compile tools/finalize_us_waterway_f01.py
      - name: Finalize from committed outcome-blind evidence
        run: python tools/finalize_us_waterway_f01.py
      - name: Commit durable US-WATERWAY-F01 SoT atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WATERWAY-F01/RESULT.md research/US-WATERWAY-F01/README.md registry/CLM-141.md registry/DEC-135.md registry/CLAIM_LEDGER.md registry/DECISION_LOG.md STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize US-WATERWAY-F01 JOIN_READY pass and portfolio return'
          git push
