name: Probe US-FTA-TRANSIT-N01 Quality Flags

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-us-fta-transit-n01-quality-flags.yml'
      - 'tools/probe_us_fta_transit_n01_quality_flags.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify F01 terminal and schema preflight
        run: |
          python -m py_compile tools/probe_us_fta_transit_n01_quality_flags.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['checkpoint_id']=='CHK-20260916-US-FTA-TRANSIT-F01-TERMINAL'
          assert c['active_issue']=='none'
          s=json.loads(Path('research/US-FTA-TRANSIT-N01/SCHEMA_PREFLIGHT.json').read_text())
          assert s['outcome_values_opened'] is False
          assert s['relationship_computed'] is False
          print('N01_QUALITY_PREFLIGHT_BOUNDARY_PASS')
          PY

      - name: Probe categorical quality/scope fields only
        run: python tools/probe_us_fta_transit_n01_quality_flags.py

      - name: Verify no exposure magnitude or safety outcome persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/US-FTA-TRANSIT-N01/QUALITY_FLAG_PREFLIGHT.json').read_text())
          assert r['exposure_magnitudes_persisted'] is False
          assert r['safety_outcome_values_opened'] is False
          assert r['relationship_computed'] is False
          assert r['incremental_monetary_cost_usd']==0
          assert set(r['fields'])=={
            'type_of_service','reporter_type','major_mechanical_failures_1','vehicle_passenger_car_miles_2'
          }
          print('N01_QUALITY_PREFLIGHT_OUTPUT_PASS')
          PY

      - name: Commit quality-flag preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FTA-TRANSIT-N01/QUALITY_FLAG_PREFLIGHT.json
          git commit -m 'Record US-FTA-TRANSIT-N01 quality flag preflight'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm zero-cost boundary
        run: |
          echo 'Only categorical Breakdown scope/quality flags were queried.'
          echo 'No safety outcome values or exposure magnitudes were persisted.'
          echo 'Incremental monetary cost: 0 USD.'
