name: US-BRIDGE-F01 Route-v2 Outcome-Blind Feasibility

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_us_bridge_f01_v2.py'
      - '.github/workflows/us-bridge-f01-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-f01-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile frozen runner and route wrapper
        run: python -m py_compile tools/run_us_bridge_f01.py tools/run_us_bridge_f01_v2.py
      - name: Run frozen F01 with archive-generation route compatibility
        run: python tools/run_us_bridge_f01_v2.py
      - name: Verify outcome-blind invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/US-BRIDGE-F01/EXECUTION_RESULT.json').read_text())
          m=json.loads(Path('research/US-BRIDGE-F01/SOURCE_MANIFEST.json').read_text())
          assert r['condition_rating_values_opened'] is False
          assert r['condition_rating_row_bytes_sliced'] is False
          assert r['relationship_computed'] is False
          assert r['fuzzy_repair_used'] is False
          assert r['incremental_monetary_cost_usd'] == 0
          assert r['raw_source_bytes_persisted'] is False
          assert m['condition_values_accessed'] is False
          assert all(x['condition_values_accessed'] is False for x in m['annual_sources'])
          print('US_BRIDGE_F01_V2_OUTCOME_BLIND_VERIFY_PASS', r['gate'])
          PY
      - name: Commit durable derived evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-BRIDGE-F01/EXECUTION_RESULT.json research/US-BRIDGE-F01/SOURCE_MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Execute US-BRIDGE-F01 outcome-blind feasibility gate'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
      - name: Confirm COST-001 boundary
        run: |
          echo 'Standard public-repository GitHub-hosted runner only.'
          echo 'No paid API, larger/GPU runner, or artifact upload.'
