name: US AIR F01 full-year support verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-air-f01-full-year-support.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate reusable runner
        run: python -m py_compile tools/us_air_f01_support.py

      - name: Run outcome-blind full-year identity and DATE support
        run: python tools/us_air_f01_support.py

      - name: Commit derived support manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/US-AIR-F01/DERIVED_AIRPORT_SEQ_STATION_MAP.csv \
            research/US-AIR-F01/DERIVED_AIRPORT_SUPPORT.csv \
            research/US-AIR-F01/DERIVED_NOAA_DATE_SUPPORT.csv \
            research/US-AIR-F01/FINAL_SUPPORT_AIRPORTS.csv \
            research/US-AIR-F01/FULL_YEAR_DATE_SUPPORT.md
          if git diff --cached --quiet; then
            echo "No support-manifest changes"
          else
            git commit -m "Record US-AIR-F01 full-year identity and DATE support"
            git push
          fi
