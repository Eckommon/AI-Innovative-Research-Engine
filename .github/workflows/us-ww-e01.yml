name: US WW E01 Preregistered Experiment

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_us_ww_e01.py'
      - '.github/workflows/us-ww-e01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install zero-cost runtime libraries
        run: python -m pip install --disable-pip-version-check numpy selenium
      - name: Validate runner
        run: python -m py_compile tools/run_us_ww_e01.py
      - name: Execute preregistered two-pass experiment
        run: python tools/run_us_ww_e01.py
      - name: Commit derived result only
        shell: bash
        run: |
          test -f research/US-WW-E01/EXECUTION_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/US-WW-E01/EXECUTION_RESULT.json
          git diff --cached --quiet && { echo 'No derived result to commit'; exit 1; }
          git commit -m "Record US-WW-E01 preregistered result"
          git push origin HEAD:main
