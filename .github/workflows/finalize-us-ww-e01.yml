name: Finalize US WW E01

on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_us_ww_e01.py'
      - '.github/workflows/finalize-us-ww-e01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate finalizer
        run: python -m py_compile tools/finalize_us_ww_e01.py
      - name: Finalize terminal result and Stage 0 return
        run: python tools/finalize_us_ww_e01.py
      - name: Commit canonical closure atomically
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json registry/CLAIM_LEDGER.md registry/DECISION_LOG.md registry/CLM-160.md registry/DEC-165.md research/US-WW-E01/README.md research/US-WW-E01/RESULT.md
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Finalize US-WW-E01 no-positive result and return Stage 0"
          git push origin HEAD:main
