name: Run US-EPA-SDWIS-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-epa-sdwis-f01.yml'
  workflow_dispatch:
  issues:
    types: [edited]
permissions:
  contents: write
  issues: read
jobs:
  sdwis-f01:
    if: github.event_name != 'issues' || github.event.issue.number == 182
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 5546edebea1c09f68eb98075b286b3f20bd69b46^{commit}
          gh issue view 182 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-EPA-SDWIS-F01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260930-US-EPA-SDWIS-F01-ACTIVE'
          assert cp['active_issue']==182
          assert cp['active_research']=='US-EPA-SDWIS-F01'
          assert cp['last_decision']=='DEC-274'
          contract=Path('research/US-EPA-SDWIS-F01/README.md').read_text()
          assert 'future_health_based_violation_membership_opened: false' in contract
          assert '18/18 PASS' in contract
          PY
      - name: Install deterministic HTTP parser dependency
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5'
      - name: Execute frozen 18-gate national SDWIS attempt
        env:
          SDWIS_F01_BOUND: '1'
          SDWIS_F01_CONTRACT_SHA: '5546edebea1c09f68eb98075b286b3f20bd69b46'
        run: python tools/run_us_epa_sdwis_f01.py
      - name: Verify future-refresh and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-EPA-SDWIS-F01/evidence/attempt-01.json').read_text())
          assert e['later_refresh_opened'] is False
          assert e['future_health_based_violation_membership_opened'] is False
          assert e['future_entity_rows_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['prohibited_compliance_enforcement_exposure_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-EPA-SDWIS-F01/evidence/attempt-01.json research/US-EPA-SDWIS-F01/evidence/attempt-01.md
          git commit -m 'Record US-EPA-SDWIS-F01 immutable attempt 01'
          git push origin HEAD:main
