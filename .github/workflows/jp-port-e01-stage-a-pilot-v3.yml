name: JP PORT E01 Stage A JMA pilot v3

on:
  push:
    paths:
      - ".github/workflows/jp-port-e01-stage-a-pilot-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request preregistered JMA variable from index session
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,http.cookiejar,json,hashlib,os,re,csv,io
          OUT="research/JP-PORT-E01/STAGE_A_PILOT_V3.md"
          ROOT="https://www.data.jma.go.jp/risk/obsdl/index.php"
          URL="https://www.data.jma.go.jp/risk/obsdl/show/table"
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          hdr={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          with opener.open(urllib.request.Request(ROOT,headers=hdr),timeout=60) as r:
              rootraw=r.read()
          data={
            "stationNumList":json.dumps(["s47401"]),
            "aggrgPeriod":1,
            "elementNumList":json.dumps([["302",""]]),
            "interAnnualType":1,
            "ymdList":json.dumps(["2019","2019","1","1","1","3"]),
            "optionNumList":json.dumps([]),
            "downloadFlag":"true",
            "rmkFlag":1,
            "disconnectFlag":1,
            "youbiFlag":0,
            "fukenFlag":0,
            "kijiFlag":0,
            "huukouFlag":0,
            "csvFlag":1,
            "jikantaiFlag":0,
            "jikantaiList":json.dumps([]),
            "ymdLiteral":1,
          }
          body=urllib.parse.urlencode(data).encode()
          req=urllib.request.Request(URL,data=body,headers={
              **hdr,"Content-Type":"application/x-www-form-urlencoded","Referer":ROOT
          })
          with opener.open(req,timeout=120) as r:
              raw=r.read();heads=dict(r.headers);fu=r.geturl()
          sample=None;enc=None
          for e in ("cp932","shift_jis","utf-8-sig","utf-8"):
              try:sample=raw.decode(e);enc=e;break
              except:pass
          is_html=bool(sample and ("<html" in sample.lower() or "<!doctype" in sample.lower()))
          # If CSV, preserve header names and quality/homogeneity layout, mask data values.
          preview=[]
          if sample and not is_html:
              rows=list(csv.reader(io.StringIO(sample)))
              for i,row in enumerate(rows[:10]):
                  if i<5:preview.append(row)
                  else:preview.append(["<CELL>" if x.strip() else "" for x in row])
          else:
              for ln in (sample or "").splitlines():
                  if any(k in ln for k in ["エラー","地点","項目","期間","選択","table","CSV"]):
                      preview.append([re.sub(r"\d+(?:\.\d+)?","<NUM>",ln.strip())[:1200]])
                      if len(preview)>=30:break
          lines=["---","id: JP-PORT-E01-STAGE-A-PILOT-V3","created: 2026-09-04",
                 "relationship_outcome_computed: false","stage: A_PILOT",
                 "incremental_monetary_cost_usd: 0","---","",
                 "# JP-PORT-E01 Stage A Pilot V3","",
                 f"- session root: {ROOT}",
                 f"- cookies set: {[c.name for c in jar]}",
                 f"- response final URL: {fu}",
                 f"- content-type: {heads.get('Content-Type')}",
                 f"- content-disposition: {heads.get('Content-Disposition')}",
                 f"- raw bytes: **{len(raw)}**",
                 f"- raw SHA-256: {hashlib.sha256(raw).hexdigest()}",
                 f"- decoded: {enc}",
                 f"- classified HTML: **{is_html}**","",
                 "## Sanitized schema preview",""]
          for x in preview:lines.append("- "+repr(x))
          lines += ["","No cargo data or weather-throughput relationship was accessed.","",
                    "Incremental monetary cost remained **0 USD**.",""]
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          open(OUT,"w",encoding="utf-8").write("\n".join(lines))
          PY
      - name: Commit pilot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/JP-PORT-E01/STAGE_A_PILOT_V3.md
          git diff --cached --quiet || git commit -m "record JP-PORT-E01 Stage A pilot v3"
          git push
