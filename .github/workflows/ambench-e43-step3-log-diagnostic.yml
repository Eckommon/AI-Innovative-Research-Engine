name: AMBENCH E43 step3 failure-log diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-e43-step3-log-diagnostic.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract historical Step 3 error evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/AMBENCH-E43
          python - <<'PY'
          import io, os, re, urllib.request, zipfile
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          run_id=32648786267
          url=f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/logs'
          req=urllib.request.Request(url,headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'AI-Innovative-Research-Engine/E43-log-diagnostic',
          })
          with urllib.request.urlopen(req,timeout=90) as r:
              raw=r.read()
          z=zipfile.ZipFile(io.BytesIO(raw))
          members=z.namelist()
          texts=[]
          for name in members:
              txt=z.read(name).decode('utf-8',errors='replace')
              if 'Reconstruct and verify frozen F42 inputs' in txt or 'input_meta' in txt or 'Traceback' in txt:
                  texts.append((name,txt))
          patterns=re.compile(r'(Traceback|Error|Exception|mismatch|HTTP|timed out|timeout|exit code|Process completed with exit code|urllib|URLError|HTTPError|ValueError|KeyError|AssertionError)',re.I)
          evidence=[]
          for name,txt in texts:
              lines=txt.splitlines()
              idx=[i for i,l in enumerate(lines) if patterns.search(l)]
              keep=set()
              for i in idx:
                  keep.update(range(max(0,i-3),min(len(lines),i+4)))
              for i in sorted(keep):
                  line=lines[i]
                  # defensive masking for any token-like authorization material
                  line=re.sub(r'(?i)(authorization:|bearer)\s+\S+',r'\1 [MASKED]',line)
                  evidence.append(f'[{name}] {line}')
          if not evidence:
              for name,txt in texts:
                  for line in txt.splitlines()[-40:]:
                      evidence.append(f'[{name}] {line}')
          # bound persisted diagnostic text
          evidence=evidence[-160:]
          lines=[
              '---',
              'id: AMBENCH-E43-STEP3-FAILURE-DIAGNOSTIC',
              'type: historical-input-step-error-diagnostic',
              'created: 2026-09-03',
              'historical_run_id: 32648786267',
              'performance_output_accessed: false',
              'experiment_contract_changed: false',
              'incremental_monetary_cost_usd: 0',
              '---','',
              '# AMBENCH-E43 Step 3 Failure Diagnostic / Step 3 실패 진단','',
              'Only historical input-reconstruction error evidence is persisted. No simulator performance output was executed in the historical run.','',
              '```text', *evidence, '```',''
          ]
          Path('research/AMBENCH-E43/STEP3_FAILURE_DIAGNOSTIC.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Persist diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/AMBENCH-E43/STEP3_FAILURE_DIAGNOSTIC.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'record AMBENCH-E43 step3 failure diagnostic'
          git push
