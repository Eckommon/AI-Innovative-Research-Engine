name: EU-STEEL-R01 PR Reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/EU-STEEL-R01/TRIGGER.md'
      - '.github/workflows/eu-steel-r01-pr.yml'

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe discontinued DS-066342 official endpoints
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p work/legacy work/logs
          : > work/logs/probe.txt
          probe () {
            name="$1"; url="$2"; out="work/legacy/$name"
            echo "===== $name =====" | tee -a work/logs/probe.txt
            echo "$url" | tee -a work/logs/probe.txt
            code=$(curl -sS -L -w '%{http_code}' -o "$out" "$url")
            echo "HTTP=$code BYTES=$(wc -c < "$out")" | tee -a work/logs/probe.txt
            head -c 3000 "$out" | tr '\n' ' ' | tee -a work/logs/probe.txt
            echo | tee -a work/logs/probe.txt
          }
          probe comext_2017.json 'https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/DS-066342?lang=EN&time=2017&product=2410T121'
          probe comext_2008.json 'https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/DS-066342?lang=EN&time=2008&product=2410T121'
          probe dataflow.xml 'https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/dataflow/ESTAT/DS-066342/latest?detail=allstubs'
          probe regular_2017.json 'https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/DS-066342?lang=EN&time=2017&product=2410T121'
          probe landing.html 'https://ec.europa.eu/eurostat/web/products-datasets/-/DS-066342'
          sha256sum work/legacy/* | tee work/logs/sha256.txt

      - name: Upload legacy endpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-steel-r01-run9-legacy-endpoints
          path: |
            work/legacy/
            work/logs/
          retention-days: 30
