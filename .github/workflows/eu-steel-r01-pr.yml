name: EU-STEEL-R01 PR Reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/EU-STEEL-R01/TRIGGER.md'
      - 'src/reproduce_eu_steel_mercury.py'
      - '.github/workflows/eu-steel-r01-pr.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official EEA and Eurostat raw inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/raw work/extracted work/logs work/targets
          EPRTR='https://sdi.eea.europa.eu/webdav/datastore/public/eea_t_ied-eprtr_p_2007-2022_v11_r00/User%20friendly%20.csv%20file/F1_3_Total%20Release%20at%20E-PRTR%20Annex%20I%20Activity%20into%20Air.csv'
          BASE='https://ec.europa.eu/eurostat/api/dissemination/files?file=comext/COMEXT_OTHER_DATA/EUROPROMS'
          curl -fL --retry 3 "$EPRTR" -o work/raw/eprtr_F1_3.csv
          curl -fL --retry 3 "$BASE/epanntotal-r2.zip" -o work/raw/epanntotal-r2.zip
          curl -fL --retry 3 "$BASE/epanntotal.zip" -o work/raw/epanntotal.zip
          sha256sum work/raw/* | tee work/logs/sha256.txt
          ls -lh work/raw | tee work/logs/files.txt

      - name: Extract target rows and inspect schemas
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/inspect.txt
          from pathlib import Path
          import pandas as pd, zipfile

          targets=['2410T121','2410T122','2410T131','2410T132','2410T141','2410T142']
          acts=['1(d)','2(a)','2(b)']

          e=Path('work/raw/eprtr_F1_3.csv')
          edf=pd.read_csv(e,dtype=str)
          print('EPRTR_COLUMNS',edf.columns.tolist())
          norm_act=edf['EPRTRAnnexIMainActivityCode'].str.replace('.','',regex=False).str.replace(' ','',regex=False)
          pol=edf['pollutant'].str.lower()
          years=edf['reportingYear'].isin(['2008','2017'])
          esub=edf[years & norm_act.isin(acts) & pol.str.contains('mercur',na=False)].copy()
          esub.to_csv('work/targets/eprtr_mercury_2008_2017.csv',index=False)
          print('EPRTR_TARGET_ROWS',len(esub))
          print('EPRTR_COUNTRIES',sorted(esub.countryName.dropna().unique().tolist()))
          print('EPRTR_TOTALS_KG',esub.groupby('reportingYear')['emissions'].apply(lambda x: pd.to_numeric(x,errors='coerce').sum()).to_dict())
          print(esub.to_string(index=False))

          for name in ['epanntotal-r2.zip','epanntotal.zip']:
              zp=Path('work/raw')/name
              with zipfile.ZipFile(zp) as z:
                  members=[n for n in z.namelist() if not n.endswith('/')]
                  print('ZIP',name,'MEMBERS',members)
                  for member in members:
                      out=Path('work/extracted')/(name.replace('.zip','')+'__'+Path(member).name)
                      out.write_bytes(z.read(member))
                      try:
                          df=pd.read_csv(out,dtype=str)
                      except Exception as ex:
                          print('READ_FAIL',out.name,repr(ex)); continue
                      print('FILE',out.name,'COLUMNS',df.columns.tolist(),'ROWS',len(df))
                      if 'PERIOD' in df.columns and 'PRCCODE' in df.columns:
                          print('PERIOD_MINMAX',df.PERIOD.dropna().min(),df.PERIOD.dropna().max())
                          sub=df[df.PRCCODE.isin(targets) & df.PERIOD.str[:4].isin(['2008','2017'])].copy()
                          sub.to_csv('work/targets/'+out.stem+'_targets.csv',index=False)
                          print('TARGET_ROWS',len(sub),'PERIOD_COUNTS',sub.PERIOD.value_counts().to_dict())
                          print('TARGET_QNTUNIT',sub.QNTUNIT.value_counts(dropna=False).to_dict() if 'QNTUNIT' in sub else {})
                          print('TARGET_DECL',sorted(sub.DECL.dropna().unique().tolist()) if 'DECL' in sub else [])
                          print(sub.to_string(index=False))
          PY

      - name: Upload target evidence
        uses: actions/upload-artifact@v4
        with:
          name: eu-steel-r01-target-evidence
          path: |
            work/logs/
            work/targets/
            work/extracted/
          retention-days: 30
