name: EU-STEEL-R01 PR Reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/EU-STEEL-R01/TRIGGER.md'
      - 'src/reproduce_eu_steel_mercury.py'
      - '.github/workflows/eu-steel-r01-pr.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Query current Eurostat PRODCOM dataset
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p work/api work/logs
          BASE='https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/DS-059359'
          : > work/logs/api_download.txt
          for YEAR in 2008 2017; do
            for CODE in 2410T121 2410T122 2410T131 2410T132 2410T141 2410T142; do
              OUT="work/api/${YEAR}_${CODE}.json"
              echo "QUERY YEAR=$YEAR CODE=$CODE" | tee -a work/logs/api_download.txt
              curl -sS -L -G "$BASE" \
                --data-urlencode 'lang=EN' \
                --data-urlencode "time=$YEAR" \
                --data-urlencode "PRCCODE=$CODE" \
                -o "$OUT"
              STATUS=$?
              echo "CURL_EXIT=$STATUS BYTES=$(wc -c < "$OUT" 2>/dev/null || echo 0)" | tee -a work/logs/api_download.txt
              head -c 500 "$OUT" | tr '\n' ' ' | tee -a work/logs/api_download.txt
              echo | tee -a work/logs/api_download.txt
            done
          done

      - name: Inspect JSON-stat dimensions and values
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/api_inspect.txt
          from pathlib import Path
          import json, math

          for p in sorted(Path('work/api').glob('*.json')):
              print('\n===', p.name, '===')
              try:
                  obj=json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print('JSON_ERROR',repr(e),p.read_text(errors='replace')[:1000]); continue
              if isinstance(obj,dict) and ('error' in obj or 'errorCode' in obj):
                  print('API_ERROR',obj); continue
              print('TOP_KEYS',list(obj)[:30])
              print('ID',obj.get('id'))
              print('SIZE',obj.get('size'))
              print('LABEL',obj.get('label'))
              dim=obj.get('dimension',{})
              print('DIM_KEYS',list(dim))
              for dk,dv in dim.items():
                  cat=(dv or {}).get('category',{}) if isinstance(dv,dict) else {}
                  idx=cat.get('index')
                  labels=cat.get('label')
                  print('DIM',dk,'LABEL',(dv or {}).get('label') if isinstance(dv,dict) else None)
                  print('  INDEX',idx)
                  if isinstance(labels,dict):
                      sample=list(labels.items())[:120]
                      print('  LABELS_SAMPLE',sample)
              vals=obj.get('value')
              status=obj.get('status')
              if isinstance(vals,list):
                  nonnull=[(i,v) for i,v in enumerate(vals) if v is not None]
                  print('NONNULL_COUNT',len(nonnull),'SAMPLE',nonnull[:80])
              elif isinstance(vals,dict):
                  print('VALUE_DICT_COUNT',len(vals),'SAMPLE',list(vals.items())[:80])
              else:
                  print('VALUE_TYPE',type(vals).__name__,vals)
              print('STATUS_SAMPLE',status if not isinstance(status,dict) else list(status.items())[:50])
          PY

      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-steel-r01-ds059359-evidence
          path: |
            work/api/
            work/logs/
          if-no-files-found: warn
          retention-days: 30
