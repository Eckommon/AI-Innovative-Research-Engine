name: EU-STEEL-R01 PR Reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/EU-STEEL-R01/TRIGGER.md'
      - 'src/reproduce_eu_steel_mercury.py'
      - '.github/workflows/eu-steel-r01-pr.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose DS-059359 Statistics API dimension names
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p work/api work/logs
          BASE='https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/DS-059359'
          : > work/logs/dimension_diagnostics.txt

          query () {
            NAME="$1"; shift
            OUT="work/api/${NAME}.json"
            echo "===== $NAME =====" | tee -a work/logs/dimension_diagnostics.txt
            echo "ARGS: $*" | tee -a work/logs/dimension_diagnostics.txt
            curl -sS -L -G "$BASE" --data-urlencode 'lang=EN' "$@" -o "$OUT"
            echo "BYTES=$(wc -c < "$OUT")" | tee -a work/logs/dimension_diagnostics.txt
            head -c 1200 "$OUT" | tr '\n' ' ' | tee -a work/logs/dimension_diagnostics.txt
            echo | tee -a work/logs/dimension_diagnostics.txt
          }

          query time_only --data-urlencode 'time=2017'
          query lower_prccode --data-urlencode 'time=2017' --data-urlencode 'prccode=2410T121'
          query lower_product --data-urlencode 'time=2017' --data-urlencode 'product=2410T121'
          query upper_PRODUCT --data-urlencode 'time=2017' --data-urlencode 'PRODUCT=2410T121'
          query lower_decl --data-urlencode 'time=2017' --data-urlencode 'decl=2028'
          query upper_DECL --data-urlencode 'time=2017' --data-urlencode 'DECL=2028'
          query lower_indicators --data-urlencode 'time=2017' --data-urlencode 'indicators=APRODQNT'
          query upper_INDICATORS --data-urlencode 'time=2017' --data-urlencode 'INDICATORS=APRODQNT'

      - name: Summarize accepted dimensions
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/dimension_summary.txt
          from pathlib import Path
          import json
          for p in sorted(Path('work/api').glob('*.json')):
              print('\n===',p.stem,'===')
              try:
                  o=json.loads(p.read_text())
              except Exception as e:
                  print('JSON_ERROR',repr(e)); continue
              if 'error' in o:
                  print('ERROR',o['error']); continue
              print('ID',o.get('id'))
              print('SIZE',o.get('size'))
              print('LABEL',o.get('label'))
              print('DIM_KEYS',list((o.get('dimension') or {}).keys()))
              for k,v in (o.get('dimension') or {}).items():
                  cat=(v or {}).get('category',{})
                  idx=cat.get('index')
                  labels=cat.get('label')
                  print('DIM',k,'LABEL',(v or {}).get('label'))
                  print(' INDEX',idx if not isinstance(idx,dict) or len(idx)<80 else list(idx.items())[:80])
                  if isinstance(labels,dict):
                      print(' LABELS',list(labels.items())[:80])
              vals=o.get('value')
              if isinstance(vals,dict): print('VALUES',len(vals),list(vals.items())[:30])
              elif isinstance(vals,list): print('VALUES',len(vals),[(i,x) for i,x in enumerate(vals) if x is not None][:30])
          PY

      - name: Upload dimension evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-steel-r01-dimension-diagnostics
          path: |
            work/api/
            work/logs/
          if-no-files-found: warn
          retention-days: 30
