name: EU-STEEL-R01 PR Reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/EU-STEEL-R01/TRIGGER.md'
      - 'src/reproduce_eu_steel_mercury.py'
      - '.github/workflows/eu-steel-r01-pr.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official EEA and Eurostat raw inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/raw work/extracted work/logs work/targets
          EPRTR='https://sdi.eea.europa.eu/webdav/datastore/public/eea_t_ied-eprtr_p_2007-2022_v11_r00/User%20friendly%20.csv%20file/F1_3_Total%20Release%20at%20E-PRTR%20Annex%20I%20Activity%20into%20Air.csv'
          BASE='https://ec.europa.eu/eurostat/api/dissemination/files?file=comext/COMEXT_OTHER_DATA/EUROPROMS'
          curl -fL --retry 3 "$EPRTR" -o work/raw/eprtr_F1_3.csv
          curl -fL --retry 3 "$BASE/epanntotal-r2.zip" -o work/raw/epanntotal-r2.zip
          curl -fL --retry 3 "$BASE/epanntotal.zip" -o work/raw/epanntotal.zip
          sha256sum work/raw/* | tee work/logs/sha256.txt
          ls -lh work/raw | tee work/logs/files.txt

      - name: Extract target rows and inspect schemas
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/inspect.txt
          from pathlib import Path
          import csv, zipfile, collections

          targets={'2410T121','2410T122','2410T131','2410T132','2410T141','2410T142'}
          acts={'1(d)','2(a)','2(b)'}

          # E-PRTR target rows
          with open('work/raw/eprtr_F1_3.csv',encoding='utf-8-sig',newline='') as f:
              r=csv.DictReader(f)
              print('EPRTR_COLUMNS',r.fieldnames)
              rows=[]
              totals=collections.defaultdict(float)
              countries=set()
              for row in r:
                  act=(row.get('EPRTRAnnexIMainActivityCode') or '').replace('.','').replace(' ','')
                  year=row.get('reportingYear') or ''
                  pol=(row.get('pollutant') or '').lower()
                  if year in {'2008','2017'} and act in acts and 'mercur' in pol:
                      rows.append(row); countries.add(row.get('countryName',''))
                      try: totals[year]+=float(row.get('emissions') or 0)
                      except ValueError: pass
          with open('work/targets/eprtr_mercury_2008_2017.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=r.fieldnames); w.writeheader(); w.writerows(rows)
          print('EPRTR_TARGET_ROWS',len(rows))
          print('EPRTR_COUNTRIES',sorted(countries))
          print('EPRTR_TOTALS_KG',dict(totals))
          for row in rows: print('EPRTR_TARGET',row)

          # PRODCOM targets from both legacy archives
          for zname in ['epanntotal-r2.zip','epanntotal.zip']:
              with zipfile.ZipFile('work/raw/'+zname) as z:
                  members=[n for n in z.namelist() if not n.endswith('/')]
                  print('ZIP',zname,'MEMBERS',members)
                  for member in members:
                      out=Path('work/extracted')/(zname.replace('.zip','')+'__'+Path(member).name)
                      out.write_bytes(z.read(member))
                      try:
                          with out.open(encoding='latin-1',newline='') as f:
                              rr=csv.DictReader(f)
                              headers=rr.fieldnames
                              allrows=list(rr)
                      except Exception as ex:
                          print('READ_FAIL',out.name,repr(ex)); continue
                      print('FILE',out.name,'COLUMNS',headers,'ROWS',len(allrows))
                      if not headers or 'PERIOD' not in headers or 'PRCCODE' not in headers: continue
                      periods=[x.get('PERIOD','') for x in allrows if x.get('PERIOD')]
                      print('PERIOD_MINMAX',min(periods),max(periods))
                      sub=[x for x in allrows if x.get('PRCCODE') in targets and x.get('PERIOD','')[:4] in {'2008','2017'}]
                      out_target=Path('work/targets')/(out.stem+'_targets.csv')
                      with out_target.open('w',encoding='utf-8',newline='') as f:
                          w=csv.DictWriter(f,fieldnames=headers); w.writeheader(); w.writerows(sub)
                      print('TARGET_ROWS',len(sub))
                      print('PERIOD_COUNTS',dict(collections.Counter(x.get('PERIOD') for x in sub)))
                      print('TARGET_QNTUNIT',dict(collections.Counter(x.get('QNTUNIT') for x in sub)))
                      print('TARGET_DECL',sorted({x.get('DECL') for x in sub}))
                      for row in sub: print('PRODCOM_TARGET',zname,row)
          PY

      - name: Upload target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-steel-r01-target-evidence
          path: |
            work/logs/
            work/targets/
            work/extracted/
          if-no-files-found: warn
          retention-days: 30
