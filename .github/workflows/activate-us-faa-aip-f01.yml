name: Activate US-FAA-AIP-F01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-us-faa-aip-f01.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pre-Issue contract and live Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 4f9a2a3491bc00c0fd1e00a7b0d3bc0bc62d4254^{commit}
          git show 4f9a2a3491bc00c0fd1e00a7b0d3bc0bc62d4254:research/US-FAA-AIP-F01/README.md | grep -q 'CONTRACT_FROZEN_PRE_ISSUE'
          test "$(git show -s --format=%ct 4f9a2a3491bc00c0fd1e00a7b0d3bc0bc62d4254)" -le "$(gh api repos/${GITHUB_REPOSITORY}/issues/154 --jq '.created_at' | xargs -I{} date -d {} +%s)"
          test "$(gh api repos/${GITHUB_REPOSITORY}/issues/154 --jq '.state')" = 'open'
      - name: Activate canonical state
        run: python tools/activate_us_faa_aip_f01.py
      - name: Verify active mirrors
        run: |
          python tools/check_checkpoint.py
          grep -q 'active_issue: 154' STATUS.md
          grep -q 'active_research: US-FAA-AIP-F01' context/SESSION_HANDOFF.md
          grep -q 'DEC-220' registry/DECISION_LOG.md
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md context/checkpoint.json context/SESSION_HANDOFF.md registry/DEC-220.md registry/DECISION_LOG.md
          git commit -m 'Activate US-FAA-AIP-F01'
          git push
      - name: Confirm outcome firewall
        run: |
          grep -q 'delay outcomes remain unopened' STATUS.md
          echo 'US-FAA-AIP-F01_ACTIVATION_PASS'
