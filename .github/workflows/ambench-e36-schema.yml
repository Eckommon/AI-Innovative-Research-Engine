name: AMBENCH E36 RHF analysis schema gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-e36-schema.yml'

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect checksum-frozen RHF analysis schemas only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, os, re, statistics, urllib.request, zipfile
          from collections import Counter
          from pathlib import Path

          DSID='mds2-2507'
          EXPECTED_SHA='306a3d26e6e77d6fef44b1bf7b1dd2c817560a84f21f27fc4cec8cdb10cabe59'
          DOCUMENTED_SCHEMA=[
              'X_mm','Y_mm','laser_power_W','scan_speed_mm_s',
              'melt_pool_area_px','melt_pool_length_px','melt_pool_width_px',
              'average_intensity_DL','spatter_count','spatter_area'
          ]
          root=Path(os.environ['GITHUB_WORKSPACE'])
          out=root/'research/AMBENCH-E36/SCHEMA_PREFLIGHT.md'
          out.parent.mkdir(parents=True,exist_ok=True)

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'AI-Innovative-Research-Engine/E36-schema-v2'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read()

          def lex_type(s):
              t=(s or '').strip()
              if not t:
                  return 'blank'
              try:
                  float(t)
                  return 'numeric-looking'
              except Exception:
                  return 'nonnumeric'

          meta=json.loads(fetch(f'https://data.nist.gov/od/id/{DSID}?format=nerdm').decode('utf-8'))
          comp=next(c for c in meta.get('components',[]) if c.get('filepath')=='RHF_Analysis_Results.zip')
          exp=(comp.get('checksum') or {}).get('hash')
          raw=fetch(comp['downloadURL'])
          got=hashlib.sha256(raw).hexdigest()
          size_ok=(len(raw)==comp.get('size'))
          hash_ok=(got==exp==EXPECTED_SHA)
          if not hash_ok:
              raise RuntimeError(f'RHF_Analysis_Results.zip checksum mismatch expected={exp} prereg={EXPECTED_SHA} got={got}')

          z=zipfile.ZipFile(io.BytesIO(raw))
          rx=re.compile(r'(?:^|/)DAQ_RHF_P(\d{2})_layer0001_T80_XYPVALWI\.csv$',re.I)
          members=[]
          for n in z.namelist():
              m=rx.search(n)
              if m:
                  members.append((int(m.group(1)),n,z.getinfo(n).file_size))
          members.sort()

          part_records=[]
          for pid,name,fsize in members:
              txt=z.read(name).decode('utf-8-sig',errors='replace')
              rows=list(csv.reader(io.StringIO(txt)))
              width=10
              types=[Counter() for _ in range(width)]
              nonempty=[0]*width
              ragged=0
              for row in rows:
                  if len(row)!=width:
                      ragged+=1
                  rr=row+['']*max(0,width-len(row))
                  for j in range(width):
                      val=rr[j] if j<len(rr) else ''
                      typ=lex_type(val)
                      types[j][typ]+=1
                      if typ!='blank':
                          nonempty[j]+=1
              part_records.append({
                  'part':pid,'name':name,'size':fsize,'rows':len(rows),
                  'ragged':ragged,'nonempty':nonempty,'types':[dict(c) for c in types]
              })

          pids=[x['part'] for x in part_records]
          exact55=(pids==list(range(1,56)))
          exact10_all=all(r['ragged']==0 for r in part_records) and len(part_records)==55

          required={'area':4,'length':5,'width':6}
          coverage={}
          for label,j in required.items():
              vals=[r['nonempty'][j] for r in part_records]
              numlooks=[r['types'][j].get('numeric-looking',0) for r in part_records]
              nonnum=[r['types'][j].get('nonnumeric',0) for r in part_records]
              blanks=[r['types'][j].get('blank',0) for r in part_records]
              coverage[label]={
                  'column_index_1based':j+1,
                  'documented_name':DOCUMENTED_SCHEMA[j],
                  'min_nonempty':min(vals) if vals else 0,
                  'median_nonempty':statistics.median(vals) if vals else 0,
                  'max_nonempty':max(vals) if vals else 0,
                  'parts_with_any_nonempty':sum(v>0 for v in vals),
                  'parts_with_numeric_looking':sum(v>0 for v in numlooks),
                  'total_nonnumeric_tokens':sum(nonnum),
                  'total_blank_tokens':sum(blanks),
              }

          occupancy_ok=all(coverage[k]['parts_with_numeric_looking']==55 for k in ('area','length','width'))
          nonnumeric_required_ok=all(coverage[k]['total_nonnumeric_tokens']==0 for k in ('area','length','width'))
          schema_pass=(size_ok and hash_ok and exact55 and exact10_all and occupancy_ok and nonnumeric_required_ok)

          lines=['---','id: AMBENCH-E36-SCHEMA-PREFLIGHT','type: schema-missingness-preflight','created: 2026-08-23','parser_version: v2_documented_headerless_positional_10col','raw_analysis_numerical_values_emitted: false','raw_analysis_statistics_computed: false','incremental_monetary_cost_usd: 0','---','',
                 '# AMBENCH-E36 RHF Analysis Schema Preflight / RHF 분석 Schema 사전점검','',
                 '## Boundary / 경계','- Checksum-frozen `RHF_Analysis_Results.zip` only.','- Numerical data cells are **not emitted** and no min/max/mean/median/std/correlation/group comparison is computed from result values.','- Official NIST data-description fixes these CSVs as headerless 10-column analysis sheets; this parser uses only that positional schema plus lexical occupancy counts.','',
                 '## Parser correction / parser 보정','- v1 incorrectly interpreted the first numerical row of each headerless CSV as a header.','- Official documented positional schema supersedes the v1 header assumption before any numerical outcome statistic is computed.','',
                 '## Source integrity / source 무결성',f'- dataset: `{DSID}`',f'- NERDm version: `{meta.get("version")}`',f'- archive_size_nerdm: `{comp.get("size")}`',f'- archive_size_local: `{len(raw)}`',f'- size_match: `{size_ok}`',f'- sha256_nerdm: `{exp}`',f'- sha256_preregistered: `{EXPECTED_SHA}`',f'- sha256_local: `{got}`',f'- checksum_match_all: `{hash_ok}`','',
                 '## Documented positional schema / 문서화 positional schema',f'- column_count: `10`',f'- schema: `{DOCUMENTED_SCHEMA}`','- columns 5–7 are documented by NIST as melt-pool area, length, and width; values are not emitted here.','',
                 '## Member identity / member identity',f'- matching_analysis_csv_count: `{len(part_records)}`',f'- part_ids: `{pids}`',f'- exact_P01_to_P55: `{exact55}`',f'- every_row_exactly_10_columns: `{exact10_all}`','- members:']
          for r in part_records:
              lines.append(f'  - `P{r["part"]:02d}` | path=`{r["name"]}` | size=`{r["size"]}` | data_rows=`{r["rows"]}` | non_10col_rows=`{r["ragged"]}`')

          lines += ['', '## Required physical-outcome column occupancy / 필수 물리 outcome 열 점유']
          for label in ('area','length','width'):
              c=coverage[label]
              lines += [f'### `{label}`',f'- column_index_1based: `{c["column_index_1based"]}`',f'- documented_name: `{c["documented_name"]}`',f'- min_nonempty_rows_per_part: `{c["min_nonempty"]}`',f'- median_nonempty_rows_per_part: `{c["median_nonempty"]}`',f'- max_nonempty_rows_per_part: `{c["max_nonempty"]}`',f'- parts_with_any_nonempty: `{c["parts_with_any_nonempty"]}`',f'- parts_with_numeric_looking_tokens: `{c["parts_with_numeric_looking"]}`',f'- total_blank_tokens: `{c["total_blank_tokens"]}`',f'- total_nonnumeric_tokens: `{c["total_nonnumeric_tokens"]}`','']

          lines += ['## Frozen schema gate / 고정 schema gate',f'- source_integrity: `{size_ok and hash_ok}`',f'- exact_part_coverage: `{exact55}`',f'- documented_10col_shape: `{exact10_all}`',f'- required_area_length_width_occupancy: `{occupancy_ok}`',f'- required_columns_numeric_lexical_type_only: `{nonnumeric_required_ok}`','']
          if schema_pass:
              lines += ['**PASS_E36_SCHEMA_READY**','- Numerical result cells remain unopened for statistical use.','- Next required action is to commit an outcome-still-unopened numerical-contract amendment before any result-value statistic is computed.','']
          else:
              lines += ['**HOLD_E36_SCHEMA_OR_IDENTITY_GAP**','- Numerical result access remains prohibited.','']

          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Persist sanitized E36 schema preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/AMBENCH-E36/SCHEMA_PREFLIGHT.md
          if git diff --cached --quiet; then
            echo 'No E36 schema-preflight change.'
          else
            git commit -m 'record AMBENCH-E36 corrected outcome-blind schema gate'
            git push
          fi
