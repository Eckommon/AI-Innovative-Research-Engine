name: Run US-SEC-IA-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-sec-ia-f01.yml'
  workflow_dispatch:
  issues:
    types: [edited]
permissions:
  contents: write
  issues: read
jobs:
  sec-ia-f01:
    if: github.event_name != 'issues' || github.event.issue.number == 187
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 2734008b75116779d410ffec1e3ca44343e3e1f9^{commit}
          gh issue view 187 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-SEC-IA-F01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260930-US-SEC-IA-F01-ACTIVE'
          assert cp['active_issue']==187
          assert cp['active_research']=='US-SEC-IA-F01'
          assert cp['last_decision']=='DEC-285'
          PY
      - name: Install deterministic parser dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5' 'beautifulsoup4==4.12.3'
      - name: Execute frozen Attempt 01
        env:
          SEC_IA_F01_BOUND: '1'
          SEC_IA_F01_CONTRACT_SHA: '2734008b75116779d410ffec1e3ca44343e3e1f9'
        run: python tools/run_us_sec_ia_f01.py
      - name: Verify outcome and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-SEC-IA-F01/evidence/attempt-01.json').read_text())
          assert e['post_cutoff_advw_body_opened'] is False
          assert e['future_advw_membership_opened'] is False
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['prohibited_withdrawal_exposure_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-SEC-IA-F01/evidence/attempt-01.json research/US-SEC-IA-F01/evidence/attempt-01.md
          git commit -m 'Record US-SEC-IA-F01 immutable attempt 01'
          git push origin HEAD:main
