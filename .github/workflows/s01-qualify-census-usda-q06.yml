name: S01-Q06 official four-Island-Areas source geography-scope proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s01-qualify-census-usda-q06.yml'
permissions:
  contents: write
concurrency:
  group: s01-census-usda-q06-original-once
  cancel-in-progress: false
jobs:
  prior-locked-scope-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prior frozen Q06 contract before any new unmatched prefix ID access
        run: |
          set -euo pipefail
          git cat-file -e 120930e4bb234ba0c6e652df1c9713fc94e3a2a6^{commit}
          test ! -e research/SOURCE-REGISTRY-S01/qualifications/CENSUS-USDA-Q06/evidence/attempt-01.json
          python - <<'PY'
          from tools.qualify_source_census_usda_q06 import verify_context,CONTRACT_COMMIT
          assert CONTRACT_COMMIT=="120930e4bb234ba0c6e652df1c9713fc94e3a2a6"
          verify_context()
          PY
      - name: No-network synthetic Q06 four-prefix, vintage, redaction and persistence tests
        run: |
          python -m py_compile tools/qualify_source_census_usda_q06.py
          python -m unittest discover -s tests -p 'test_source_qual_census_usda_q06.py' -v
          python -m unittest discover -s tests -p 'test_persist_s01_evidence_branch.py' -v
      - name: Exact Q05 original-byte SHA verification before territory-prefix-only projection
        run: python -m tools.qualify_source_census_usda_q06
      - name: Persist terminal source-only PASS or HOLD on independent run-specific branch
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m tools.persist_s01_evidence_branch \
            --qualification CENSUS-USDA-Q06 \
            --run-id "${GITHUB_RUN_ID}" \
            --json attempt-01.json \
            --md attempt-01.md --publish
          echo "Source-only Q06 result independently persisted; Q07 and F01 remain unapproved."
