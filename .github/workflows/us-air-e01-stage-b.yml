name: US AIR E01 Stage B primary relationship

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-air-e01-stage-b.yml'
      - 'tools/us_air_e01_stage_b.py'

permissions:
  contents: write

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate runner
        run: python -m py_compile tools/us_air_e01_stage_b.py

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Run frozen Stage B
        run: python tools/us_air_e01_stage_b.py

      - name: Commit Stage B derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/US-AIR-E01/STAGE_B_*
          if git diff --cached --quiet; then
            echo "No Stage B artifact changes"
          else
            git commit -m "Record US-AIR-E01 frozen Stage B result"
            git push
          fi
