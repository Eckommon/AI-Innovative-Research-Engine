name: Run US-FRA-RR-F01 Immutable Gate Attempt 02
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-fra-rr-f01-attempt02.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  fra-rr-f01-attempt02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 492e2a29261e786fe115fa9eaf2f89a8862fa5a6^{commit}
          git cat-file -e 107e433bbd1ab3b3aecf68e99a8de9afa5178dad^{commit}
          git cat-file -e 311543be1b91b68a7a2cdc09856c95f04c733bf9^{commit}
          gh issue view 196 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test -e research/US-FRA-RR-F01/evidence/attempt-01.json
          test ! -e research/US-FRA-RR-F01/evidence/attempt-02.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261008-US-FRA-RR-F01-ACTIVE'
          a1=json.loads(Path('research/US-FRA-RR-F01/evidence/attempt-01.json').read_text())
          assert a1['attempt_valid'] is False
          assert a1['implementation_error']['message']=='DIRECT_SERVICE_OR_WSDL_NOT_RESOLVED'
          assert a1['future_2026plus_accident_membership_opened'] is False
          corr=Path('research/US-FRA-RR-F01/IMPLEMENTATION_CORRECTION_02.md').read_text()
          for x in ['scientific_threshold_changed: false','historical_window_changed: false','identity_rule_changed: false','future_firewall_changed: false']:
              assert x in corr
          PY
      - name: Install deterministic HTTP dependency
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5'
      - name: Execute frozen FRA Attempt 02
        env:
          FRA_F01_BOUND: '1'
          FRA_F01_CONTRACT_SHA: '492e2a29261e786fe115fa9eaf2f89a8862fa5a6'
        run: python tools/run_us_fra_rr_f01_attempt02.py
      - name: Verify future and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-FRA-RR-F01/evidence/attempt-02.json').read_text())
          assert e['attempt']==2
          assert e['future_2026plus_accident_membership_opened'] is False
          assert e['future_rows_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['prior_accident_predictor_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 02 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FRA-RR-F01/evidence/attempt-02.json research/US-FRA-RR-F01/evidence/attempt-02.md
          git commit -m 'Record US-FRA-RR-F01 immutable attempt 02'
          git push origin HEAD:main
