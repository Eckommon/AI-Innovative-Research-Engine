name: Run EU-EMA-MA-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-eu-ema-ma-f01.yml'
  workflow_dispatch:
  issues:
    types: [edited]
permissions:
  contents: write
  issues: read
jobs:
  ema-ma-f01:
    if: github.event_name != 'issues' || github.event.issue.number == 175
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 215cd9dd74a358e412a86de5d41a039c2f8186cb^{commit}
          gh issue view 175 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/EU-EMA-MA-F01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260929-EU-EMA-MA-F01-ACTIVE'
          assert cp['active_issue']==175
          assert cp['active_research']=='EU-EMA-MA-F01'
          assert cp['last_decision']=='DEC-260'
          PY
      - name: Install deterministic parser
        run: python -m pip install --disable-pip-version-check --no-input 'openpyxl==3.1.5'
      - name: Execute frozen 18-gate attempt
        env:
          EMA_F01_BOUND: '1'
          EMA_F01_CONTRACT_SHA: '215cd9dd74a358e412a86de5d41a039c2f8186cb'
        run: python tools/run_eu_ema_ma_f01.py
      - name: Verify future-outcome and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/EU-EMA-MA-F01/evidence/attempt-01.json').read_text())
          assert e['future_event_membership_opened'] is False
          assert e['future_entity_pages_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/EU-EMA-MA-F01/evidence/attempt-01.json research/EU-EMA-MA-F01/evidence/attempt-01.md
          git commit -m 'Record EU-EMA-MA-F01 immutable attempt 01'
          git push origin HEAD:main
