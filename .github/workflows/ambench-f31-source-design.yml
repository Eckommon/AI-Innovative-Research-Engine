name: AMBENCH F31 source-design qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-f31-source-design.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Query NIST source/design metadata without outcome inspection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, os, re, urllib.request
          from collections import defaultdict
          from pathlib import Path

          DSID='mds2-4103'
          META=f'https://data.nist.gov/od/id/{DSID}?format=nerdm'
          root=Path(os.environ['GITHUB_WORKSPACE'])
          out=root/'research/AMBENCH-F31/SOURCE_DESIGN_RESULT.md'
          out.parent.mkdir(parents=True,exist_ok=True)

          def fetch(url, timeout=30):
              req=urllib.request.Request(url, headers={'User-Agent':'AI-Innovative-Research-Engine/F31-source-design'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def csum_hash(comp):
              c=comp.get('checksum') or {}
              return c.get('hash') if isinstance(c,dict) else None

          def verify(comp, raw):
              exp=csum_hash(comp)
              got=hashlib.sha256(raw).hexdigest()
              return exp, got, (exp == got if exp else None)

          meta=json.loads(fetch(META).decode('utf-8'))
          comps=meta.get('components') or []
          bypath={c.get('filepath'):c for c in comps if c.get('filepath')}

          lines=['---','id: AMBENCH-F31-SOURCE-DESIGN-RESULT','type: sanitized-source-design-qualification','created: 2026-08-23','source_of_truth: nist-current-nerdm','raw_artifacts_committed: false','measurement_outcomes_inspected: false','incremental_monetary_cost_usd: 0','---','',
                 '# AMBENCH-F31 Source/Design Qualification / Source·Design 적격성 결과','',
                 '## Execution boundary / 실행 경계',
                 '- Current official NIST NERDm metadata only, exact root `4103_ReadMe.txt`, and authoritative design-only parameter files if exposed. / 현재 공식 NIST NERDm 메타데이터, 정확한 root `4103_ReadMe.txt`, 노출된 권위 설계 파라미터 파일만 사용.',
                 '- No measurement-result CSV contents, pixel-coordinate rows, outcome-summary rows, images, masks, effects, tests, or models were opened/computed. / 측정 결과 CSV 내용, pixel 좌표 row, outcome summary row, 이미지, mask, effect, test, model은 열거나 계산하지 않음.',
                 '- Incremental monetary cost: `0 USD`.','',
                 '## Current NERDm identity / 현재 NERDm identity',
                 f'- dataset: `{DSID}`',
                 f'- title: {meta.get("title","UNKNOWN")}',
                 f'- version: `{meta.get("version","UNKNOWN")}`',
                 f'- component_count: `{len(comps)}`',
                 f'- components_with_checksum: `{sum(1 for c in comps if c.get("checksum"))}`','']

          plate_re=re.compile(r'(?<![A-Za-z0-9])(T\d{1,3})(?!\d)', re.I)
          plate_paths=defaultdict(list)
          for c in comps:
              fp=c.get('filepath','')
              for p in set(m.upper() for m in plate_re.findall(fp)):
                  plate_paths[p].append(fp)
          def plate_key(p): return int(p[1:])
          lines += ['## Metadata-only physical plate inventory / 메타데이터 기반 physical plate inventory',
                    '- Derived only from component path names; no component content was opened. / component path 이름에서만 도출; component 내용은 열지 않음.']
          for p in sorted(plate_paths,key=plate_key):
              dirs=sorted(set('/'.join(x.split('/')[:-1]) or '.' for x in plate_paths[p]))
              lines.append(f'- `{p}`: components={len(plate_paths[p])}; directories={"; ".join(dirs[:8])}')
          lines.append('')

          design_terms=('readme','parameter','design','sample','condition','scan')
          forbidden_path_terms=('pixel_points','tracks_results','overlap_depth','overlap_width','depths_avg','widths_avg','image','mask')
          candidates=[]
          for c in comps:
              fp=c.get('filepath','')
              low=fp.lower()
              if any(t in low for t in design_terms) and not any(t in low for t in forbidden_path_terms):
                  candidates.append(c)
          lines += ['## Candidate documentation/design components / 문서·설계 component 후보']
          for c in sorted(candidates,key=lambda x:x.get('filepath',''))[:80]:
              lines.append(f'- `{c.get("filepath")}` | size={c.get("size","UNKNOWN")} | sha256={csum_hash(c) or "UNKNOWN"}')
          lines.append('')

          readme=bypath.get('4103_ReadMe.txt')
          if readme:
              raw=fetch(readme['downloadURL'])
              exp,got,ok=verify(readme,raw)
              text=raw.decode('utf-8-sig',errors='replace')
              lines += ['## Exact root README qualification / root README 적격성',
                        '- path: `4103_ReadMe.txt`',f'- size_nerdm: `{readme.get("size","UNKNOWN")}`',
                        f'- sha256_nerdm: `{exp or "UNKNOWN"}`',f'- sha256_local: `{got}`',f'- checksum_match: `{ok}`']
              kws=('1 mm','5 mm','pad','turnaround','plate','sample','repeat','p1','p2','p3')
              safe=[]
              for i,line in enumerate(text.splitlines(),1):
                  lo=line.lower()
                  if any(k in lo for k in kws):
                      if any(b in lo for b in ('measurement result','average depth','average width','overlap depth','overlap width','pixel')):
                          continue
                      safe.append((i,line.strip()))
              lines.append('- bounded_design_lines:')
              for i,line in safe[:120]: lines.append(f'  - L{i}: {line}')
              lines.append('')
          else:
              lines += ['## Exact root README qualification / root README 적격성','- `4103_ReadMe.txt`: NOT_EXPOSED_IN_CURRENT_NERDM','']

          sip=[c for c in comps if c.get('filepath','').lower().endswith('sampleiparameters.csv')]
          lines += ['## SampleIParameters design mapping / SampleIParameters 설계 매핑']
          if not sip:
              lines += ['- current NERDm match: `NOT_FOUND`','']
          else:
              for comp in sip:
                  raw=fetch(comp['downloadURL'])
                  exp,got,ok=verify(comp,raw)
                  text=raw.decode('utf-8-sig',errors='replace')
                  reader=csv.DictReader(io.StringIO(text))
                  fields=reader.fieldnames or []
                  # This file is explicitly documented by the authoritative README as a table of sample names
                  # and experiment parameters. All nine current columns are design/identity fields; none are
                  # measurement outcomes. Preserve Pad_Width and Location because they are the F31 mapping keys.
                  expected={'Sample ID','Laser Power (W)','Laser Spot Diameter (µm)','Laser Scan Speed (mm/s)',
                            'Hatch Spacing (mm)','Powder_Layer_Thickness (µm)','Turnaround_Time (ms)','Pad_Width (mm)','Location (mm)'}
                  schema_is_design_only=(set(fields)==expected)
                  allowed=fields if schema_is_design_only else [f for f in fields if f in expected]
                  rows=list(reader)
                  lines += [f'- path: `{comp.get("filepath")}`',f'- size_nerdm: `{comp.get("size","UNKNOWN")}`',f'- sha256_nerdm: `{exp or "UNKNOWN"}`',f'- sha256_local: `{got}`',f'- checksum_match: `{ok}`',
                            f'- header: `{fields}`',f'- expected_design_only_schema_match: `{schema_is_design_only}`',f'- emitted_design_columns: `{allowed}`',f'- row_count: `{len(rows)}`','- design_rows:']
                  for row in rows[:200]:
                      item={k:row.get(k,'') for k in allowed}
                      lines.append('  - '+json.dumps(item,ensure_ascii=False,sort_keys=True))
                  lines.append('')

          # Metadata only: confirm exact P1/P2/P3 route component identities for the six bare target plates.
          target=('T72','T82','T92','T102','T112','T122')
          lines += ['## Six-plate P1/P2/P3 immutable route inventory / 6개 plate P1/P2/P3 불변 route inventory',
                    '- Component metadata only; these measurement files were not opened. / component metadata만 사용; 측정 파일 내용은 열지 않음.']
          for plate in target:
              for pos in ('P1','P2','P3'):
                  matches=[c for c in comps if re.search(fr'_{plate}_{pos}s_pixel_points\.csv$',c.get('filepath',''))]
                  if len(matches)==1:
                      c=matches[0]
                      lines.append(f'- `{plate}_{pos}`: path=`{c.get("filepath")}` | size={c.get("size","UNKNOWN")} | sha256={csum_hash(c) or "UNKNOWN"} | unique=YES')
                  else:
                      lines.append(f'- `{plate}_{pos}`: unique=NO | match_count={len(matches)}')
          lines.append('')

          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Persist sanitized F31 source/design result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/AMBENCH-F31/SOURCE_DESIGN_RESULT.md
          if git diff --cached --quiet; then
            echo 'No source/design result change.'
          else
            git commit -m 'record corrected AMBENCH-F31 design mapping qualification'
            git push
          fi
