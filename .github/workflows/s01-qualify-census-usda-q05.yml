name: S01-Q05 exact-frozen Census USDA county FIPS syntax preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s01-qualify-census-usda-q05.yml'
permissions:
  contents: write
concurrency:
  group: s01-census-usda-q05-exact-once
  cancel-in-progress: false
jobs:
  exact-sha-identifier-support:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source-qualified Q04, prospective Q05 & sole S01 authority
        run: |
          set -euo pipefail
          git cat-file -e b46760beb68b8b6db2ae667e90e0191673f1706b^{commit}
          test ! -e research/SOURCE-REGISTRY-S01/qualifications/CENSUS-USDA-Q05/evidence/attempt-01.json
          python - <<'PY'
          from tools.qualify_source_census_usda_q05 import verify_context, CONTRACT_COMMIT
          assert CONTRACT_COMMIT=='b46760beb68b8b6db2ae667e90e0191673f1706b'
          verify_context()
          PY
      - name: Offline prospective structural tests BEFORE first record ID access
        run: |
          python -m py_compile tools/qualify_source_census_usda_q05.py
          python -m unittest discover -s tests -p 'test_source_qual_census_usda_q05.py' -v
          python -m unittest discover -s tests -p 'test_persist_s01_evidence_branch.py' -v
      - name: Exactly two original full-SHA rechecks then county-key-only ephemeral projection
        run: python -m tools.qualify_source_census_usda_q05
      - name: Save one Q05 original-run verdict to isolated per-run evidence branch
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m tools.persist_s01_evidence_branch \
            --qualification CENSUS-USDA-Q05 \
            --run-id "${GITHUB_RUN_ID}" \
            --json attempt-01.json \
            --md attempt-01.md --publish
          echo "Q05 evidence saved independently, no F01 or main push."
