name: Activate US-FSIS-SAMPLE-F01
on:
  push:
    branches: [main]
    paths:
      - 'tools/activate_us_fsis_sample_f01.py'
      - '.github/workflows/activate-us-fsis-sample-f01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pre-Issue contract and live Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 1c7496ad5f4f6d82900fd60f0a31d3406cf217dc^{commit}
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert str(cp['active_issue']).lower() in {'none','null','n/a'}
          assert cp['active_research']=='NONE'
          assert cp['last_completed_issue']==157
          assert cp['last_decision']=='DEC-227'
          req=urllib.request.Request('https://api.github.com/repos/Eckommon/AI-Innovative-Research-Engine/issues/158',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r: issue=json.load(r)
          assert issue['state']=='open'
          PY
      - name: Activate canonical state
        run: python tools/activate_us_fsis_sample_f01.py
      - name: Verify active mirrors
        run: python tools/check_checkpoint.py
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/DEC-228.md registry/DECISION_LOG.md context/checkpoint.json STATUS.md context/SESSION_HANDOFF.md
          git commit -m 'Activate US-FSIS-SAMPLE-F01'
          git push origin HEAD:main
      - name: Confirm outcome firewall
        run: |
          echo 'FY2021-FY2023 Raw Poultry Sampling exposure rows are authorized after activation.'
          echo '2024-2025 recall/public-health-alert membership remains sealed; cost=0 USD.'
