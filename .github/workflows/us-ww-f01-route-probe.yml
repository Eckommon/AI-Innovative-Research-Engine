name: US WW F01 Source Route Probe

on:
  push:
    branches: [main]
    paths:
      - 'tools/probe_us_ww_f01_routes.py'
      - '.github/workflows/us-ww-f01-route-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe
        run: python -m py_compile tools/probe_us_ww_f01_routes.py
      - name: Probe official routes outcome-blind
        run: python tools/probe_us_ww_f01_routes.py
      - name: Commit route manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WW-F01/SOURCE_ROUTE_PROBE.json
          git diff --cached --quiet || git commit -m 'Probe US-WW-F01 official source routes'
          git push
