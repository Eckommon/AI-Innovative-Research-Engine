name: Finalize US-EPA-XMEDIA-N01 PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-us-epa-xmedia-n01.yml'
      - 'tools/finalize_us_epa_xmedia_n01.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable PASS and live Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile tools/finalize_us_epa_xmedia_n01.py
          test "$(git log -1 --format=%H -- research/US-EPA-XMEDIA-N01/STAGING_RESULT.json)" = "78f0f0f1458463c79c326c016d415dc5533af026"
          test "$(git log -1 --format=%H -- research/US-EPA-XMEDIA-N01/DESIGN_MANIFEST.json)" = "78f0f0f1458463c79c326c016d415dc5533af026"
          test "$(gh api repos/${GITHUB_REPOSITORY}/issues/151 --jq .state)" = "open"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/US-EPA-XMEDIA-N01/STAGING_RESULT.json').read_text())
          m=json.loads(Path('research/US-EPA-XMEDIA-N01/DESIGN_MANIFEST.json').read_text())
          assert r['gate']=='PASS_US_EPA_XMEDIA_N01_MATCHED_MONITORING_INTENSITY_DESIGN_IDENTIFIABLE'
          assert r['requirements_passed']==18
          assert len(m['pairs'])==307
          assert m['outcome_membership_included'] is False
          assert m['canonical_core_sha256']=='19e1b3a1963fe008811aa230336e12ec69a348b03cf37bd656ea9d3fba8e5aaf'
          assert all(v is False for v in r['boundaries'].values())
          print('US_EPA_XMEDIA_N01_TERMINAL_EVIDENCE_VERIFY_PASS')
          PY
      - name: Build terminal state
        run: python tools/finalize_us_epa_xmedia_n01.py
      - name: Verify terminal mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['checkpoint_id']=='CHK-20260917-US-EPA-XMEDIA-N01-TERMINAL'
          assert c['active_issue']=='none'
          assert c['last_completed_issue']==151
          assert c['last_decision']=='DEC-215'
          assert Path('registry/DEC-215.md').exists() and Path('registry/CLM-189.md').exists()
          assert 'US_EPA_XMEDIA_N01_PASS__E01_AUTHORIZATION_REQUIRED' in Path('STATUS.md').read_text()
          print('US_EPA_XMEDIA_N01_TERMINAL_MIRRORS_VERIFY_PASS')
          PY
      - name: Close Issue 151
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/issues/151 -f state=closed -f state_reason=completed >/tmp/i.json
          test "$(jq -r .state /tmp/i.json)" = "closed"
          test "$(jq -r .state_reason /tmp/i.json)" = "completed"
      - name: Commit terminal state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-EPA-XMEDIA-N01/README.md research/US-EPA-XMEDIA-N01/RESULT.md registry/DEC-215.md registry/CLM-189.md registry/DECISION_LOG.md registry/CLAIM_LEDGER.md STATUS.md context/checkpoint.json context/SESSION_HANDOFF.md
          git commit -m 'Finalize US-EPA-XMEDIA-N01 PASS'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Confirm E01 remains separate
        run: echo 'N01 terminal PASS does not itself open any E90/DMR outcome.'
