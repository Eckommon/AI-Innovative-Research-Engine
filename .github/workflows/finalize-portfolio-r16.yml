name: Finalize PORTFOLIO R16

on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_portfolio_r16.py'
      - '.github/workflows/finalize-portfolio-r16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate finalizer
        run: python -m py_compile tools/finalize_portfolio_r16.py
      - name: Finalize R16 and activate EU-GRID-F01
        run: python tools/finalize_portfolio_r16.py
      - name: Commit R16 durable state atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/PORTFOLIO-R16/RESULT.md research/EU-GRID-F01/README.md registry/CLM-146.md registry/DEC-143.md registry/DEC-144.md registry/CLAIM_LEDGER.md registry/DECISION_LOG.md STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json
          git diff --cached --quiet || git commit -m 'Select C-EU-001 in PORTFOLIO-R16 and activate EU-GRID-F01'
          git push
