name: Run US-EPA-RCRA-N01 Immutable Matching Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-epa-rcra-n01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  rcra-n01:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 14b9509808bcfd9a6affc694ec97531105d8ca41^{commit}
          git cat-file -e 4994dd3e0614d0c91e04b757d8e3dbe1fca6c335^{commit}
          gh issue view 199 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-EPA-RCRA-N01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261008-US-EPA-RCRA-N01-ACTIVE'
          assert cp['active_issue']==199
          assert cp['active_research']=='US-EPA-RCRA-N01'
          assert cp['last_decision']=='DEC-310'
          PY
      - name: Install deterministic HTTP dependency
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5'
      - name: Execute frozen N01 matching gate
        env:
          RCRA_N01_BOUND: '1'
          RCRA_N01_CONTRACT_SHA: '14b9509808bcfd9a6affc694ec97531105d8ca41'
        run: python tools/run_us_epa_rcra_n01.py
      - name: Verify outcome and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-EPA-RCRA-N01/evidence/attempt-01.json').read_text())
          assert e['later_refresh_opened'] is False
          assert e['future_found_violation_membership_opened'] is False
          assert e['found_violation_values_consumed']==0
          assert e['forbidden_outcome_tables_opened']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['prohibited_compliance_enforcement_exposure_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable N01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-EPA-RCRA-N01/evidence/attempt-01.json research/US-EPA-RCRA-N01/evidence/attempt-01.md
          git commit -m 'Record US-EPA-RCRA-N01 immutable attempt 01'
          git push origin HEAD:main
