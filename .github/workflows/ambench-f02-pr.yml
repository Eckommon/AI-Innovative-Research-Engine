name: AMBENCH-F02 PDR Snapshot Inspection

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/AMBENCH-F02/TRIGGER.md'
      - '.github/workflows/ambench-f02-pr.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download small authoritative NIST files and version metadata
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/raw work/versions work/logs work/result

          curl -fL --retry 3 'https://data.nist.gov/od/ds/mds2-2716/2716_README.txt' -o work/raw/2716_README.txt
          curl -fL --retry 3 'https://data.nist.gov/od/ds/mds2-2718/2718_README.txt' -o work/raw/2718_README.txt
          curl -fL --retry 3 'https://data.nist.gov/od/id/mds2-2716' -o work/raw/2716_current.json
          curl -fL --retry 3 'https://data.nist.gov/od/id/mds2-2718' -o work/raw/2718_current.json

          XLSX='https://data.nist.gov/od/ds/ark:/88434/mds2-2718/AMB2022-718-SH1-MeltPool_Cross-Section_Measurement_Results.xlsx'
          curl -fL --retry 3 "$XLSX" -o work/raw/optical_measurements.xlsx
          curl -fL --retry 3 "$XLSX.sha256" -o work/raw/optical_measurements.xlsx.sha256

          # Small checksum companions for large thermography and scan-strategy files.
          curl -fL --retry 3 'https://data.nist.gov/od/ds/ark:/88434/mds2-2716/Thermography/AMB2022-03-718-AMMT-StaringCamera_Signal.h5.sha256' -o work/raw/thermography.h5.sha256 || true
          curl -fL --retry 3 'https://data.nist.gov/od/ds/ark:/88434/mds2-2716/ScanStrategy/AMB2022-03-AMMT-718-Pad_XYPT.h5.sha256' -o work/raw/scan_strategy.h5.sha256 || true

          for spec in \
            '2716 1.1.0' '2716 1.2.0' '2716 1.3.0' '2716 1.3.1' \
            '2718 1.0.0' '2718 1.0.1' '2718 1.0.2' '2718 1.0.3'; do
            set -- $spec
            ds="$1"; ver="$2"
            url="https://data.nist.gov/od/id/ark:/88434/mds2-${ds}/pdr:v/${ver}"
            code=$(curl -sS -L -w '%{http_code}' -o "work/versions/${ds}_${ver}.json" "$url")
            echo "$ds $ver HTTP=$code BYTES=$(wc -c < "work/versions/${ds}_${ver}.json")" | tee -a work/logs/version_fetch.txt
          done

          sha256sum work/raw/* work/versions/* | sort | tee work/logs/sha256.txt
          ls -lh work/raw work/versions | tee work/logs/files.txt

      - name: Verify NIST checksums and inspect optical workbook
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/workbook_inspect.txt
          from pathlib import Path
          import hashlib, json, re, zipfile, xml.etree.ElementTree as ET

          raw=Path('work/raw')
          xlsx=raw/'optical_measurements.xlsx'
          actual=hashlib.sha256(xlsx.read_bytes()).hexdigest()
          companion=(raw/'optical_measurements.xlsx.sha256').read_text(errors='replace').strip().split()[0].lower()
          current=json.loads((raw/'2718_current.json').read_text())
          meta_hash=None
          meta_size=None
          for c in current.get('components',[]):
              if c.get('filepath')=='AMB2022-718-SH1-MeltPool_Cross-Section_Measurement_Results.xlsx':
                  meta_hash=((c.get('checksum') or {}).get('hash') or '').lower()
                  meta_size=c.get('size')
                  break
          print('XLSX_BYTES',xlsx.stat().st_size,'META_SIZE',meta_size)
          print('XLSX_SHA256_ACTUAL',actual)
          print('XLSX_SHA256_COMPANION',companion)
          print('XLSX_SHA256_METADATA',meta_hash)
          print('XLSX_HASH_MATCH',actual==companion==meta_hash)

          # Dependency-free XLSX reader for strings/numbers/formulas.
          NS={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main',
              'r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships'}
          with zipfile.ZipFile(xlsx) as z:
              shared=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                  for si in root.findall('m:si',NS):
                      shared.append(''.join(t.text or '' for t in si.iterfind('.//m:t',NS)))
              wb=ET.fromstring(z.read('xl/workbook.xml'))
              relroot=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
              rels={x.attrib['Id']:x.attrib['Target'] for x in relroot}
              sheets=[]
              for sh in wb.find('m:sheets',NS):
                  rid=sh.attrib.get('{%s}id'%NS['r'])
                  target=rels[rid]
                  if not target.startswith('xl/'): target='xl/'+target.lstrip('/')
                  sheets.append((sh.attrib['name'],target))
              print('SHEETS',sheets)

              def colnum(ref):
                  letters=re.match(r'([A-Z]+)',ref).group(1)
                  n=0
                  for ch in letters: n=n*26+ord(ch)-64
                  return n
              for sname,target in sheets:
                  root=ET.fromstring(z.read(target))
                  rows=[]
                  for row in root.findall('.//m:sheetData/m:row',NS):
                      vals={}
                      for c in row.findall('m:c',NS):
                          ref=c.attrib.get('r','A1'); typ=c.attrib.get('t')
                          v=c.find('m:v',NS)
                          val='' if v is None else (v.text or '')
                          if typ=='s' and val!='': val=shared[int(val)]
                          elif typ=='inlineStr': val=''.join(t.text or '' for t in c.iterfind('.//m:t',NS))
                          vals[colnum(ref)]=val
                      if vals:
                          maxc=max(vals); rows.append([vals.get(i,'') for i in range(1,maxc+1)])
                  print('\nSHEET',sname,'ROWS',len(rows))
                  for row in rows[:80]: print('ROW',row)

          Path('work/result/workbook_verification.json').write_text(json.dumps({
              'actual_sha256':actual,'companion_sha256':companion,'metadata_sha256':meta_hash,
              'bytes':xlsx.stat().st_size,'metadata_bytes':meta_size,'hash_match':actual==companion==meta_hash
          },indent=2),encoding='utf-8')
          PY

      - name: Extract thermography and optical identifier semantics
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/identifier_semantics.txt
          from pathlib import Path
          import re, json

          for ds in ['2716','2718']:
              text=Path(f'work/raw/{ds}_README.txt').read_text(encoding='utf-8',errors='replace')
              print('\n### README',ds)
              print(text)

          t=Path('work/raw/2716_README.txt').read_text(encoding='utf-8',errors='replace')
          o=Path('work/raw/2718_README.txt').read_text(encoding='utf-8',errors='replace')
          patterns={
            'thermo_line_group':r'/Line_X_Y_Z/.{0,1000}',
            'thermo_repeat':r'Z corresponds to one of three repeats.{0,1000}',
            'optical_single_naming':r'Single track micrograph naming convention.{0,1400}',
            'optical_measurement_results':r'Measurement_Results.{0,1600}',
          }
          result={}
          for name,pat in patterns.items():
              corpus=t if name.startswith('thermo') else o
              m=re.search(pat,corpus,re.I|re.S)
              result[name]=' '.join(m.group(0).split()) if m else None
              print(name,result[name])
          Path('work/result/identifier_semantics.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          PY

      - name: Compare version-specific PDR manifests
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/version_compare.txt
          from pathlib import Path
          import json, hashlib

          def component_map(o):
              out={}
              for c in o.get('components',[]):
                  fp=c.get('filepath')
                  if not fp: continue
                  out[fp]={
                    'size':c.get('size'),
                    'sha256':((c.get('checksum') or {}).get('hash')),
                    'downloadURL':c.get('downloadURL'),
                    'type':c.get('@type')
                  }
              return out

          summary={}
          for ds in ['2716','2718']:
              print('\n### DATASET',ds)
              records=[]
              for p in sorted(Path('work/versions').glob(ds+'_*.json')):
                  raw=p.read_bytes()
                  try: o=json.loads(raw)
                  except Exception as e:
                      print('BAD_JSON',p.name,repr(e),raw[:500]); continue
                  rec={
                    'file':p.name,'version':o.get('version'),'id':o.get('@id'),'doi':o.get('doi'),
                    'modified':o.get('modified'),'revised':o.get('revised'),'annotated':o.get('annotated'),
                    'manifest_sha256':hashlib.sha256(raw).hexdigest(),
                    'components':component_map(o)
                  }
                  records.append(rec)
                  print('VERSION',rec['version'],'ID',rec['id'],'COMPONENTS',len(rec['components']),'MANIFEST_SHA',rec['manifest_sha256'])
              for a,b in zip(records,records[1:]):
                  ka,kb=set(a['components']),set(b['components'])
                  changed=[]
                  for k in sorted(ka&kb):
                      if a['components'][k].get('sha256') != b['components'][k].get('sha256') or a['components'][k].get('size') != b['components'][k].get('size'):
                          changed.append(k)
                  print('DIFF',a['version'],'->',b['version'],'ADDED',len(kb-ka),'REMOVED',len(ka-kb),'CHANGED',len(changed))
                  for x in sorted(kb-ka)[:30]: print(' ADDED',x)
                  for x in sorted(ka-kb)[:30]: print(' REMOVED',x)
                  for x in changed[:30]: print(' CHANGED',x)
              summary[ds]=records
          Path('work/result/version_lineage.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          PY

      - name: Upload Run 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambench-f02-run2-small-files
          path: |
            work/logs/
            work/result/
            work/raw/*.sha256
          if-no-files-found: error
          retention-days: 30
