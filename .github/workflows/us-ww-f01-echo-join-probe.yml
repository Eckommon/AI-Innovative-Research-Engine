name: US WW F01 ECHO Join Probe

on:
  push:
    branches: [main]
    paths:
      - 'tools/probe_us_ww_f01_echo_join.py'
      - '.github/workflows/us-ww-f01-echo-join-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zero-cost browser driver library
        run: python -m pip install --disable-pip-version-check selenium
      - name: Validate probe
        run: python -m py_compile tools/probe_us_ww_f01_echo_join.py
      - name: Probe exact CWNS to ICIS-NPDES join and compliance identity
        run: python tools/probe_us_ww_f01_echo_join.py
      - name: Commit derived join manifest only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WW-F01/ECHO_JOIN_MANIFEST.json
          git diff --cached --quiet || git commit -m 'Probe US-WW-F01 exact ECHO join coverage'
          git push
