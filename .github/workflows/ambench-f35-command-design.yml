name: AMBENCH F35 RHF command-design qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-f35-command-design.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect checksum-frozen RHF command inputs only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, os, re, urllib.request, zipfile
          from pathlib import Path

          DSID='mds2-2507'
          root=Path(os.environ['GITHUB_WORKSPACE'])
          out=root/'research/AMBENCH-F35/COMMAND_DESIGN_PREFLIGHT.md'
          out.parent.mkdir(parents=True,exist_ok=True)

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'AI-Innovative-Research-Engine/F35-command-design-v2'})
              with urllib.request.urlopen(req,timeout=60) as r: return r.read()

          meta=json.loads(fetch(f'https://data.nist.gov/od/id/{DSID}?format=nerdm').decode('utf-8'))
          comp=next(c for c in meta['components'] if c.get('filepath')=='RHF_Command.zip')
          exp=(comp.get('checksum') or {}).get('hash'); raw=fetch(comp['downloadURL']); got=hashlib.sha256(raw).hexdigest()
          if exp!=got: raise RuntimeError(f'RHF_Command.zip checksum mismatch: {exp} != {got}')
          z=zipfile.ZipFile(io.BytesIO(raw))
          rx=re.compile(r'(?:^|/)RHF_P(\d{2})_layer0001\.csv$',re.I)
          files=sorted((int(m.group(1)),n) for n in z.namelist() if (m:=rx.search(n)))

          def numeric_row(row):
              if len(row)<4: return None
              try: return tuple(float(row[i]) for i in range(4))
              except Exception: return None

          records=[]
          for pid,n in files:
              rows=list(csv.reader(io.StringIO(z.read(n).decode('utf-8-sig',errors='replace'))))
              parsed=[]; header_detected=False
              for idx,row in enumerate(rows):
                  q=numeric_row(row)
                  if q is None:
                      if idx==0: header_detected=True
                      continue
                  parsed.append(q)
              # Data description freezes positional schema: X, Y, Power, Trigger.
              positive_power=[q[2] for q in parsed if q[2] > 0]
              uniq_positive=sorted(set(round(v,9) for v in positive_power))
              is_baseline=(len(uniq_positive)==1)
              records.append({'part':pid,'path':n,'rows_total':len(rows),'rows_numeric':len(parsed),'header':header_detected,
                              'unique_positive_power_count':len(uniq_positive),'baseline':is_baseline})

          pids=[r['part'] for r in records]
          baseline=[r['part'] for r in records if r['baseline']]
          rhf=[r['part'] for r in records if not r['baseline']]
          exact55=(pids==list(range(1,56)))
          expected_split=(len(baseline)==5 and len(rhf)==50)

          lines=['---','id: AMBENCH-F35-COMMAND-DESIGN-PREFLIGHT','type: process-input-design-preflight','created: 2026-08-23','candidate_outcomes_inspected: false','process_inputs_only: true','parser_version: v2_headerless_xypt_positive_power_only','incremental_monetary_cost_usd: 0','---','',
                 '# AMBENCH-F35 RHF Command Design Preflight / RHF Command 설계 사전점검','',
                 '## Boundary / 경계','- `RHF_Command.zip` process-input CSVs only. No encoder, MPM, analysis-result, microscopy or synchronized-movie data opened.','- Official data-description positional schema is frozen as columns `X, Y, Power, Trigger`.','- Baseline classification ignores laser-off rows (`Power <= 0`) and tests whether **positive commanded laser power** is constant within each part.','- No candidate outcome value is used.','',
                 '## Correction from v1 parser / v1 parser 보정','- The first preflight incorrectly used `csv.DictReader` on headerless XYPT files and counted laser-off `0 W` as treatment variation. That false-negative HOLD is superseded by this parser-only correction before any outcome access.','',
                 '## Source integrity / source 무결성',f'- dataset: `{DSID}`',f'- version: `{meta.get("version")}`',f'- archive_size_nerdm: `{comp.get("size")}`',f'- archive_size_local: `{len(raw)}`',f'- sha256_nerdm: `{exp}`',f'- sha256_local: `{got}`',f'- checksum_match: `{exp==got}`','',
                 '## Physical-part command inventory / physical-part command inventory',f'- command_csv_count: `{len(records)}`',f'- part_ids: `{pids}`',f'- exact_P01_to_P55: `{exact55}`',f'- baseline_constant_positive_power_count: `{len(baseline)}`',f'- rhf_variable_positive_power_count: `{len(rhf)}`',f'- expected_5_baseline_50_RHF_split: `{expected_split}`',f'- baseline_part_ids: `{baseline}`',f'- rhf_part_ids: `{rhf}`','',
                 '## Per-part process-input classification / part별 공정입력 분류','| Part | Command path | Numeric rows | Header detected | Unique positive power count | Class |','|---:|---|---:|---|---:|---|']
          for r in records:
              lines.append(f'| P{r["part"]:02d} | `{r["path"]}` | {r["rows_numeric"]} | {r["header"]} | {r["unique_positive_power_count"]} | {"BASELINE_CONSTANT_POWER" if r["baseline"] else "RHF_VARIABLE_POWER"} |')
          lines += ['', '## Pre-outcome design conclusion / outcome 전 설계 결론']
          if exact55 and expected_split:
              lines += ['**PASS_F35_COMMAND_INTERVENTION_STRUCTURE** — checksum-frozen process inputs independently recover P01–P55 and the publication-described `5 baseline constant-power + 50 RHF variable-power` intervention split.','- This establishes treatment/control structure from commands, not from outcomes.','']
          else:
              lines += ['**HOLD_F35_COMMAND_INTERVENTION_STRUCTURE** — corrected command parser does not reproduce the preregistered 55-part / 5+50 design. Do not open outcomes.','']
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Persist sanitized command-design preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/AMBENCH-F35/COMMAND_DESIGN_PREFLIGHT.md
          if git diff --cached --quiet; then
            echo 'No F35 command-design change.'
          else
            git commit -m 'record corrected AMBENCH-F35 RHF command-design preflight'
            git push
          fi
