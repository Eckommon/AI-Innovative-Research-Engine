name: AMBENCH F20 source recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-f20-source-recovery.yml'

permissions:
  contents: write

jobs:
  f20-source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recover authoritative metadata, verify workbook, inspect schema only
        shell: bash
        run: |
          set -u
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          RESULT="$GITHUB_WORKSPACE/research/AMBENCH-F20/RUN_RESULT.md"
          mkdir -p "$(dirname "$RESULT")"
          cd "$TMP"

          STATUS='HOLD'
          XNERDM='FAIL'
          INERDM='FAIL'
          WBMETA='FAIL'
          XYMETA='FAIL'
          WBDOWN='FAIL'
          HASHMATCH='NOT_COMPUTED'
          SCHEMA='NOT_INSPECTED'
          WB_EXPECTED='UNKNOWN'
          WB_ACTUAL='NOT_COMPUTED'
          WB_SIZE='UNKNOWN'
          XY_HASH='UNKNOWN'
          SCHEMA_FILE="$TMP/schema.txt"
          : > "$SCHEMA_FILE"

          if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
              'https://data.nist.gov/od/id/mds2-2514?format=nerdm' -o xct_nerdm.json; then
            XNERDM='PASS'
          fi
          if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
              'https://data.nist.gov/od/id/mds2-2309?format=nerdm' -o insitu_nerdm.json; then
            INERDM='PASS'
          fi

          if [ "$XNERDM" = PASS ] && [ "$INERDM" = PASS ]; then
            python - <<'PY' || true
          import json
          from pathlib import Path

          def component(path,target,outprefix):
              obj=json.loads(Path(path).read_text())
              exact=[c for c in obj.get('components',[]) if c.get('filepath')==target]
              if len(exact)!=1:
                  Path(outprefix+'_status.txt').write_text('FAIL')
                  return
              c=exact[0]; ck=c.get('checksum') or {}; alg=(ck.get('algorithm') or {}).get('tag')
              h=ck.get('hash') or ''
              Path(outprefix+'_status.txt').write_text('PASS' if alg=='sha256' and len(h)==64 else 'FAIL')
              Path(outprefix+'_hash.txt').write_text(h)
              Path(outprefix+'_url.txt').write_text(c.get('downloadURL') or '')
              Path(outprefix+'_size.txt').write_text(str(c.get('size') or 'UNKNOWN'))
          component('xct_nerdm.json','OverhangX16_ImageHistograms.xlsx','wb')
          component('insitu_nerdm.json','XYPT_L101-L125.zip','xy')
          PY
            [ -f wb_status.txt ] && WBMETA="$(cat wb_status.txt)"
            [ -f xy_status.txt ] && XYMETA="$(cat xy_status.txt)"
            [ -f wb_hash.txt ] && WB_EXPECTED="$(cat wb_hash.txt)"
            [ -f wb_size.txt ] && WB_SIZE="$(cat wb_size.txt)"
            [ -f xy_hash.txt ] && XY_HASH="$(cat xy_hash.txt)"
          fi

          if [ "$WBMETA" = PASS ] && [ -f wb_url.txt ]; then
            WB_URL="$(cat wb_url.txt)"
            if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$WB_URL" -o workbook.xlsx; then
              WBDOWN='PASS'
              WB_ACTUAL="$(sha256sum workbook.xlsx | awk '{print $1}')"
              if [ "$WB_EXPECTED" = "$WB_ACTUAL" ]; then
                HASHMATCH='YES'
                python - <<'PY' > "$SCHEMA_FILE"
          # Schema-only XLSX inspection; numeric cell contents are not emitted.
          import re, zipfile, xml.etree.ElementTree as ET
          NS={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main','r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships'}
          def textish(s):
              s=(s or '').strip()
              if not s or len(s)>120: return False
              if re.fullmatch(r'[+\-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+\-]?\d+)?%?',s): return False
              return bool(re.search(r'[A-Za-z]',s))
          with zipfile.ZipFile('workbook.xlsx') as z:
              wb=ET.fromstring(z.read('xl/workbook.xml'))
              rel=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
              targets={e.attrib['Id']:e.attrib['Target'] for e in rel}
              shared=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  ss=ET.fromstring(z.read('xl/sharedStrings.xml'))
                  for si in ss.findall('m:si',NS): shared.append(''.join(t.text or '' for t in si.findall('.//m:t',NS)))
              for sh in wb.find('m:sheets',NS):
                  name=sh.attrib['name']; rid=sh.attrib['{'+NS['r']+'}id']; target=targets[rid]
                  path='xl/'+target.lstrip('/') if not target.startswith('xl/') else target
                  root=ET.fromstring(z.read(path)); dim=root.find('m:dimension',NS)
                  print(f'- SHEET: `{name}`')
                  print(f'  - dimension: `{dim.attrib.get("ref") if dim is not None else "UNKNOWN"}`')
                  print(f'  - formula_count: `{len(root.findall(".//m:f",NS))}`')
                  seen=set(); n=0
                  for c in root.findall('.//m:c',NS):
                      t=c.attrib.get('t'); coord=c.attrib.get('r'); val=None
                      if t=='s':
                          v=c.find('m:v',NS)
                          if v is not None and v.text is not None:
                              i=int(v.text); val=shared[i] if 0<=i<len(shared) else None
                      elif t=='inlineStr': val=''.join(x.text or '' for x in c.findall('.//m:t',NS))
                      if textish(val) and val not in seen and n<80:
                          seen.add(val); n+=1; print(f'  - text_cell `{coord}`: `{val.strip()}`')
              print('- numerical_cell_values_emitted: `NO`')
          PY
                SCHEMA='PASS'
                STATUS='PASS'
              else
                HASHMATCH='NO'
                STATUS='REJECT'
              fi
            fi
          fi

          cat > "$RESULT" <<EOF
          ---
          id: AMBENCH-F20-RUN-RESULT
          type: sanitized-execution-result
          created: 2026-08-23
          source_of_truth: github-actions
          raw_artifacts_committed: false
          ---

          # AMBENCH-F20 Sanitized Run Result / F20 정제 실행 결과

          ## Route / 경로
          - runner: public standard GitHub-hosted ubuntu-latest
          - incremental monetary cost: 0 USD under current GitHub public-repository standard-runner policy
          - artifacts/cache: NONE
          - numerical XCT/process outcomes emitted: NO

          ## Machine metadata / machine metadata
          - XCT NERDm fetch: $XNERDM
          - in-situ NERDm fetch: $INERDM
          - workbook component checksum metadata: $WBMETA
          - XYPT L101-L125 component checksum metadata: $XYMETA
          - workbook NERDm size: $WB_SIZE
          - workbook expected SHA-256: $WB_EXPECTED
          - XYPT L101-L125 NERDm SHA-256: $XY_HASH

          ## Workbook byte integrity / workbook byte 무결성
          - workbook authoritative download: $WBDOWN
          - workbook actual SHA-256: $WB_ACTUAL
          - expected/actual SHA-256 match: $HASHMATCH
          - schema-only inspection: $SCHEMA

          ## Schema-only output / schema 전용 출력
          EOF
          cat "$SCHEMA_FILE" >> "$RESULT"
          cat >> "$RESULT" <<EOF

          ## Execution status / 실행 상태
          - internal status: $STATUS
          - raw transient teardown: SUCCESS
          EOF

      - name: Persist sanitized result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/AMBENCH-F20/RUN_RESULT.md
          if git diff --cached --quiet; then
            echo 'No sanitized result change to commit.'
          else
            git commit -m 'record sanitized AMBENCH-F20 source recovery result'
            git push
          fi
