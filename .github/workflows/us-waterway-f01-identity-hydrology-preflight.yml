name: US WATERWAY F01 identity hydrology preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-waterway-f01-identity-hydrology-preflight.yml'
      - 'tools/us_waterway_f01_identity_hydrology_preflight.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner
        run: python -m py_compile tools/us_waterway_f01_identity_hydrology_preflight.py
      - name: Run outcome-blind identity and hydrology metadata preflight
        run: python tools/us_waterway_f01_identity_hydrology_preflight.py
      - name: Commit derived preflight artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WATERWAY-F01/IDENTITY_HYDROLOGY_PREFLIGHT.json research/US-WATERWAY-F01/IDENTITY_HYDROLOGY_PREFLIGHT.md
          git commit -m 'Record US-WATERWAY-F01 identity hydrology preflight'
          git push
