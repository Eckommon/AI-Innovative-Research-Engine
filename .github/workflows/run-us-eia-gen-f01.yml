name: Run US-EIA-GEN-F01
on:
  push:
    branches: [main]
    paths:
      - 'tools/run_us_eia_gen_f01.py'
      - '.github/workflows/run-us-eia-gen-f01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  run-f01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify active authorization and frozen contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 140715aecd58bf5371f7c0a6a46feccf761d9457^{commit}
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert str(cp['active_issue']) in {'156','#156'}
          assert cp['active_research']=='US-EIA-GEN-F01'
          assert cp['last_decision']=='DEC-224'
          req=urllib.request.Request('https://api.github.com/repos/Eckommon/AI-Innovative-Research-Engine/issues/156',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r: issue=json.load(r)
          assert issue['state']=='open'
          PY
      - name: Install zero-cost parser dependencies
        run: python -m pip install --disable-pip-version-check -q requests openpyxl
      - name: Execute immutable outcome-blind structural gate
        run: |
          test ! -e research/US-EIA-GEN-F01/STAGING_RESULT.json
          test ! -e research/US-EIA-GEN-F01/EXPOSURE_MANIFEST.json
          python tools/run_us_eia_gen_f01.py
      - name: Verify frozen gate and future-row firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/US-EIA-GEN-F01/STAGING_RESULT.json').read_text())
          assert x['requirements_total']==18
          assert x['gate'] in {'PASS_US_EIA_GEN_F01_COLOCATED_SOLAR_STORAGE_LONGITUDINAL_DESIGN_READY','HOLD_US_EIA_GEN_F01_COLOCATED_SOLAR_STORAGE_LONGITUDINAL_DESIGN_NOT_READY'}
          b=x['boundaries']
          assert all(v is False for v in b.values())
          manifest=Path('research/US-EIA-GEN-F01/EXPOSURE_MANIFEST.json').read_text()
          forbidden=['future_outcome','actual_operation','slippage','future_status']
          low=manifest.lower()
          assert all(s not in low for s in forbidden)
          assert x['incremental_monetary_cost_usd']==0
          PY
      - name: Commit immutable F01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-EIA-GEN-F01/STAGING_RESULT.json research/US-EIA-GEN-F01/EXPOSURE_MANIFEST.json
          git commit -m 'Record US-EIA-GEN-F01 immutable structural result'
          git push origin HEAD:main
      - name: Confirm research boundary
        run: |
          echo 'No December-2025 data row or commissioning outcome was opened.'
          echo 'No paid API or paid compute used.'
