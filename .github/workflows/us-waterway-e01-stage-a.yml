name: US WATERWAY E01 Stage A panel qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-waterway-e01-stage-a.yml'
      - 'tools/us_waterway_e01_stage_a.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner
        run: python -m py_compile tools/us_waterway_e01_stage_a.py
      - name: Install browser dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Run frozen outcome-blind Stage A
        run: python tools/us_waterway_e01_stage_a.py
      - name: Commit Stage A derived artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WATERWAY-E01/STAGE_A_GAGE_LOCK_MAP.csv research/US-WATERWAY-E01/STAGE_A_EXCLUSIONS.csv research/US-WATERWAY-E01/STAGE_A_SUPPORT.json research/US-WATERWAY-E01/STAGE_A_RESULT.md
          git commit -m 'Record US-WATERWAY-E01 Stage A panel qualification'
          git push
