name: US PORT F01 BTS schema preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-port-f01-bts-schema-preflight.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect official BTS source semantics without outcome analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE'])
          out = root / 'research/US-PORT-F01/BTS_SCHEMA_PREFLIGHT.md'
          out.parent.mkdir(parents=True, exist_ok=True)

          DATASET_ID = 'abu9-jbyq'
          COLUMNS_URL = f'https://data.transportation.gov/api/views/{DATASET_ID}/columns.json'
          SAMPLE_URL = f'https://data.transportation.gov/resource/{DATASET_ID}.json?$limit=50'
          COUNT_URL = f'https://data.transportation.gov/resource/{DATASET_ID}.json?$select=count(*)'
          CATALOG_URL = 'https://api.us.socrata.com/api/catalog/v1?' + urllib.parse.urlencode({
              'search_context': 'data.transportation.gov',
              'q': 'Weekly Vessel Berthing Statistics by Port',
              'limit': 20,
          })

          headers = {'User-Agent': 'AI-Innovative-Research-Engine/US-PORT-F01 source-semantic-preflight'}

          def fetch(url, timeout=45):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = r.read()
                  return data, getattr(r, 'status', 200), dict(r.headers.items())

          def safe(s, n=500):
              s = ' '.join(str(s or '').replace('\r',' ').replace('\n',' ').split())
              return s[:n]

          lines = [
              '---',
              'id: US-PORT-F01-BTS-SCHEMA-PREFLIGHT',
              'type: bounded-source-schema-preflight',
              'created: 2026-09-03',
              'source_of_truth: github-actions',
              'raw_rows_committed: false',
              'weather_effect_analysis_performed: false',
              'incremental_monetary_cost_usd: 0',
              '---',
              '',
              '# US-PORT-F01 BTS Schema Preflight / BTS schema 사전검증',
              '',
              '- purpose: source identity / schema / access only',
              '- outcome values emitted: NO',
              '- weather data opened: NO',
              '- dashboard scraping/reverse engineering: NO',
              '',
          ]

          fields = []
          columns_ok = False
          sample_ok = False
          row_count = None
          try:
              data, status, hdr = fetch(COLUMNS_URL)
              columns_sha = hashlib.sha256(data).hexdigest()
              payload = json.loads(data.decode('utf-8'))
              if isinstance(payload, list):
                  fields = payload
                  columns_ok = True
              lines += [
                  '## Frozen BTS dataset / 고정 BTS 데이터셋',
                  f'- dataset_id: `{DATASET_ID}`',
                  f'- columns_endpoint_status: {status}',
                  f'- columns_payload_SHA256: `{columns_sha}`',
                  f'- column_count: {len(fields)}',
                  '',
                  '### Column metadata / 컬럼 metadata',
                  '',
                  '| display_name | api_field | type | description |',
                  '|---|---|---|---|',
              ]
              for c in fields:
                  lines.append('| `{}` | `{}` | `{}` | {} |'.format(
                      safe(c.get('name'),120), safe(c.get('fieldName'),120),
                      safe(c.get('dataTypeName'),80), safe(c.get('description'),300).replace('|','\\|')
                  ))
              lines.append('')
          except Exception as e:
              lines += ['## Frozen BTS dataset / 고정 BTS 데이터셋', f'- columns_endpoint: FAIL ({type(e).__name__})', '']

          try:
              data, status, hdr = fetch(COUNT_URL)
              obj = json.loads(data.decode('utf-8'))
              if isinstance(obj, list) and obj:
                  v = next(iter(obj[0].values()))
                  row_count = int(v)
              lines += [f'- source_row_count: {row_count if row_count is not None else "UNRESOLVED"}', '']
          except Exception as e:
              lines += [f'- source_row_count: UNRESOLVED ({type(e).__name__})', '']

          # Only source-identity/time labels may be exposed from a bounded first-50 source sample.
          # Dwell/berth/average/median/hour/call/count values are explicitly excluded.
          try:
              data, status, hdr = fetch(SAMPLE_URL)
              sample_sha = hashlib.sha256(data).hexdigest()
              rows = json.loads(data.decode('utf-8'))
              sample_ok = isinstance(rows, list)
              keys = sorted({k for r in rows if isinstance(r, dict) for k in r.keys()})
              include = re.compile(r'(port|month|year|week|date|vessel|ship|coast|type)', re.I)
              exclude = re.compile(r'(dwell|berth|time|hour|avg|average|median|count|call)', re.I)
              id_keys = [k for k in keys if include.search(k) and not exclude.search(k)]
              lines += [
                  '## Bounded first-50 identity inspection / 최초 50행 identity 제한 검증',
                  f'- sample_endpoint_status: {status}',
                  f'- sample_payload_SHA256: `{sample_sha}`',
                  f'- sample_row_count: {len(rows) if isinstance(rows,list) else "UNRESOLVED"}',
                  f'- all_api_keys: `{keys}`',
                  f'- permitted_identity_keys: `{id_keys}`',
              ]
              for k in id_keys:
                  vals=[]
                  for r in rows:
                      if isinstance(r,dict) and k in r:
                          v=safe(r.get(k),120)
                          if v and v not in vals:
                              vals.append(v)
                          if len(vals)>=20: break
                  lines.append(f'- identity_values[{k}]: `{vals}`')
              lines += ['', '- numerical dwell/berth/call-support values emitted: NO', '']
          except Exception as e:
              lines += ['## Bounded first-50 identity inspection / 최초 50행 identity 제한 검증', f'- sample_endpoint: FAIL ({type(e).__name__})', '- numerical dwell/berth/call-support values emitted: NO', '']

          names = []
          for c in fields:
              names.extend([str(c.get('name') or ''), str(c.get('fieldName') or '')])
          joined = ' | '.join(names).lower()
          has_port = 'port' in joined
          has_week = 'week' in joined
          has_month = 'month' in joined
          has_year = 'year' in joined
          has_dwell_or_berth = ('dwell' in joined or 'berth' in joined)
          has_call_support = ('call' in joined or 'count' in joined or 'observation' in joined or 'sample' in joined)
          lines += [
              '## Semantic role check / semantic role 검증',
              f'- explicit_port_field_detected: {"YES" if has_port else "NO"}',
              f'- explicit_week_field_detected: {"YES" if has_week else "NO"}',
              f'- explicit_month_field_detected: {"YES" if has_month else "NO"}',
              f'- explicit_year_field_detected: {"YES" if has_year else "NO"}',
              f'- dwell_or_berth_metric_field_detected: {"YES" if has_dwell_or_berth else "NO"}',
              f'- call_or_support_field_detected: {"YES" if has_call_support else "NO"}',
              '',
          ]

          # Public catalog metadata discovery only; do not fetch dashboard data.
          try:
              data, status, hdr = fetch(CATALOG_URL)
              cat_sha = hashlib.sha256(data).hexdigest()
              cat = json.loads(data.decode('utf-8'))
              results = cat.get('results', []) if isinstance(cat, dict) else []
              lines += [
                  '## Current weekly-berthing asset discovery / 현재 weekly berthing asset 탐색',
                  f'- Socrata_catalog_status: {status}',
                  f'- Socrata_catalog_SHA256: `{cat_sha}`',
                  f'- result_count: {len(results)}',
                  '- discovery_scope: metadata only; no dashboard content queried',
              ]
              for r in results[:20]:
                  res = r.get('resource') or {}
                  lines.append('- result: id=`{}` type=`{}` name=`{}` permalink=`{}`'.format(
                      safe(res.get('id'),80), safe(res.get('type'),80), safe(res.get('name'),180), safe(r.get('permalink'),250)
                  ))
              lines.append('')
          except Exception as e:
              lines += ['## Current weekly-berthing asset discovery / 현재 weekly berthing asset 탐색', f'- Socrata_catalog: UNRESOLVED ({type(e).__name__})', '- dashboard content queried: NO', '']

          if columns_ok and sample_ok:
              if has_port and (has_week or (has_month and has_year)) and has_dwell_or_berth:
                  schema_gate = 'PASS_BTS_MACHINE_READABLE_PORT_TIME_SCHEMA'
              else:
                  schema_gate = 'HOLD_BTS_MACHINE_READABLE_PORT_TIME_SCHEMA_MISSING_REQUIRED_IDENTITY'
          else:
              schema_gate = 'HOLD_BTS_SOURCE_ACCESS_OR_SCHEMA_UNRESOLVED'

          lines += [
              '## BTS-only preflight gate / BTS 단독 사전검증 판정',
              f'**`{schema_gate}`**',
              '',
              'This is not the final US-PORT-F01 gate. NOAA/geography are not evaluated here.',
              '본 결과는 최종 US-PORT-F01 판정이 아니다. NOAA/지리 조인은 아직 평가하지 않았다.',
              '',
              '- weather→dwell association computed: NO',
              '- incremental monetary cost: 0 USD',
          ]
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit sanitized BTS schema preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-PORT-F01/BTS_SCHEMA_PREFLIGHT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'record bounded US-PORT-F01 BTS schema preflight'
          git push
