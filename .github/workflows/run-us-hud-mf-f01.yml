name: Run US-HUD-MF-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-hud-mf-f01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  hud-mf-f01:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and immutable evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 73eec2f714f3e1c89d0441ffb9f746721bda3443^{commit}
          gh issue view 168 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-HUD-MF-F01/evidence/attempt-01.json
          test ! -e research/US-HUD-MF-F01/evidence/attempt-01.md
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260921-US-HUD-MF-F01-ACTIVE'
          assert cp['active_issue']==168
          assert cp['active_research']=='US-HUD-MF-F01'
          assert cp['last_decision']=='DEC-246'
          contract=Path('research/US-HUD-MF-F01/README.md').read_text()
          assert 'future_terminated_membership_opened: false' in contract
          assert '18/18 PASS' in contract
          PY
      - name: Install deterministic workbook parser
        run: python -m pip install --disable-pip-version-check --no-input 'openpyxl==3.1.5'
      - name: Execute frozen 18-gate structural attempt
        env:
          HUD_MF_F01_ISSUE_BOUND: '1'
          HUD_MF_F01_CONTRACT_SHA: '73eec2f714f3e1c89d0441ffb9f746721bda3443'
        run: python tools/run_us_hud_mf_f01.py
      - name: Verify future-outcome and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-HUD-MF-F01/evidence/attempt-01.json').read_text())
          assert e['future_terminated_rows_opened']==0
          assert e['future_adverse_membership_opened'] is False
          assert e['future_entity_body_bytes_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-HUD-MF-F01/evidence/attempt-01.json research/US-HUD-MF-F01/evidence/attempt-01.md
          git commit -m 'Record US-HUD-MF-F01 immutable attempt 01'
          git push origin HEAD:main
      - name: Report boundary
        run: |
          echo 'No post-2026-09-21 terminated-mortgage snapshot body was opened.'
          echo 'Historical terminated data, if retrieved, were used only for structural schema/reason/date support.'
