name: US PORT F01 BTS metadata-only asset discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-port-f01-bts-asset-discovery.yml'

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Discover official BTS dwell/berthing datasets from metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE'])
          out = root / 'research/US-PORT-F01/BTS_ASSET_DISCOVERY.md'
          out.parent.mkdir(parents=True, exist_ok=True)
          headers = {'User-Agent': 'AI-Innovative-Research-Engine/US-PORT-F01 metadata-only-discovery'}

          def fetch(url, timeout=45):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  b = r.read()
                  return b, getattr(r, 'status', 200)

          queries = [
              'vessel dwell',
              'vessel berthing',
              'container vessel dwell',
              'tanker vessel dwell',
              'port dwell time',
          ]
          assets = {}
          catalog_hashes = []
          for q in queries:
              url = 'https://api.us.socrata.com/api/catalog/v1?' + urllib.parse.urlencode({
                  'search_context':'data.transportation.gov', 'q':q, 'limit':50
              })
              data, status = fetch(url)
              catalog_hashes.append((q, hashlib.sha256(data).hexdigest(), status))
              obj = json.loads(data.decode('utf-8'))
              for r in obj.get('results', []):
                  res = r.get('resource') or {}
                  if res.get('type') != 'dataset':
                      continue
                  rid = str(res.get('id') or '')
                  if not rid:
                      continue
                  assets[rid] = {
                      'name': str(res.get('name') or ''),
                      'description': str(res.get('description') or ''),
                      'permalink': str(r.get('permalink') or ''),
                  }

          lines = [
              '---',
              'id: US-PORT-F01-BTS-ASSET-DISCOVERY',
              'type: metadata-only-source-discovery',
              'created: 2026-09-04',
              'raw_rows_opened: false',
              'outcome_values_emitted: false',
              'weather_data_opened: false',
              'incremental_monetary_cost_usd: 0',
              '---',
              '',
              '# US-PORT-F01 BTS Metadata-only Asset Discovery / BTS metadata 전용 자산 탐색',
              '',
              '- source: official Socrata public catalog for `data.transportation.gov`',
              '- dataset row values queried: NO',
              '- dashboard scraping/reverse engineering: NO',
              '- weather→dwell effect analysis: NO',
              '',
              '## Catalog query integrity / 카탈로그 query 무결성',
          ]
          for q, h, status in catalog_hashes:
              lines.append(f'- `{q}`: HTTP {status}; SHA256 `{h}`')
          lines += ['', f'## Dataset-type assets discovered / 발견된 dataset 자산', f'- unique_dataset_count: {len(assets)}', '']

          qualified = []
          inspected = 0
          for rid in sorted(assets):
              info = assets[rid]
              # Keep inspection bounded to assets whose name/description is semantically dwell/berthing related.
              text = (info['name'] + ' ' + info['description']).lower()
              if 'dwell' not in text and 'berth' not in text:
                  continue
              inspected += 1
              view_url = f'https://data.transportation.gov/api/views/{rid}'
              try:
                  data, status = fetch(view_url)
                  sha = hashlib.sha256(data).hexdigest()
                  view = json.loads(data.decode('utf-8'))
                  cols = view.get('columns') or []
                  column_meta=[]
                  names=[]
                  for c in cols:
                      dn=str(c.get('name') or '')
                      fn=str(c.get('fieldName') or '')
                      dt=str(c.get('dataTypeName') or '')
                      ds=' '.join(str(c.get('description') or '').replace('\n',' ').split())[:240]
                      column_meta.append((dn,fn,dt,ds))
                      names += [dn.lower(), fn.lower()]
                  joined=' | '.join(names)
                  has_port='port' in joined
                  has_dwell=('dwell' in joined or 'berth' in joined or 'hour' in joined)
                  has_time=any(x in joined for x in ['week','month','date','year','quarter'])
                  has_support=any(x in joined for x in ['call','count','sample','observation','vessel'])
                  if has_port and has_dwell and has_time:
                      qualified.append(rid)
                  lines += [
                      f'### `{rid}` — {info["name"]}',
                      f'- permalink: `{info["permalink"]}`',
                      f'- view_metadata_status: {status}',
                      f'- view_metadata_SHA256: `{sha}`',
                      f'- column_count: {len(cols)}',
                      f'- explicit_port_field_detected: {"YES" if has_port else "NO"}',
                      f'- dwell_or_berth_metric_field_detected: {"YES" if has_dwell else "NO"}',
                      f'- explicit_time_field_detected: {"YES" if has_time else "NO"}',
                      f'- call_or_support_field_detected: {"YES" if has_support else "NO"}',
                      '',
                      '| display_name | api_field | type | description |',
                      '|---|---|---|---|',
                  ]
                  for dn,fn,dt,ds in column_meta:
                      lines.append(f'| `{dn}` | `{fn}` | `{dt}` | {ds.replace("|","/")} |')
                  lines.append('')
              except Exception as e:
                  lines += [f'### `{rid}` — {info["name"]}', f'- view_metadata: FAIL ({type(e).__name__})', '']

          lines += [
              '## Discovery gate / 탐색 판정',
              f'- inspected_semantically_relevant_dataset_count: {inspected}',
              f'- machine_readable_port_time_dwell_dataset_ids: `{qualified}`',
              '',
          ]
          if qualified:
              gate='PASS_BTS_PORT_TIME_DWELL_DATASET_DISCOVERED'
          else:
              gate='HOLD_NO_MACHINE_READABLE_PORT_TIME_DWELL_DATASET_DISCOVERED'
          lines += [
              f'**`{gate}`**',
              '',
              'This discovery result is source-semantic only and does not evaluate weather effects.',
              '본 탐색은 source semantics만 검증하며 기상 효과를 평가하지 않는다.',
              '',
              '- outcome values emitted: NO',
              '- incremental monetary cost: 0 USD',
          ]
          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Commit sanitized metadata-only discovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-PORT-F01/BTS_ASSET_DISCOVERY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'record US-PORT-F01 BTS metadata-only asset discovery'
          git push
