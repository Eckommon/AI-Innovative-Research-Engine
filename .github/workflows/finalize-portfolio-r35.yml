name: Finalize PORTFOLIO-R35 selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-portfolio-r35.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen evidence and live Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git log -1 --format=%H -- research/PORTFOLIO-R35/README.md | tail -1)" != ""
          test "$(git log -1 --format=%H -- research/PORTFOLIO-R35/SOURCE_REVALIDATION.md)" = "127170adafcddefb66e3a9bfd33943b8fd5d53be"
          test "$(git log -1 --format=%H -- research/PORTFOLIO-R35/SCORECARD.md)" = "b41f009024b23e73d75a278e73cba950f6afd3fe"
          test "$(gh api repos/${GITHUB_REPOSITORY}/issues/153 --jq .state)" = "open"
          python - <<'PY'
          from pathlib import Path
          s=Path('research/PORTFOLIO-R35/SCORECARD.md').read_text()
          assert 'SELECT_US_FAA_AIP_001_AIRFIELD_INFRASTRUCTURE_TO_BTS_DELAY_F01' in s
          assert 'Candidate outcomes opened:** false' in s
          assert '**40**' in s and '**39**' in s and '**38**' in s and '**32**' in s
          print('PORTFOLIO_R35_IMMUTABLE_SCORECARD_VERIFY_PASS')
          PY

      - name: Build terminal selection state
        run: python tools/finalize_portfolio_r35.py

      - name: Verify terminal mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['checkpoint_id']=='CHK-20260917-PORTFOLIO-R35-TERMINAL'
          assert c['active_issue']=='none'
          assert c['last_completed_issue']==153
          assert c['last_decision']=='DEC-219'
          assert Path('registry/DEC-219.md').exists()
          assert Path('registry/CLM-191.md').exists()
          assert 'PORTFOLIO_R35_SELECTED_US_FAA_AIP_001__F01_AUTHORIZATION_REQUIRED' in Path('STATUS.md').read_text()
          print('PORTFOLIO_R35_TERMINAL_MIRRORS_PASS')
          PY

      - name: Close Issue 153
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/issues/153 -f state=closed -f state_reason=completed >/tmp/i.json
          test "$(jq -r .state /tmp/i.json)" = "closed"
          test "$(jq -r .state_reason /tmp/i.json)" = "completed"

      - name: Commit terminal selection state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions-bot@users.noreply.github.com'
          git add research/PORTFOLIO-R35/README.md research/PORTFOLIO-R35/RESULT.md registry/DEC-219.md registry/CLM-191.md registry/DECISION_LOG.md registry/CLAIM_LEDGER.md STATUS.md context/checkpoint.json context/SESSION_HANDOFF.md
          git commit -m 'Finalize PORTFOLIO-R35 FAA-AIP selection'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm next boundary
        run: echo 'Only a separate outcome-blind FAA-AIP-F01 is authorized; grant-conditioned delay outcomes remain unopened.'
