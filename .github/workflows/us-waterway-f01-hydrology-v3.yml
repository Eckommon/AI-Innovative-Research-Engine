name: US WATERWAY F01 hydrology metadata preflight v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-waterway-f01-hydrology-v3.yml'
      - 'tools/us_waterway_f01_hydrology_fast_v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner
        run: python -m py_compile tools/us_waterway_f01_hydrology_fast_v3.py
      - name: Run extended metadata-only preflight
        run: python tools/us_waterway_f01_hydrology_fast_v3.py
      - name: Commit v3 hydrology artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WATERWAY-F01/HYDROLOGY_METADATA_PREFLIGHT_V3.json research/US-WATERWAY-F01/HYDROLOGY_METADATA_PREFLIGHT_V3.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record US-WATERWAY-F01 hydrology metadata preflight v3'
          git push
