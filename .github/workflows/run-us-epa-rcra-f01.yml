name: Run US-EPA-RCRA-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-epa-rcra-f01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  rcra-f01:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e ffbb1d89ea614c4c82cc39483383ccb09e23accf^{commit}
          gh issue view 198 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-EPA-RCRA-F01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261008-US-EPA-RCRA-F01-ACTIVE'
          assert cp['active_issue']==198
          assert cp['active_research']=='US-EPA-RCRA-F01'
          assert cp['last_decision']=='DEC-308'
          PY
      - name: Install deterministic HTTP dependency
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5'
      - name: Execute frozen RCRA 18-gate attempt
        env:
          RCRA_F01_BOUND: '1'
          RCRA_F01_CONTRACT_SHA: 'ffbb1d89ea614c4c82cc39483383ccb09e23accf'
        run: python tools/run_us_epa_rcra_f01.py
      - name: Verify future and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-EPA-RCRA-F01/evidence/attempt-01.json').read_text())
          assert e['later_refresh_opened'] is False
          assert e['future_evaluation_violation_membership_opened'] is False
          assert e['future_rows_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['prohibited_compliance_exposure_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-EPA-RCRA-F01/evidence/attempt-01.json research/US-EPA-RCRA-F01/evidence/attempt-01.md
          git commit -m 'Record US-EPA-RCRA-F01 immutable attempt 01'
          git push origin HEAD:main
