name: Run US-CMS-NPI-E01 Future Update Experiment
on:
  workflow_dispatch:
  issues:
    types: [edited]
permissions:
  contents: write
  issues: read
concurrency:
  group: us-cms-npi-e01-attempt-01
  cancel-in-progress: false
jobs:
  cms-npi-e01:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.number == 203 && contains(github.event.issue.body, 'EXECUTE_US_CMS_NPI_E01_ATTEMPT_01'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen E01 authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 48843c9979336dcd10fdff984f458277062d6f20^{commit}
          git cat-file -e da46a24114452a1d63a16adf731aa3b51761c88b^{commit}
          git cat-file -e 0e81620e9cbea5dcddb558791e786d1565dfaf0f^{commit}
          gh issue view 203 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          # Both manual dispatch and issue-edit triggers require the exact, standalone authorization line.
          gh issue view 203 --repo '${{ github.repository }}' --json body --jq '.body' | grep -Fxq 'EXECUTE_US_CMS_NPI_E01_ATTEMPT_01'
          test ! -e research/US-CMS-NPI-E01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261013-US-CMS-NPI-E01-ACTIVE'
          assert cp['active_issue']==203
          assert cp['active_research']=='US-CMS-NPI-E01'
          assert cp['last_decision']=='DEC-318'
          pf=json.loads(Path('research/US-CMS-NPI-E01/evidence/source-preflight-01.json').read_text())
          assert pf['zip_body_opened'] is False
          assert pf['future_membership_opened'] is False
          assert pf['anchor_token']=='100526_101126'
          PY
      - name: Verify first-source release lock before any scientific ZIP access
        run: |
          python -m py_compile tools/verify_us_cms_npi_e01_source_release.py
          python -m unittest discover -s tests -p 'test_us_cms_npi_e01_source_release.py' -v
          python -m tools.verify_us_cms_npi_e01_source_release
      - name: Install deterministic analytical dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input             'requests==2.32.5' 'scipy==1.14.1'
      - name: Confirm qualifying CMS weekly listing (metadata only)
        run: |
          python - <<'PY'
          from tools.run_us_cms_npi_e01 import discover_weeklies
          src = discover_weeklies()  # CMS listing only; no ZIP requested or provider row opened.
          assert src['qualifying'], 'WAIT_SOURCE_US_CMS_NPI_E01: no qualifying CMS weekly listing'
          chosen = src['qualifying'][0]
          assert chosen['href'].startswith('https://download.cms.gov/nppes/'), 'Non-CMS ZIP URL rejected'
          print('First qualifying listing:', chosen['token'], chosen['start'], chosen['end'])
          PY
      - name: Execute frozen E01
        env:
          CMS_NPI_E01_BOUND: '1'
          CMS_NPI_E01_CONTRACT_SHA: '48843c9979336dcd10fdff984f458277062d6f20'
        run: python tools/run_us_cms_npi_e01.py
      - name: Reject source-wait as an empirical commit
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          e=json.loads(Path('research/US-CMS-NPI-E01/evidence/attempt-01.json').read_text())
          if e['disposition']=='WAIT_SOURCE_US_CMS_NPI_E01':
              print('No qualifying future weekly source; do not commit an E01 attempt.')
              sys.exit(42)
          assert e['incremental_monetary_cost_usd']==0
          assert e['monthly_substitution_used'] is False
          assert e['later_week_selected'] is False
          assert e['identity_repair_used'] is False
          assert e['provider_ranking_computed'] is False
          assert e['causal_claim_made'] is False
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable E01 Attempt 01
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-CMS-NPI-E01/evidence/attempt-01.json research/US-CMS-NPI-E01/evidence/attempt-01.md
          git commit -m 'Record US-CMS-NPI-E01 immutable attempt 01'
          git push origin HEAD:main
