name: Watch first qualifying US-CMS-NPI-E01 official weekly source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch-us-cms-npi-e01-source.yml'
  schedule:
    # 00:37 UTC = 09:37 Asia/Seoul; off top-of-hour traffic.
    - cron: '37 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: us-cms-npi-e01-first-weekly-watch
  cancel-in-progress: false
jobs:
  metadata-only-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline parser, contract and boundary tests
        run: |
          python -m py_compile tools/watch_us_cms_npi_e01_first_weekly.py
          python -m unittest discover -s tests -p 'test_us_cms_npi_e01_first_weekly_watch.py' -v
      - name: Confirm authorized issue and frozen active state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e research/US-CMS-NPI-E01/evidence/attempt-01.json
          gh issue view 203 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          if gh issue view 203 --repo '${{ github.repository }}' --json body --jq '.body' | grep -Fxq 'EXECUTE_US_CMS_NPI_E01_ATTEMPT_01'; then
            echo 'Experiment already authorized, disable source-only watch.'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261013-US-CMS-NPI-E01-ACTIVE'
          assert cp['active_issue']==203 and cp['active_research']=='US-CMS-NPI-E01'
          assert cp['last_decision']=='DEC-318'
          pf=json.loads(Path('research/US-CMS-NPI-E01/evidence/source-preflight-03.json').read_text())
          assert pf['contract_sha']=='48843c9979336dcd10fdff984f458277062d6f20'
          assert pf['zip_body_opened'] is False and pf['future_membership_opened'] is False
          assert pf['disposition']=='WAIT_SOURCE_US_CMS_NPI_E01'
          PY
      - name: Recheck official CMS HTML listing only
        run: python tools/watch_us_cms_npi_e01_first_weekly.py | tee /tmp/cms-e01-watch-output.txt
      - name: Save one-time monitored WAIT bootstrap receipt (no repeats)
        run: |
          python - <<'PY'
          import json,re
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('research/US-CMS-NPI-E01/evidence')
          bootstrap=root/'source-watch-bootstrap-01.json'
          candidate=root/'source-candidate-01.json'
          if candidate.exists() or bootstrap.exists():
              print('Candidate/one-time bootstrap already exists; no new WAIT receipt')
          else:
              output=Path('/tmp/cms-e01-watch-output.txt').read_text()
              m=re.fullmatch(r'WAIT_SOURCE_US_CMS_NPI_E01 qualifying=0 source_sha256=([0-9a-f]{64}) unchanged_since_preflight03=(True|False)\s*',output)
              if m is None:
                  raise RuntimeError('Unexpected source watch output; refusing to claim a WAIT result')
              ev={
                  'research':'US-CMS-NPI-E01',
                  'record_type':'INITIAL_SCHEDULED_SOURCE_WATCH_BOOTSTRAP',
                  'disposition':'WAIT_SOURCE_US_CMS_NPI_E01',
                  'checked_at_utc':datetime.now(timezone.utc).isoformat(),
                  'github_run_id':'${{ github.run_id }}',
                  'source_page_sha256':m.group(1),
                  'same_sha_as_immutable_preflight03':m.group(2)=='True',
                  'official_source':'https://download.cms.gov/nppes/NPI_Files.html',
                  'offline_source_watch_regression_tests':'SUCCESS_BEFORE_WATCH_STEP',
                  'metadata_only':True,
                  'zip_body_opened':False,
                  'future_membership_opened':False,
                  'e01_attempt_executed':False,
                  'incremental_monetary_cost_usd':0,
              }
              root.mkdir(parents=True,exist_ok=True)
              bootstrap.write_text(json.dumps(ev,indent=2,sort_keys=True)+'\n')
              (root/'source-watch-bootstrap-01.md').write_text(
                  '# US-CMS-NPI-E01 — first scheduled source-watch execution receipt\n\n'
                  '**State:** \`WAIT_SOURCE_US_CMS_NPI_E01\`\n\n'
                  f'- Observed at UTC: \`{ev["checked_at_utc"]}\`\n'
                  f'- GitHub Actions Run: \`{ev["github_run_id"]}\`\n'
                  f'- Official CMS listing SHA-256: \`{ev["source_page_sha256"]}\`\n'
                  '- Prior source hash identical: '+str(ev['same_sha_as_immutable_preflight03'])+'\n'
                  '- Seven offline fixture checks were run before this source check.\n'
                  '- Metadata only: **true**; ZIP/provider rows opened: **false**.\n'
                  '- Experimental Issue execution marker added: **false**.\n'
                  '- Incremental monetary cost: **0 USD**.\n\n'
                  'No additional WAIT receipts are generated by repeated scheduled checks.\n',
                  encoding='utf-8',
              )
          PY
      - name: Validate candidate evidence if first seen
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('research/US-CMS-NPI-E01/evidence')
          p=root/'source-candidate-01.json'
          if not p.exists():
              print('WAIT_SOURCE — no qualifying future weekly, no new repository evidence')
          else:
              x=json.loads(p.read_text())
              assert x['contract_sha']=='48843c9979336dcd10fdff984f458277062d6f20'
              assert x['type']=='FIRST_OBSERVED_SOURCE_CANDIDATE_METADATA_ONLY'
              assert x['earliest_observed_qualifying'] is not None
              assert x['scientific_first_published_weekly_adjudicated'] is False
              assert x['requires_explicit_issue_marker_before_experiment'] is True
              assert x['zip_body_opened'] is False and x['future_membership_opened'] is False
              assert x['incremental_monetary_cost_usd']==0
              assert (root/'source-candidate-01.md').exists()
              print('SOURCE_CANDIDATE — save immutable listing evidence only, not E01 result')
          PY
      - name: Commit the first source candidate exactly once
        run: |
          if test -e research/US-CMS-NPI-E01/evidence/source-candidate-01.json && \
             ! git ls-files --error-unmatch research/US-CMS-NPI-E01/evidence/source-candidate-01.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/US-CMS-NPI-E01/evidence/source-candidate-01.json \
                    research/US-CMS-NPI-E01/evidence/source-candidate-01.md
            git commit -m 'Record first observed US-CMS-NPI-E01 future weekly source candidate'
            git push origin HEAD:main
          elif test -e research/US-CMS-NPI-E01/evidence/source-watch-bootstrap-01.json && \
               ! git ls-files --error-unmatch research/US-CMS-NPI-E01/evidence/source-watch-bootstrap-01.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/US-CMS-NPI-E01/evidence/source-watch-bootstrap-01.json \
                    research/US-CMS-NPI-E01/evidence/source-watch-bootstrap-01.md
            git commit -m 'Record one-time CMS NPI E01 scheduled source watch WAIT receipt'
            git push origin HEAD:main
          else
            echo 'No new immutable candidate or bootstrap receipt to commit.'
          fi
