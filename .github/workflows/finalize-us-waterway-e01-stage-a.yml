name: Finalize US WATERWAY E01 Stage A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-us-waterway-e01-stage-a.yml'
      - 'tools/finalize_us_waterway_e01_stage_a.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate finalizer
        run: python -m py_compile tools/finalize_us_waterway_e01_stage_a.py
      - name: Adjudicate Stage A and freeze Stage B implementation
        run: python tools/finalize_us_waterway_e01_stage_a.py
      - name: Commit Stage A adjudication atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WATERWAY-E01/README.md research/US-WATERWAY-E01/STAGE_B_IMPLEMENTATION_CONTRACT.md registry/CLM-142.md registry/DEC-138.md registry/CLAIM_LEDGER.md registry/DECISION_LOG.md STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json
          git commit -m 'Accept US-WATERWAY-E01 Stage A PASS and authorize Stage B'
          git push
