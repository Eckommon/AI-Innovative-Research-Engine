name: AMBENCH-D11 BP4 Coupling Temporal-Information Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/AMBENCH-D11/TRIGGER.md'
      - '.github/workflows/ambench-d11-pr.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Verify exact source and transiently download coupling ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/raw work/logs
          MANIFEST_URL='https://data.nist.gov/od/id/ark:/88434/mds2-3842/pdr:v/1.0.3'
          ZIP_URL='https://data.nist.gov/od/ds/mds2-3842/dynamic_laser_coupling_data.zip'
          curl -fL --retry 3 --retry-delay 2 "$MANIFEST_URL" -o work/raw/mds2-3842-v1.0.3.json
          MANIFEST_ACTUAL=$(sha256sum work/raw/mds2-3842-v1.0.3.json | awk '{print $1}')
          MANIFEST_EXPECTED='b3fb55e489568f90fddcbaf8a7f790e8b2a15483f312bdc403f4d08f4419c1cb'
          test "$MANIFEST_ACTUAL" = "$MANIFEST_EXPECTED"
          curl -fL --retry 3 --retry-delay 2 "$ZIP_URL" -o work/raw/dynamic_laser_coupling_data.zip
          ZIP_ACTUAL=$(sha256sum work/raw/dynamic_laser_coupling_data.zip | awk '{print $1}')
          ZIP_EXPECTED='8c4278eb621c1638465e13e87339fe0daba1dcae138f24b9c1d86c186cd74f66'
          ZIP_BYTES=$(stat -c%s work/raw/dynamic_laser_coupling_data.zip)
          test "$ZIP_ACTUAL" = "$ZIP_EXPECTED"
          test "$ZIP_BYTES" = '93566'
          echo "PDR_VERSION=1.0.3" | tee work/logs/integrity.txt
          echo "MANIFEST_SHA256=$MANIFEST_ACTUAL" | tee -a work/logs/integrity.txt
          echo "ZIP_BYTES=$ZIP_BYTES" | tee -a work/logs/integrity.txt
          echo "ZIP_SHA256=$ZIP_ACTUAL" | tee -a work/logs/integrity.txt
          echo "RAW_POLICY=RAW_DATA_TRANSIENT_ONLY" | tee -a work/logs/integrity.txt

      - name: Execute frozen D11 temporal-information diagnostic
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/d11.txt
          import json, math, re, zipfile
          from collections import defaultdict
          from pathlib import PurePosixPath, Path
          import numpy as np
          from scipy.stats import spearmanr

          CASES=['0','1.1','1.2','2.1','2.2','3.1','3.2']
          FEATURES=['median_mid','iqr_mid','mad_diff_mid','ac1_mid','early_contrast','late_contrast','early_shape_slope','late_shape_slope']
          PROCESS={
              '0':   {'laser_power_W':285.0,'scan_speed_mm_s':960.0,'beam_diameter_um':110.0,'ved_ratio':1.00},
              '1.1': {'laser_power_W':285.0,'scan_speed_mm_s':960.0,'beam_diameter_um':76.0, 'ved_ratio':2.09},
              '1.2': {'laser_power_W':285.0,'scan_speed_mm_s':960.0,'beam_diameter_um':131.0,'ved_ratio':0.71},
              '2.1': {'laser_power_W':285.0,'scan_speed_mm_s':1200.0,'beam_diameter_um':110.0,'ved_ratio':0.80},
              '2.2': {'laser_power_W':285.0,'scan_speed_mm_s':800.0,'beam_diameter_um':110.0,'ved_ratio':1.20},
              '3.1': {'laser_power_W':325.0,'scan_speed_mm_s':960.0,'beam_diameter_um':110.0,'ved_ratio':1.14},
              '3.2': {'laser_power_W':245.0,'scan_speed_mm_s':960.0,'beam_diameter_um':110.0,'ved_ratio':0.86},
          }
          GRID=np.round(np.arange(0.050,0.951,0.001),3)
          assert len(GRID)==901

          def case_repeat(base):
              m=re.fullmatch(r'0_([123])sv\.txt',base,re.I)
              if m: return '0',int(m.group(1))
              m=re.fullmatch(r'([123])_([12])_([123])sv\.txt',base,re.I)
              if m: return f'{m.group(1)}.{m.group(2)}',int(m.group(3))
              return None

          def parse_numeric(raw,base):
              text=raw.decode('utf-8-sig',errors='replace')
              vals=[]
              for line in text.splitlines():
                  s=line.strip()
                  if not s: continue
                  parts=s.replace(',',' ').split()
                  if len(parts)<2: continue
                  try:
                      t=float(parts[0]); c=float(parts[1])
                  except ValueError:
                      continue
                  if math.isfinite(t) and math.isfinite(c): vals.append((t,c))
              if len(vals)<100: raise SystemExit(f'HOLD_DATA_INTEGRITY TOO_FEW_FINITE_ROWS {base} {len(vals)}')
              a=np.asarray(vals,float); t=a[:,0]; c=a[:,1]
              if np.any(np.diff(t)<0): raise SystemExit(f'HOLD_DATA_INTEGRITY NONMONOTONIC_TIME {base}')
              if not t[-1]>t[0]: raise SystemExit(f'HOLD_DATA_INTEGRITY ZERO_TIME_SPAN {base}')
              tau=(t-t[0])/(t[-1]-t[0])
              return t,c,tau

          def ols_slope(x,y):
              x=np.asarray(x,float); y=np.asarray(y,float)
              if len(x)<3 or np.ptp(x)<=0: return float('nan')
              xc=x-x.mean(); den=float(np.dot(xc,xc))
              if den<=0: return float('nan')
              return float(np.dot(xc,y-y.mean())/den)

          def track_features(c,tau):
              mid=(tau>=0.20)&(tau<=0.80)
              early=(tau>=0.05)&(tau<0.20)
              late=(tau>0.80)&(tau<=0.95)
              if min(int(mid.sum()),int(early.sum()),int(late.sum()))<3:
                  return {k:float('nan') for k in FEATURES}
              cm=c[mid]; ce=c[early]; cl=c[late]
              med=float(np.median(cm))
              q25,q75=np.quantile(cm,[0.25,0.75])
              dif=np.abs(np.diff(cm))
              if len(cm)>=3 and np.std(cm[:-1])>0 and np.std(cm[1:])>0:
                  ac1=float(np.corrcoef(cm[:-1],cm[1:])[0,1])
              else:
                  ac1=float('nan')
              return {
                  'median_mid':med,
                  'iqr_mid':float(q75-q25),
                  'mad_diff_mid':float(np.median(dif)) if len(dif) else float('nan'),
                  'ac1_mid':ac1,
                  'early_contrast':float(np.median(ce)-med),
                  'late_contrast':float(np.median(cl)-med),
                  'early_shape_slope':ols_slope(tau[early],ce),
                  'late_shape_slope':ols_slope(tau[late],cl),
              }

          # Archive identity and numeric parsing.
          expected=[f'0_{r}sv.txt' for r in (1,2,3)]
          for major,minor in [('1','1'),('1','2'),('2','1'),('2','2'),('3','1'),('3','2')]:
              expected += [f'{major}_{minor}_{r}sv.txt' for r in (1,2,3)]

          tracks=[]
          with zipfile.ZipFile('work/raw/dynamic_laser_coupling_data.zip') as z:
              infos=defaultdict(list)
              for zi in z.infolist():
                  base=PurePosixPath(zi.filename).name
                  if base.lower().endswith('.txt') and case_repeat(base): infos[base].append(zi)
              bases=set(infos)
              if bases!=set(expected):
                  raise SystemExit(f'HOLD_DATA_INTEGRITY FILE_ID_MISMATCH missing={sorted(set(expected)-bases)} extra={sorted(bases-set(expected))}')
              for base in sorted(expected):
                  recs=infos[base]
                  sig={(r.file_size,r.CRC) for r in recs}
                  if len(sig)!=1:
                      raise SystemExit(f'HOLD_DATA_INTEGRITY DUPLICATE_CONTENT_CONFLICT {base}')
                  case,rep=case_repeat(base)
                  t,c,tau=parse_numeric(z.read(recs[0]),base)
                  feat=track_features(c,tau)
                  interp=np.interp(GRID,tau,c)
                  row={'file':base,'case':case,'repeat':rep,'n_samples':int(len(c)),**feat}
                  tracks.append((row,interp))

          tracks=sorted(tracks,key=lambda x:(CASES.index(x[0]['case']),x[0]['repeat']))
          rows=[x[0] for x in tracks]
          W=np.vstack([x[1] for x in tracks])
          labels=np.array([r['case'] for r in rows],object)
          if len(rows)!=21 or any(sum(labels==c)!=3 for c in CASES):
              raise SystemExit('HOLD_DATA_INTEGRITY EXPECTED_7_CASES_X_3_REPEATS')

          print('TRACK_COUNT',len(rows))
          print('CASE_COUNTS',json.dumps({c:int(sum(labels==c)) for c in CASES},sort_keys=True))
          for r in rows: print('D11_TRACK',json.dumps(r,sort_keys=True,allow_nan=True))

          # A. Descriptor variance decomposition.
          X=np.array([[r[f] for f in FEATURES] for r in rows],float)
          variance={}; case_dominated_count=0; repeat_informative_count=0
          descriptor_invalid=[]
          for j,f in enumerate(FEATURES):
              x=X[:,j]
              if not np.all(np.isfinite(x)) or np.ptp(x)<=0:
                  descriptor_invalid.append(f)
                  variance[f]={'status':'UNDEFINED_OR_CONSTANT'}
                  continue
              gm=float(x.mean()); ss_between=0.0; ss_within=0.0
              for c in CASES:
                  xc=x[labels==c]; mc=float(xc.mean())
                  ss_between += len(xc)*(mc-gm)**2
                  ss_within += float(((xc-mc)**2).sum())
              total=ss_between+ss_within
              if total<=0:
                  descriptor_invalid.append(f); variance[f]={'status':'UNDEFINED_OR_CONSTANT'}; continue
              frac=float(ss_within/total)
              if frac<=0.10: lab='CASE_DOMINATED'; case_dominated_count+=1
              elif frac>=0.20: lab='REPEAT_INFORMATIVE'; repeat_informative_count+=1
              else: lab='MIXED_VARIATION'
              variance[f]={'ss_between':ss_between,'ss_within':ss_within,'within_fraction':frac,'label':lab}
              print('DESCRIPTOR_VARIANCE',f,json.dumps(variance[f],sort_keys=True))

          # B. Pointwise normalized-waveform variance decomposition.
          wf=[]; invalid_grid=0
          for j in range(W.shape[1]):
              x=W[:,j]; gm=float(x.mean()); ss_between=0.0; ss_within=0.0
              for c in CASES:
                  xc=x[labels==c]; mc=float(xc.mean())
                  ss_between += len(xc)*(mc-gm)**2
                  ss_within += float(((xc-mc)**2).sum())
              total=ss_between+ss_within
              if total<=1e-15:
                  invalid_grid+=1; continue
              wf.append(float(ss_within/total))
          invalid_grid_fraction=invalid_grid/len(GRID)
          wf_median=float(np.median(wf)) if wf else float('nan')
          wf_high=float(np.mean(np.asarray(wf)>=0.20)) if wf else float('nan')
          print('WF_VALID_POINTS',len(wf))
          print('WF_INVALID_POINTS',invalid_grid)
          print('WF_INVALID_FRACTION',invalid_grid_fraction)
          print('WF_MEDIAN_WITHIN',wf_median)
          print('WF_HIGH_REPEAT_FRACTION',wf_high)

          # C. Descriptor PCA using finite nonconstant columns only.
          valid_idx=[]
          for j,f in enumerate(FEATURES):
              x=X[:,j]
              if np.all(np.isfinite(x)) and np.std(x,ddof=1)>0: valid_idx.append(j)
          if len(FEATURES)-len(valid_idx)>2:
              pca95_dim=None; pca_cum=[]
          else:
              Xv=X[:,valid_idx]
              mu=Xv.mean(axis=0); sd=Xv.std(axis=0,ddof=1)
              Z=(Xv-mu)/sd
              s=np.linalg.svd(Z,full_matrices=False,compute_uv=False)
              ev=s*s; ratio=ev/ev.sum(); cum=np.cumsum(ratio)
              pca95_dim=int(np.searchsorted(cum,0.95)+1)
              pca_cum=[float(v) for v in cum]
          print('PCA_VALID_DESCRIPTOR_COUNT',len(valid_idx))
          print('PCA95_DIM',pca95_dim)
          print('PCA_CUMULATIVE',json.dumps(pca_cum))

          # D. Descriptive seven-case process association.
          assoc={}
          process_names=['laser_power_W','scan_speed_mm_s','beam_diameter_um','ved_ratio']
          for j,f in enumerate(FEATURES):
              if f in descriptor_invalid:
                  assoc[f]={'status':'UNDEFINED_DESCRIPTOR'}; continue
              case_vals=[]
              for c in CASES:
                  case_vals.append(float(np.median(X[labels==c,j])))
              rr={}
              for p in process_names:
                  pv=[PROCESS[c][p] for c in CASES]
                  rho=float(spearmanr(case_vals,pv).statistic)
                  rr[p]=rho
              assoc[f]={'case_medians':dict(zip(CASES,case_vals)),'rho':rr,'strong_process_association':any(abs(v)>=0.80 for v in rr.values())}
              print('PROCESS_ASSOC',f,json.dumps(assoc[f],sort_keys=True))

          # Integrity and frozen final gate.
          integrity_fail=[]
          if len(descriptor_invalid)>2: integrity_fail.append('MORE_THAN_TWO_UNDEFINED_OR_CONSTANT_DESCRIPTORS')
          if invalid_grid_fraction>0.10: integrity_fail.append('MORE_THAN_10_PERCENT_INVALID_WAVEFORM_GRID')
          if not np.isfinite(wf_median) or not np.isfinite(wf_high): integrity_fail.append('WAVEFORM_SUMMARY_UNDEFINED')
          if pca95_dim is None: integrity_fail.append('PCA_UNDEFINED')

          if integrity_fail:
              gate='HOLD_DATA_INTEGRITY'
          else:
              proxy=(case_dominated_count>=6 and wf_median<=0.10 and pca95_dim<=3)
              repeat=(repeat_informative_count>=3 and wf_median>=0.20 and wf_high>=0.50)
              if proxy: gate='COUPLING_PROCESS_CASE_PROXY_DOMINANT'
              elif repeat: gate='REPEAT_LEVEL_TEMPORAL_INFORMATION_PRESENT'
              else: gate='MIXED_TEMPORAL_INFORMATION'

          result={
              'diagnostic':'AMBENCH-D11',
              'source':{'pdr':'mds2-3842','version':'1.0.3','zip_bytes':93566,'zip_sha256':'8c4278eb621c1638465e13e87339fe0daba1dcae138f24b9c1d86c186cd74f66'},
              'n_tracks':21,'n_cases':7,'n_repeats_per_case':3,
              'features':FEATURES,
              'descriptor_invalid':descriptor_invalid,
              'case_dominated_count':case_dominated_count,
              'repeat_informative_count':repeat_informative_count,
              'variance':variance,
              'waveform':{'grid_points':901,'valid_points':len(wf),'invalid_points':invalid_grid,'invalid_fraction':invalid_grid_fraction,'median_within_fraction':wf_median,'high_repeat_fraction':wf_high},
              'pca95_dim':pca95_dim,'pca_cumulative':pca_cum,
              'process_association':assoc,
              'integrity_failures':integrity_fail,
              'gate':gate,
          }
          Path('work/d11-result.json').write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=True))
          print('CASE_DOMINATED_COUNT',case_dominated_count)
          print('REPEAT_INFORMATIVE_COUNT',repeat_informative_count)
          print('FROZEN_DIAGNOSTIC_GATE',gate)
          print('D11_RESULT_JSON',json.dumps(result,sort_keys=True,separators=(',',':'),allow_nan=True))

          summary=Path(__import__('os').environ.get('GITHUB_STEP_SUMMARY',''))
          if str(summary):
              with summary.open('a',encoding='utf-8') as f:
                  f.write('# AMBENCH-D11 diagnostic\n\n')
                  f.write(f'- Gate: **{gate}**\n')
                  f.write(f'- Case-dominated descriptors: **{case_dominated_count}/8**\n')
                  f.write(f'- Repeat-informative descriptors: **{repeat_informative_count}/8**\n')
                  f.write(f'- Waveform median within fraction: **{wf_median:.6f}**\n')
                  f.write(f'- Waveform high-repeat fraction: **{wf_high:.6f}**\n')
                  f.write(f'- PCA95 dimension: **{pca95_dim}**\n')
                  f.write('\nD11 is an information-structure diagnostic only; no physical outcome was used.\n')
          PY

      - name: Confirm no-cost raw-data teardown
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/raw
          test ! -e work/raw
          echo 'RAW_TEARDOWN=SUCCESS'
          echo 'COST-001: standard public-repository runner only; no artifact upload, GPU, larger runner, paid API, SaaS, cloud, or paid data.'
