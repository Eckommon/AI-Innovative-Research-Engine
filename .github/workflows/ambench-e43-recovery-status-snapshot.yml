name: AMBENCH E43 recovery status snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-e43-recovery-status-snapshot.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot recovery run status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/AMBENCH-E43
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; workflow='ambench-e43-recovery.yml'; sha='0740c055041d1b589c70e07c5292bf21ed451bbc'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AI-Innovative-Research-Engine/E43-status'}
          def get(url):
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          base=f'https://api.github.com/repos/{repo}'
          runs=get(f'{base}/actions/workflows/{workflow}/runs?per_page=10').get('workflow_runs',[])
          target=next((r for r in runs if r.get('head_sha')==sha),None)
          out=['---','id: AMBENCH-E43-RECOVERY-STATUS-SNAPSHOT','type: execution-status-snapshot','created: 2026-09-03','performance_output_accessed: false','experiment_contract_changed: false','incremental_monetary_cost_usd: 0','---','','# AMBENCH-E43 Recovery Status Snapshot / Recovery 상태 스냅샷','']
          if not target:
              out += ['**NO_TARGET_RUN_FOUND**','']
          else:
              out += [f'- run_id: `{target.get("id")}`',f'- status: `{target.get("status")}`',f'- conclusion: `{target.get("conclusion")}`',f'- created_at: `{target.get("created_at")}`',f'- updated_at: `{target.get("updated_at")}`','']
              jobs=get(f'{base}/actions/runs/{target["id"]}/jobs?per_page=100').get('jobs',[])
              for j in jobs:
                  out += [f'## {j.get("name")}',f'- status: `{j.get("status")}`',f'- conclusion: `{j.get("conclusion")}`']
                  for s in j.get('steps',[]):out.append(f'- step `{s.get("number")}` — {s.get("name")}: status=`{s.get("status")}`, conclusion=`{s.get("conclusion")}`')
                  out.append('')
          Path('research/AMBENCH-E43/RECOVERY_STATUS_SNAPSHOT.md').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Persist snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add research/AMBENCH-E43/RECOVERY_STATUS_SNAPSHOT.md
          git commit -m 'record AMBENCH-E43 recovery status snapshot'
          git push
