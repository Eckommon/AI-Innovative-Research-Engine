name: JP PORT E01 MLIT parser preflight

on:
  push:
    paths:
      - ".github/workflows/jp-port-e01-mlit-parser-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet openpyxl
      - name: Validate corrected frozen MLIT parser without persisting cargo magnitudes
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,io,hashlib,re,csv
          from pathlib import Path
          from collections import Counter
          import openpyxl

          ESTAT={
            2019:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000031909819","c9b52effc6939080290f9cd2d1eaad894769d5a0af8f5c268bd18dce5218bebf"),
            2020:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000031917650","9ee04b6f968fa475f004c7e397cb74303d6bd3498972ef040c12f3414b1fbe46"),
            2021:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000032059434","de510a1510a178a9dc3d3d0dce9ed5ea8da165929ccb0d381458f2005571dd68"),
            2022:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000032170294","f5e1402c0fba0afa2b8a74f8e463638c9dc6ef141ed9c08355f39125b6fa61c4"),
            2023:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000040024002","4670b2ac230cae5b2bdc6a50ae03c72001137ca24b9c023a6f90e28e77156d04"),
            2024:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000040146718","830c2173b19f9ea106596e043730bd93616dafe93ef0c6a385d633335cef0200"),
          }
          KEYS=Path("research/JP-PORT-E01/STAGE_A_PANEL_KEYS.csv")
          with KEYS.open("r",encoding="utf-8",newline="") as f:
              ports=sorted({r["port"] for r in csv.DictReader(f)})

          def norm(x):
              s=str(x or "").strip().replace("　","")
              return re.sub(r"\s+","",s)

          out=["---","id: JP-PORT-E01-MLIT-PARSER-PREFLIGHT","created: 2026-09-04",
               "relationship_outcome_computed: false","cargo_magnitudes_persisted: false",
               "incremental_monetary_cost_usd: 0","---","",
               "# JP-PORT-E01 MLIT Parser Preflight","",
               f"- E01 frozen port universe in Stage-A keys: **{len(ports)}**","",
               "| Year | Header row | Monthly-label row | Total cols | Unit evidence | Eligible port total rows | Numeric/zero monthly cells | Missing/non-numeric cells |","|---:|---:|---:|---:|---|---:|---:|---:|"]

          for year,(url,expected) in ESTAT.items():
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=180) as r:b=r.read()
              hs=hashlib.sha256(b).hexdigest()
              if hs!=expected:raise RuntimeError(f"hash drift {year}")
              wb=openpyxl.load_workbook(io.BytesIO(b),read_only=True,data_only=True)
              ws=wb["海上出入貨物"]

              hrows=[ri for ri in range(1,16) if norm(ws.cell(ri,3).value)=="港湾" and norm(ws.cell(ri,4).value)=="種別"]
              if len(hrows)!=1:raise RuntimeError(f"header-row ambiguity {year}: {hrows}")
              h=hrows[0]

              candidates=[]
              for rr in range(max(1,h-2),h+1):
                  cols=[c for c in range(5,ws.max_column+1) if norm(ws.cell(rr,c).value)=="合計"]
                  if len(cols)==12:candidates.append((rr,cols))
              if len(candidates)!=1:raise RuntimeError(f"monthly-label ambiguity {year}: {[(r,len(c)) for r,c in candidates]}")
              lr,total_cols=candidates[0]

              header_ton=sum(1 for c in total_cols if norm(ws.cell(h,c).value)=="トン数")
              pre_strings=[norm(ws.cell(r,c).value) for r in range(1,h+1) for c in range(1,ws.max_column+1) if isinstance(ws.cell(r,c).value,str)]
              legacy_unit=any(("単位" in s and "トン" in s) for s in pre_strings)
              if not (header_ton==12 or legacy_unit):
                  raise RuntimeError(f"ton-unit evidence missing {year}")
              unit="12×トン数" if header_ton==12 else "legacy 単位:トン"

              row_counts=Counter()
              row_index={}
              for ri in range(h+1,ws.max_row+1):
                  name=norm(ws.cell(ri,3).value)
                  typ=norm(ws.cell(ri,4).value)
                  if name and typ=="計":
                      row_counts[name]+=1;row_index[name]=ri
              bad={p:row_counts[p] for p in ports if row_counts[p]!=1}
              if bad:raise RuntimeError(f"port total uniqueness {year}: {bad}")

              numeric=0;missing=0
              for p in ports:
                  ri=row_index[p]
                  for c in total_cols:
                      v=ws.cell(ri,c).value
                      if v is None or str(v).strip()=="":
                          missing+=1;continue
                      try:float(v);numeric+=1
                      except:missing+=1
              out.append(f"| {year} | {h} | {lr} | {len(total_cols)} | {unit} | {len(ports)} | {numeric} | {missing} |")
          out += ["","Corrected parser PASS: all six frozen workbooks expose exactly 12 deterministic monthly-total columns and one total row for every E01 Stage-A port.","",
                  "No cargo magnitudes or weather-throughput relationship are persisted here.","",
                  "Incremental monetary cost remained **0 USD**."]
          Path("research/JP-PORT-E01/MLIT_PARSER_PREFLIGHT.md").write_text("\n".join(out),encoding="utf-8")
          PY
      - name: Commit parser preflight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/JP-PORT-E01/MLIT_PARSER_PREFLIGHT.md
          git diff --cached --quiet || git commit -m "validate corrected JP-PORT-E01 MLIT parser"
          git push
