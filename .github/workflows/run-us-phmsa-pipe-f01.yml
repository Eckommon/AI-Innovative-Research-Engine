name: Run US-PHMSA-PIPE-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-phmsa-pipe-f01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  phmsa-pipe-f01:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 42e8195cf0749a48f73039729a991352c201efc7^{commit}
          gh issue view 190 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-PHMSA-PIPE-F01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261002-US-PHMSA-PIPE-F01-ACTIVE'
          assert cp['active_issue']==190
          assert cp['active_research']=='US-PHMSA-PIPE-F01'
          assert cp['last_decision']=='DEC-292'
          contract=Path('research/US-PHMSA-PIPE-F01/README.md').read_text()
          assert 'facility_family: GAS_TRANSMISSION' in contract
          assert 'future_incident_membership_opened: false' in contract
          PY
      - name: Install deterministic HTTP dependency
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5'
      - name: Execute frozen 18-gate PHMSA attempt
        env:
          PHMSA_PIPE_F01_BOUND: '1'
          PHMSA_PIPE_F01_CONTRACT_SHA: '42e8195cf0749a48f73039729a991352c201efc7'
        run: python tools/run_us_phmsa_pipe_f01.py
      - name: Verify future-source and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-PHMSA-PIPE-F01/evidence/attempt-01.json').read_text())
          assert e['later_incident_refresh_opened'] is False
          assert e['future_incident_membership_opened'] is False
          assert e['future_entity_rows_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['prohibited_incident_enforcement_exposure_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-PHMSA-PIPE-F01/evidence/attempt-01.json research/US-PHMSA-PIPE-F01/evidence/attempt-01.md
          git commit -m 'Record US-PHMSA-PIPE-F01 immutable attempt 01'
          git push origin HEAD:main
