name: Revalidate CA GRAIN Week Identity

on:
  push:
    branches: [main]
    paths:
      - 'tools/revalidate_ca_grain_week_identity.py'
      - '.github/workflows/revalidate-ca-grain-week-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate revalidation runner
        run: python -m py_compile tools/revalidate_ca_grain_week_identity.py
      - name: Revalidate GSW week identities without values
        run: python tools/revalidate_ca_grain_week_identity.py
      - name: Commit technical revalidation artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/CA-GRAIN-F01/DATE_SEMANTICS_REVALIDATION.json
          git diff --cached --quiet || git commit -m 'Revalidate CA-GRAIN GSW week identities'
          git push
