name: AMBENCH E43 exact rerun monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-e43-rerun-monitor.yml'

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Poll exact historical run attempt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/AMBENCH-E43
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; run_id=32648786267
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AI-Innovative-Research-Engine/E43-rerun-monitor'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          run=None
          for _ in range(72):
              run=get(f'/actions/runs/{run_id}')
              if int(run.get('run_attempt') or 0)>=2 and run.get('status')=='completed':
                  break
              time.sleep(20)
          run=get(f'/actions/runs/{run_id}')
          jobs=get(f'/actions/runs/{run_id}/jobs?per_page=100').get('jobs',[])
          lines=['---','id: AMBENCH-E43-RERUN-MONITOR','type: exact-rerun-terminal-diagnostic','created: 2026-09-03',f'historical_run_id: {run_id}','experiment_contract_changed: false','incremental_monetary_cost_usd: 0','---','','# AMBENCH-E43 Exact Rerun Monitor / 동일 재실행 모니터','',f'- run_attempt: `{run.get("run_attempt")}`',f'- status: `{run.get("status")}`',f'- conclusion: `{run.get("conclusion")}`',f'- updated_at: `{run.get("updated_at")}`','', '## Jobs / Jobs','']
          for j in jobs:
              lines += [f'### {j.get("name")}',f'- conclusion: `{j.get("conclusion")}`']
              for s in j.get('steps',[]):
                  lines.append(f'- step `{s.get("number")}` — {s.get("name")}: `{s.get("conclusion")}`')
              lines.append('')
          if int(run.get('run_attempt') or 0)<2:
              lines += ['**MONITOR_HOLD_RERUN_ATTEMPT_NOT_OBSERVED**','']
          elif run.get('status')!='completed':
              lines += ['**MONITOR_HOLD_RERUN_NOT_COMPLETED_WITHIN_MONITOR_CAP**','']
          elif run.get('conclusion')=='success':
              lines += ['**MONITOR_PASS_EXACT_RERUN_COMPLETED_SUCCESSFULLY**','']
          else:
              lines += ['**MONITOR_FAIL_EXACT_RERUN_NOT_SUCCESSFUL**','']
          Path('research/AMBENCH-E43/RERUN_MONITOR.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Persist rerun monitor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add research/AMBENCH-E43/RERUN_MONITOR.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'record AMBENCH-E43 exact rerun terminal monitor'
          git push
