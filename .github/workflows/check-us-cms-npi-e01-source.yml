name: Check US-CMS-NPI-E01 Future Source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-us-cms-npi-e01-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify E01 active state
        run: |
          test ! -e research/US-CMS-NPI-E01/evidence/source-preflight-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261013-US-CMS-NPI-E01-ACTIVE'
          assert cp['active_issue']==203
          assert cp['active_research']=='US-CMS-NPI-E01'
          assert cp['last_decision']=='DEC-318'
          contract=Path('research/US-CMS-NPI-E01/README.md').read_text()
          assert 'future_update_body_opened: false' in contract
          assert '100526_101126' in contract
          PY
      - name: Install deterministic HTTP dependency
        run: python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5'
      - name: Execute metadata-only source preflight
        run: python tools/check_us_cms_npi_e01_source.py
      - name: Verify no future body was opened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-CMS-NPI-E01/evidence/source-preflight-01.json').read_text())
          assert e['metadata_only'] is True
          assert e['zip_body_opened'] is False
          assert e['future_membership_opened'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e['qualifying_count'])
          PY
      - name: Commit immutable source preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-CMS-NPI-E01/evidence/source-preflight-01.json research/US-CMS-NPI-E01/evidence/source-preflight-01.md
          git commit -m 'Record US-CMS-NPI-E01 source preflight 01'
          git push origin HEAD:main
