name: Run US-FTA-TRANSIT-F01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-fta-transit-f01.yml'
      - 'tools/run_us_fta_transit_f01.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify active authorization and frozen contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile tools/run_us_fta_transit_f01.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c == {
            'checkpoint_id':'CHK-20260916-US-FTA-TRANSIT-F01-ACTIVE',
            'active_issue':147,
            'active_research':'US-FTA-TRANSIT-F01',
            'last_completed_issue':146,
            'last_completed_research':'PORTFOLIO-R33',
            'last_decision':'DEC-206',
            'updated':'2026-09-16',
          }
          s=Path('research/US-FTA-TRANSIT-F01/README.md').read_text()
          assert 'status: CONTRACT_FROZEN_PRE_ISSUE' in s
          assert 'amkt-4ehs' in s and '5ti2-5uiv' in s and '9ivb-8ae9' in s
          assert 'PASS_US_FTA_TRANSIT_F01_AGENCY_MODE_TIME_JOIN_READY' in s
          assert 'HOLD_US_FTA_TRANSIT_F01_SOURCE_SCHEMA_SCOPE_OR_IDENTITY' in s
          assert 'candidate_outcome_opened: false' in s
          assert 'relationship_computed: false' in s
          print('US_FTA_TRANSIT_F01_AUTHORIZATION_VERIFY_PASS')
          PY
          test "$(gh api repos/${GITHUB_REPOSITORY}/issues/147 --jq .state)" = "open"

      - name: Execute frozen official-source feasibility gate
        run: python tools/run_us_fta_transit_f01.py

      - name: Validate immutable staging boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/US-FTA-TRANSIT-F01/STAGING_RESULT.json')
          r=json.loads(p.read_text())
          assert r['protocol']=='US-FTA-TRANSIT-F01'
          assert r['issue']==147
          assert r['contract_commit']=='70c41fc8202579436ad7560118548fc1c2a34593'
          assert r['valid_evaluation'] is True
          assert r['disposition'] in {
            'PASS_US_FTA_TRANSIT_F01_AGENCY_MODE_TIME_JOIN_READY',
            'HOLD_US_FTA_TRANSIT_F01_SOURCE_SCHEMA_SCOPE_OR_IDENTITY',
          }
          assert set(r['checks']) == {str(i) for i in range(1,20)}
          b=r['boundaries']
          for k in [
            'agency_name_repair_used',
            'manual_or_fuzzy_identity_repair_used',
            'breakdown_conditioned_major_safety_event_occurrence_opened',
            'row_level_breakdown_event_join_persisted',
            'relationship_computed',
            'predictive_metric_computed',
            'causal_claim_made',
          ]:
            assert b[k] is False, (k,b[k])
          assert r['incremental_monetary_cost_usd']==0
          text=p.read_text().lower()
          forbidden=[
            'event_count_by_breakdown', 'event_rate_by_breakdown',
            'joined_event_rows', 'agency_risk_rank', 'auc', 'regression_coefficient'
          ]
          assert not any(x in text for x in forbidden)
          print('US_FTA_TRANSIT_F01_STAGING_BOUNDARY_PASS')
          print('disposition=',r['disposition'])
          print('failed_checks=',[k for k,v in r['checks'].items() if not v['pass']])
          PY

      - name: Commit immutable staging result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FTA-TRANSIT-F01/STAGING_RESULT.json
          git commit -m 'Stage US-FTA-TRANSIT-F01 evaluation'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm zero-cost boundary
        run: |
          echo 'Official FTA/DOT Open Data endpoints only.'
          echo 'Standard public-repository GitHub-hosted runner only.'
          echo 'No paid API, runner, source, authentication bypass, or artifact upload is used.'
          echo 'Incremental monetary cost: 0 USD.'
