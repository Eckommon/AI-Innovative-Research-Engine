name: US UTIL F01 source identity preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-util-f01-source-preflight.yml'
      - 'tools/us_util_f01_source_preflight.py'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate runner
        run: python -m py_compile tools/us_util_f01_source_preflight.py

      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Run outcome-blind source preflight
        run: python tools/us_util_f01_source_preflight.py

      - name: Commit derived preflight artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/US-UTIL-F01/SOURCE_MANIFEST.csv \
            research/US-UTIL-F01/EIA_MEMBER_MANIFEST.csv \
            research/US-UTIL-F01/SCHEMA_MANIFEST.csv \
            research/US-UTIL-F01/COUNTY_KEY_DIAGNOSTIC.csv \
            research/US-UTIL-F01/SOURCE_CARDINALITY_PREFLIGHT.md
          git diff --cached --quiet && { echo 'No preflight changes'; exit 1; }
          git commit -m "Record US-UTIL-F01 source identity preflight"
          git push
