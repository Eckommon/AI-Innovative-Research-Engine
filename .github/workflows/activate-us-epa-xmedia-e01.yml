name: Activate US-EPA-XMEDIA-E01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-us-epa-xmedia-e01.yml'
      - 'tools/activate_us_epa_xmedia_e01.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pre-outcome authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile tools/activate_us_epa_xmedia_e01.py
          test "$(git log -1 --format=%H -- research/US-EPA-XMEDIA-E01/README.md)" = "46938afda3fbeaf9349a3c508502f8d4a3c973a3"
          test "$(git log -1 --format=%H -- research/US-EPA-XMEDIA-N01/DESIGN_MANIFEST.json)" = "78f0f0f1458463c79c326c016d415dc5533af026"
          test "$(gh api repos/${GITHUB_REPOSITORY}/issues/152 --jq .state)" = "open"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['checkpoint_id']=='CHK-20260917-US-EPA-XMEDIA-N01-TERMINAL'
          assert c['active_issue']=='none' and c['last_decision']=='DEC-215'
          m=json.loads(Path('research/US-EPA-XMEDIA-N01/DESIGN_MANIFEST.json').read_text())
          assert len(m['pairs'])==307
          assert m['canonical_core_sha256']=='19e1b3a1963fe008811aa230336e12ec69a348b03cf37bd656ea9d3fba8e5aaf'
          assert m['outcome_membership_included'] is False
          s=Path('research/US-EPA-XMEDIA-E01/README.md').read_text()
          assert 'status: CONTRACT_FROZEN_PRE_ISSUE' in s
          assert 'PASS_POSITIVE_MATERIAL_US_EPA_XMEDIA_E01_RELATIONSHIP' in s
          assert 'NO_PREREGISTERED_POSITIVE_US_EPA_XMEDIA_E01_RELATIONSHIP' in s
          print('US_EPA_XMEDIA_E01_PREOUTCOME_AUTHORIZATION_VERIFY_PASS')
          PY
      - name: Activate canonical E01 state
        run: python tools/activate_us_epa_xmedia_e01.py
      - name: Verify active mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['checkpoint_id']=='CHK-20260917-US-EPA-XMEDIA-E01-ACTIVE'
          assert c['active_issue']==152 and c['active_research']=='US-EPA-XMEDIA-E01'
          assert c['last_decision']=='DEC-216'
          assert 'US_EPA_XMEDIA_E01_ACTIVE__FROZEN_2024_E90_PAIRED_OUTCOME' in Path('STATUS.md').read_text()
          print('US_EPA_XMEDIA_E01_ACTIVATION_VERIFY_PASS')
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/DEC-216.md registry/DECISION_LOG.md STATUS.md context/checkpoint.json context/SESSION_HANDOFF.md
          git commit -m 'Activate US-EPA-XMEDIA-E01'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Confirm frozen boundary
        run: |
          echo 'Only frozen 2024 E90 endpoint is authorized.'
          echo 'Incremental monetary cost: 0 USD.'
