name: State Integrity / 상태 무결성

on:
  push:
    branches: [main]
    paths:
      - 'STATUS.md'
      - 'context/SESSION_HANDOFF.md'
      - 'context/PROJECT_MEMORY.md'
      - 'registry/DECISION_LOG.md'
      - 'docs/HALLUCINATION_CONTROL_PROTOCOL.md'
      - 'docs/GPT_GITHUB_SYNC_PROTOCOL.md'
      - '.github/workflows/state-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'STATUS.md'
      - 'context/SESSION_HANDOFF.md'
      - 'context/PROJECT_MEMORY.md'
      - 'registry/DECISION_LOG.md'
      - 'docs/HALLUCINATION_CONTROL_PROTOCOL.md'
      - 'docs/GPT_GITHUB_SYNC_PROTOCOL.md'
      - '.github/workflows/state-integrity.yml'
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  checkpoint-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify synchronized checkpoint and live Issue state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import urllib.request

          REQUIRED = [
              'checkpoint_id',
              'active_issue',
              'active_research',
              'last_completed_issue',
              'last_completed_research',
              'last_decision',
              'updated',
          ]

          def front_matter(path):
              text = Path(path).read_text(encoding='utf-8')
              lines = text.splitlines()
              if not lines or lines[0].strip() != '---':
                  raise SystemExit(f'{path}: missing YAML-style front matter')
              data = {}
              for line in lines[1:]:
                  if line.strip() == '---':
                      break
                  if not line.strip() or line[:1].isspace() or ':' not in line:
                      continue
                  k, v = line.split(':', 1)
                  data[k.strip()] = v.strip().strip('"').strip("'")
              missing = [k for k in REQUIRED if not data.get(k)]
              if missing:
                  raise SystemExit(f'{path}: missing checkpoint fields: {missing}')
              return data

          status = front_matter('STATUS.md')
          handoff = front_matter('context/SESSION_HANDOFF.md')

          for key in REQUIRED:
              if status[key] != handoff[key]:
                  raise SystemExit(
                      f'CHECKPOINT_MISMATCH {key}: STATUS={status[key]!r} HANDOFF={handoff[key]!r}'
                  )

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']

          def api(path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          open_items = api('/issues?state=open&per_page=100')
          open_issues = [item for item in open_items if 'pull_request' not in item]
          open_numbers = {int(item['number']) for item in open_issues}

          active_raw = status['active_issue'].lower()
          if active_raw in {'none', 'null', 'n/a'}:
              if open_numbers:
                  raise SystemExit(
                      'STATE_DRIFT_DETECTED: active_issue=none but open research Issue(s) exist: '
                      + ','.join(map(str, sorted(open_numbers)))
                  )
          else:
              try:
                  active_number = int(status['active_issue'].lstrip('#'))
              except ValueError as exc:
                  raise SystemExit(f'Invalid active_issue: {status["active_issue"]!r}') from exc
              if active_number not in open_numbers:
                  raise SystemExit(
                      f'STATE_DRIFT_DETECTED: declared active Issue #{active_number} is not open; '
                      f'open Issues={sorted(open_numbers)}'
                  )

          try:
              last_number = int(status['last_completed_issue'].lstrip('#'))
          except ValueError as exc:
              raise SystemExit(
                  f'Invalid last_completed_issue: {status["last_completed_issue"]!r}'
              ) from exc

          last_issue = api(f'/issues/{last_number}')
          if 'pull_request' in last_issue or last_issue.get('state') != 'closed':
              raise SystemExit(
                  f'STATE_DRIFT_DETECTED: last_completed_issue #{last_number} is not a closed Issue'
              )

          research_id = status['last_completed_research']
          result_path = Path('research') / research_id / 'RESULT.md'
          readme_path = Path('research') / research_id / 'README.md'
          if not result_path.exists() and not readme_path.exists():
              raise SystemExit(
                  f'STATE_DRIFT_DETECTED: no durable research artifact for {research_id}'
              )

          print('STATE_INTEGRITY_PASS')
          print('checkpoint_id=', status['checkpoint_id'])
          print('active_issue=', status['active_issue'])
          print('last_completed_issue=', status['last_completed_issue'])
          print('last_completed_research=', status['last_completed_research'])
          print('last_decision=', status['last_decision'])
          PY

      - name: Confirm COST-001 boundary
        run: |
          echo 'State-integrity uses a standard public-repository GitHub-hosted runner only.'
          echo 'No paid API, larger/GPU runner, or artifact upload is used.'
