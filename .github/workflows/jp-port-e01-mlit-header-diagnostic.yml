name: JP PORT E01 MLIT header schema diagnostic

on:
  push:
    paths:
      - ".github/workflows/jp-port-e01-mlit-header-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet openpyxl
      - name: Inspect only MLIT cargo header strings across frozen years
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,io,hashlib,os
          from pathlib import Path
          import openpyxl
          ESTAT={
            2019:"https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000031909819",
            2020:"https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000031917650",
            2021:"https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000032059434",
            2022:"https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000032170294",
            2023:"https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000040024002",
            2024:"https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000040146718",
          }
          OUT="research/JP-PORT-E01/MLIT_HEADER_DIAGNOSTIC.md"
          lines=["---","id: JP-PORT-E01-MLIT-HEADER-DIAGNOSTIC","created: 2026-09-04",
                 "relationship_outcome_computed: false","cargo_magnitudes_persisted: false",
                 "incremental_monetary_cost_usd: 0","---","",
                 "# JP-PORT-E01 MLIT Header Diagnostic","",
                 "Only string/header cells are persisted. Numeric cargo magnitudes are masked.",""]
          for y,u in ESTAT.items():
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=180) as r:b=r.read()
              wb=openpyxl.load_workbook(io.BytesIO(b),read_only=True,data_only=True)
              ws=wb["海上出入貨物"]
              lines += [f"## {y}",f"- SHA-256: {hashlib.sha256(b).hexdigest()}",
                        f"- dimensions: {ws.max_row} x {ws.max_column}",""]
              for ri in range(1,min(ws.max_row,16)+1):
                  cells=[]
                  for ci in range(1,min(ws.max_column,30)+1):
                      v=ws.cell(ri,ci).value
                      if v is None or str(v).strip()=="":continue
                      if isinstance(v,str):
                          vv=v.replace("\n"," / ").strip()
                      else:
                          vv="<NUM>"
                      cells.append(f"{ws.cell(ri,ci).coordinate}={vv}")
                  if cells:lines.append("- "+" | ".join(cells))
              # locate candidate 港湾/種別 header cells and 合計/トン数 rows.
              hits=[]
              for ri in range(1,min(ws.max_row,20)+1):
                  vals=[str(ws.cell(ri,ci).value or "").strip() for ci in range(1,ws.max_column+1)]
                  toks=[t for t in ["港湾","種別","合計","トン数"] if t in vals]
                  if toks:hits.append((ri,toks))
              lines += ["",f"- candidate header-token rows: {hits}",""]
          lines += ["No weather-throughput coefficient was calculated in this diagnostic.","",
                    "Incremental monetary cost remained **0 USD**."]
          Path(OUT).write_text("\n".join(lines),encoding="utf-8")
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/JP-PORT-E01/MLIT_HEADER_DIAGNOSTIC.md
          git diff --cached --quiet || git commit -m "diagnose frozen MLIT cargo header schema"
          git push
