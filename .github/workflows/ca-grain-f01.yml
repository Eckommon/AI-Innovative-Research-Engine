name: CA GRAIN F01 Source Probe

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_ca_grain_f01.py'
      - '.github/workflows/ca-grain-f01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner
        run: python -m py_compile tools/run_ca_grain_f01.py
      - name: Run outcome-blind source/join probe
        run: python tools/run_ca_grain_f01.py
      - name: Commit derived feasibility artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/CA-GRAIN-F01/SOURCE_PANEL_MANIFEST.json research/CA-GRAIN-F01/RESULT.md
          git diff --cached --quiet || git commit -m 'Record CA-GRAIN-F01 source/join feasibility result'
          git push
