name: Finalize US-FTA-TRANSIT-F01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-us-fta-transit-f01.yml'
      - 'tools/finalize_us_fta_transit_f01.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify active state and immutable PASS staging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile tools/finalize_us_fta_transit_f01.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c == {
            'checkpoint_id':'CHK-20260916-US-FTA-TRANSIT-F01-ACTIVE',
            'active_issue':147,
            'active_research':'US-FTA-TRANSIT-F01',
            'last_completed_issue':146,
            'last_completed_research':'PORTFOLIO-R33',
            'last_decision':'DEC-206',
            'updated':'2026-09-16',
          }
          r=json.loads(Path('research/US-FTA-TRANSIT-F01/STAGING_RESULT.json').read_text())
          assert r['disposition']=='PASS_US_FTA_TRANSIT_F01_AGENCY_MODE_TIME_JOIN_READY'
          assert r['valid_evaluation'] is True
          assert all(x['pass'] for x in r['checks'].values())
          assert set(r['checks']) == {str(i) for i in range(1,20)}
          assert r['boundaries']['breakdown_conditioned_major_safety_event_occurrence_opened'] is False
          assert r['boundaries']['row_level_breakdown_event_join_persisted'] is False
          assert r['boundaries']['relationship_computed'] is False
          print('US_FTA_TRANSIT_F01_IMMUTABLE_PASS_VERIFY')
          PY
          test "$(git log -1 --format=%H -- research/US-FTA-TRANSIT-F01/STAGING_RESULT.json)" = "de03e3e01b8b516e17ebb4baa1ef047a707d1a9c"
          test "$(gh api repos/${GITHUB_REPOSITORY}/issues/147 --jq .state)" = "open"

      - name: Finalize F01 PASS
        run: python tools/finalize_us_fta_transit_f01.py

      - name: Verify terminal mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c == {
            'checkpoint_id':'CHK-20260916-US-FTA-TRANSIT-F01-TERMINAL',
            'active_issue':'none',
            'active_research':'NONE',
            'last_completed_issue':147,
            'last_completed_research':'US-FTA-TRANSIT-F01',
            'last_decision':'DEC-207',
            'updated':'2026-09-16',
          }
          assert 'US_FTA_TRANSIT_F01_PASS__N01_AUTHORIZATION_REQUIRED' in Path('STATUS.md').read_text()
          assert 'PASS_US_FTA_TRANSIT_F01_AGENCY_MODE_TIME_JOIN_READY' in Path('research/US-FTA-TRANSIT-F01/RESULT.md').read_text()
          assert Path('registry/DEC-207.md').exists()
          assert Path('registry/CLM-185.md').exists()
          assert '`DEC-207`' in Path('registry/DECISION_LOG.md').read_text()
          assert '`CLM-185`' in Path('registry/CLAIM_LEDGER.md').read_text()
          print('US_FTA_TRANSIT_F01_TERMINAL_VERIFY_PASS')
          PY

      - name: Commit terminalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FTA-TRANSIT-F01/README.md research/US-FTA-TRANSIT-F01/RESULT.md registry/DEC-207.md registry/CLM-185.md registry/DECISION_LOG.md registry/CLAIM_LEDGER.md STATUS.md context/checkpoint.json context/SESSION_HANDOFF.md
          git commit -m 'Finalize US-FTA-TRANSIT-F01 PASS'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close Issue 147 as completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/147" -X PATCH -f state=closed -f state_reason=completed >/dev/null
          echo 'Issue #147 closed completed.'

      - name: Confirm zero-cost boundary
        run: |
          echo 'No paid source, API, runner, or artifact upload is used.'
          echo 'Incremental monetary cost: 0 USD.'
