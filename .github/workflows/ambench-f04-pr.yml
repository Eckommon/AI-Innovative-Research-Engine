name: AMBENCH-F04 Calibration Algorithm Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/AMBENCH-F04/TRIGGER.md'
      - '.github/workflows/ambench-f04-pr.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve exact NIST PDR manifest and small algorithm artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/raw work/candidates work/logs work/result
          curl -fL --retry 3 'https://data.nist.gov/od/id/ark:/88434/mds2-2716/pdr:v/1.3.1' -o work/raw/manifest.json
          curl -fL --retry 3 'https://data.nist.gov/od/ds/mds2-2716/2716_README.txt' -o work/raw/2716_README.txt
          python - <<'PY' | tee work/logs/components.txt
          import json, re, urllib.request
          from pathlib import Path
          o=json.loads(Path('work/raw/manifest.json').read_text())
          comps=o.get('components',[])
          print('VERSION',o.get('version'),'COMPONENTS',len(comps))
          selected=[]
          for c in comps:
              fp=c.get('filepath',''); size=int(c.get('size') or 0); url=c.get('downloadURL') or ''
              sha=((c.get('checksum') or {}).get('hash') or '')
              print('COMPONENT',json.dumps({'filepath':fp,'size':size,'sha256':sha,'downloadURL':url},sort_keys=True))
              low=fp.lower()
              textlike=low.endswith(('.txt','.md','.py','.m','.mat','.json','.csv','.yaml','.yml','.xml','.ini'))
              keyword=any(k in low for k in ['calib','process','therm','temp','cool','script','readme','camera'])
              if size and size <= 25_000_000 and (textlike or keyword) and url:
                  selected.append((fp,size,url,sha))
          print('SELECTED_COUNT',len(selected))
          for i,(fp,size,url,sha) in enumerate(selected):
              safe=re.sub(r'[^A-Za-z0-9._-]+','__',fp)
              out=Path('work/candidates')/f'{i:02d}__{safe}'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'AI-Innovative-Research-Engine/0.7'})
                  with urllib.request.urlopen(req,timeout=120) as r:
                      data=r.read()
                  out.write_bytes(data)
                  print('DOWNLOADED',fp,'->',out.name,'BYTES',len(data))
              except Exception as e:
                  print('DOWNLOAD_FAIL',fp,repr(e))
          PY
          sha256sum work/raw/* work/candidates/* 2>/dev/null | sort | tee work/logs/local_sha256.txt || true
          ls -lh work/candidates | tee work/logs/candidate_files.txt

      - name: Search authoritative artifacts for calibration and cooling-rate algorithm semantics
        shell: bash
        run: |
          python - <<'PY' | tee work/logs/semantic_search.txt
          from pathlib import Path
          import re, json
          terms=[
            'calibration','calibrat','temperature','digital level','emissivity','regression',
            'Coeff_a','Coeff_b','Coeff_c','solidus','liquidus','1298','1260','1336',
            'cooling rate','solidification','inflection','spatter','threshold','30 adjacent','centerline'
          ]
          records=[]
          paths=[Path('work/raw/2716_README.txt')]+sorted(Path('work/candidates').glob('*'))
          for p in paths:
              if not p.is_file(): continue
              raw=p.read_bytes()
              text=raw.decode('utf-8',errors='replace')
              # Binary-like files are retained in inventory but not interpreted as prose.
              printable=sum(ch.isprintable() or ch in '\n\r\t' for ch in text[:100000]) / max(1,len(text[:100000]))
              print('\n===== FILE',p.name,'BYTES',len(raw),'PRINTABLE',printable,'=====')
              if printable < 0.70:
                  print('BINARY_OR_OPAQUE')
                  continue
              hits=[]
              for term in terms:
                  for m in re.finditer(re.escape(term),text,re.I):
                      s=max(0,m.start()-500); e=min(len(text),m.end()+1200)
                      snippet=' '.join(text[s:e].split())
                      hits.append({'term':term,'snippet':snippet})
                      if len([h for h in hits if h['term']==term])>=8: break
              dedup=[]; seen=set()
              for h in hits:
                  key=h['snippet']
                  if key not in seen:
                      seen.add(key); dedup.append(h)
              for h in dedup[:120]: print('HIT',h['term'],h['snippet'])
              records.append({'file':p.name,'hits':dedup})
          Path('work/result/semantic_hits.json').write_text(json.dumps(records,indent=2),encoding='utf-8')
          PY

      - name: Upload F04 algorithm-recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambench-f04-run1-algorithm-recovery
          path: |
            work/logs/
            work/result/
            work/raw/manifest.json
            work/raw/2716_README.txt
            work/candidates/
          if-no-files-found: error
          retention-days: 30
