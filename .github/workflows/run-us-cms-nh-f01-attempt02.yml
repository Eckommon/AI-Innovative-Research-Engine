name: Run US-CMS-NH-F01 Attempt 02
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-cms-nh-f01-attempt02.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  cms-nh-f01-attempt02:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify correction boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view 194 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test -e research/US-CMS-NH-F01/evidence/attempt-01.json
          test ! -e research/US-CMS-NH-F01/evidence/attempt-02.json
          git cat-file -e 20c7b414fbd733eb09d2a0cb8497c6b504f2a08a^{commit}
          python - <<'PY'
          import json
          from pathlib import Path
          a1=json.loads(Path('research/US-CMS-NH-F01/evidence/attempt-01.json').read_text())
          assert a1['archive_ui']['text']==''
          assert a1['archive_ui']['dates']==[]
          c=Path('research/US-CMS-NH-F01/IMPLEMENTATION_CORRECTION_02.md').read_text()
          assert 'scientific_threshold_changed: false' in c
          assert 'archive_window_changed: false' in c
          assert 'future_outcome_firewall_changed: false' in c
          PY
      - name: Install deterministic browser
        run: |
          python -m pip install --disable-pip-version-check --no-input 'requests==2.32.5' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Execute source-native archive discovery
        env:
          CMS_NH_F01_BOUND: '1'
          CMS_NH_F01_CONTRACT_SHA: 'fed9f05c7271c712881fc9b7936ca1a5f7912347'
        run: python tools/run_us_cms_nh_f01_attempt02.py
      - name: Verify firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-CMS-NH-F01/evidence/attempt-02.json').read_text())
          assert e['sep2026_or_later_row_bodies_opened']==0
          assert e['future_standard_survey_membership_opened'] is False
          assert e['future_serious_deficiency_membership_opened'] is False
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 02 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-CMS-NH-F01/evidence/attempt-02.json research/US-CMS-NH-F01/evidence/attempt-02.md
          git commit -m 'Record US-CMS-NH-F01 immutable attempt 02'
          git push origin HEAD:main
