name: Run US-HUD-MF-F01 Attempt 03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-hud-mf-f01-attempt03.yml'
  workflow_dispatch:
  issues:
    types: [edited]
permissions:
  contents: write
  issues: read
jobs:
  hud-mf-f01-attempt03:
    if: github.event_name != 'issues' || github.event.issue.number == 168
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and Attempt 03 boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 73eec2f714f3e1c89d0441ffb9f746721bda3443^{commit}
          git cat-file -e 73ce4cfe7f475bb177186ab7d38ce7374f5e8fee^{commit}
          git cat-file -e 0dcd10db85848957ae950b592a13ed83348c1964^{commit}
          git cat-file -e 4f59cc6e0b705e2ccbd91f2324a3a99ea70b73b7^{commit}
          gh issue view 168 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test -e research/US-HUD-MF-F01/evidence/attempt-01.json
          test -e research/US-HUD-MF-F01/evidence/attempt-02.json
          test ! -e research/US-HUD-MF-F01/evidence/attempt-03.json
          test ! -e research/US-HUD-MF-F01/evidence/attempt-03.md
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260921-US-HUD-MF-F01-ACTIVE'
          assert cp['active_issue']==168
          assert cp['active_research']=='US-HUD-MF-F01'
          assert cp['last_decision']=='DEC-246'
          a2=json.loads(Path('research/US-HUD-MF-F01/evidence/attempt-02.json').read_text())
          assert a2['future_terminated_rows_opened']==0
          assert a2['future_adverse_membership_opened'] is False
          assert 5 in a2['failed_gates']
          assert a2['gates'][4]['gate']==5
          assert 'AMORITIZED PRINCIPAL BALANCE' in a2['gates'][4]['observed']['headers']
          PY
      - name: Install deterministic workbook parsers
        run: python -m pip install --disable-pip-version-check --no-input 'openpyxl==3.1.5' 'xlrd==2.0.1'
      - name: Execute frozen Attempt 03
        env:
          HUD_MF_F01_ISSUE_BOUND: '1'
          HUD_MF_F01_CONTRACT_SHA: '73eec2f714f3e1c89d0441ffb9f746721bda3443'
        run: python tools/run_us_hud_mf_f01_attempt03.py
      - name: Verify correction scope and future firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-HUD-MF-F01/evidence/attempt-03.json').read_text())
          assert e['attempt']==3
          assert e['attempt_02_commit']=='0dcd10db85848957ae950b592a13ed83348c1964'
          assert e['implementation_correction_commit']=='4f59cc6e0b705e2ccbd91f2324a3a99ea70b73b7'
          assert e['scientific_threshold_changed'] is False
          assert e['snapshot_changed'] is False
          assert e['identity_rule_changed'] is False
          assert e['future_outcome_firewall_changed'] is False
          assert e['future_terminated_rows_opened']==0
          assert e['future_adverse_membership_opened'] is False
          assert e['future_entity_body_bytes_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'], e.get('attempt_valid'), e.get('pass_count'), e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 03 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-HUD-MF-F01/evidence/attempt-03.json research/US-HUD-MF-F01/evidence/attempt-03.md
          git commit -m 'Record US-HUD-MF-F01 immutable attempt 03'
          git push origin HEAD:main
