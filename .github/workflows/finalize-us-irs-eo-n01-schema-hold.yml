name: Finalize US-IRS-EO-N01 Gate 5 HOLD
on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_us_irs_eo_n01_schema_hold.py'
      - '.github/workflows/finalize-us-irs-eo-n01-schema-hold.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen contract, evidence, and live Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 70898f12e1b1fb2ad233aaf0a1cb13ff49d73fe8^{commit}
          git cat-file -e 114c673aa2ddce5feeefdd5d24efa308c7bad783^{commit}
          gh issue view 164 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e registry/DEC-240.md
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260918-US-IRS-EO-N01-ACTIVE'
          assert cp['active_issue']==164 and cp['active_research']=='US-IRS-EO-N01'
          assert cp['last_decision']=='DEC-239'
          p1=json.loads(Path('research/US-IRS-EO-N01/schema-preflight.json').read_text())
          p2=json.loads(Path('research/US-IRS-EO-N01/schema-preflight-02.json').read_text())
          pm=json.loads(Path('research/US-IRS-EO-N01/schema-application-pending-map.json').read_text())
          assert p2['candidate_resolved']['ApplicationPendingInd'] is False
          assert not any('TEGE990/IRS990/IRS990.xsd' in x['file'] for x in pm['hits'])
          assert p1['historical_index_rows_opened']==0
          assert p1['historical_xml_return_rows_opened']==0
          assert p1['future_outcome_rows_opened']==0
          assert p1['automatic_revocation_entity_body_bytes_consumed']==0
          PY
      - name: Build terminal HOLD state
        run: python tools/finalize_us_irs_eo_n01_schema_hold.py
      - name: Verify checkpoint mirrors
        run: python tools/check_checkpoint.py
      - name: Commit terminal state locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-IRS-EO-N01/RESULT.md registry/DEC-240.md registry/DECISION_LOG.md context/checkpoint.json STATUS.md context/SESSION_HANDOFF.md
          git commit -m 'Finalize US-IRS-EO-N01 Gate 5 schema HOLD'
      - name: Close Issue 164 completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close 164 --repo '${{ github.repository }}' --reason completed
      - name: Push terminal state
        run: git push origin HEAD:main
      - name: Confirm boundary
        run: |
          echo 'N01 terminal Gate-5 scientific HOLD.'
          echo 'No historical organization rows or Automatic Revocation rows were opened.'
          echo 'E01 unauthorized; PORTFOLIO-R40 required; cost=0 USD.'
