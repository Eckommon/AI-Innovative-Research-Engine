name: Run CA-CRA-CHARITY-F01 Immutable Gate
on:
  workflow_dispatch:
  issues:
    types: [edited]
permissions:
  contents: write
  issues: read
jobs:
  cra-charity-f01:
    if: github.event_name != 'issues' || github.event.issue.number == 192
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 25ec9b9c9031e6ee48ea1e4e47ddb27826506331^{commit}
          gh issue view 192 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/CA-CRA-CHARITY-F01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20261002-CA-CRA-CHARITY-F01-ACTIVE'
          assert cp['active_issue']==192
          assert cp['active_research']=='CA-CRA-CHARITY-F01'
          assert cp['last_decision']=='DEC-296'
          c=Path('research/CA-CRA-CHARITY-F01/README.md').read_text()
          assert 'Exactly **18/18 PASS** is required.' in c
          assert 'future_revocation_membership_opened: false' in c
          PY
      - name: Install deterministic parsers
        run: |
          python -m pip install --disable-pip-version-check --no-input             'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Execute frozen 18-gate Attempt 01
        env:
          CRA_CHARITY_F01_BOUND: '1'
          CRA_CHARITY_F01_CONTRACT_SHA: '25ec9b9c9031e6ee48ea1e4e47ddb27826506331'
        run: python tools/run_ca_cra_charity_f01.py
      - name: Verify outcome and cost firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/CA-CRA-CHARITY-F01/evidence/attempt-01.json').read_text())
          assert e['later_status_refresh_opened'] is False
          assert e['future_revocation_membership_opened'] is False
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['prohibited_compliance_exposure_computed'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/CA-CRA-CHARITY-F01/evidence/attempt-01.json research/CA-CRA-CHARITY-F01/evidence/attempt-01.md
          git commit -m 'Record CA-CRA-CHARITY-F01 immutable attempt 01'
          git push origin HEAD:main
