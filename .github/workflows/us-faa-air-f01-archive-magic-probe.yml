name: FAA F01 official archive four-byte read-only preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/us-faa-air-f01-archive-magic-probe.yml']
permissions:
  contents: write
concurrency:
  group: us-faa-air-f01-archive-magic-one-shot
  cancel-in-progress: false
jobs:
  source-magic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source-locked FAA issue, independent E01, previous immutable evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          aux=json.loads(Path('context/SECONDARY_TRACKS.json').read_text())
          h=json.loads(Path('research/US-FAA-AIR-F01/evidence/source-access-preflight-01.json').read_text())
          g=json.loads(Path('research/US-FAA-AIR-F01/evidence/document-get-diagnostic-01.json').read_text())
          assert cp['active_issue']==203 and cp['last_decision']=='DEC-318'
          assert aux['parallel_issue']==220 and aux['frozen_contract_commit']=='a4c775127eeafce152595759897590f553e237c5'
          assert h['disposition']=='HOLD_FAA_F01_SOURCE_TRANSPORT_OR_LINEAGE_NOT_VERIFIED'
          assert g['disposition']=='DOC_HTML_GET_REACHABLE_ONLY_NOT_ZIP_VERIFIED' and g['http_status']==200
          assert not Path('research/US-FAA-AIR-F01/evidence/archive-magic-preflight-01.json').exists()
          PY
      - name: GET at most four ZIP signature bytes per exact FAA first-party archive
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,datetime,json
          from pathlib import Path
          urls={
            'current':'https://registry.faa.gov/database/ReleasableAircraft.zip',
            '2020':'https://registry.faa.gov/database/yearly/ReleasableAircraft.2020.zip',
            '2021':'https://registry.faa.gov/database/yearly/ReleasableAircraft.2021.zip',
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect())
          details={}
          for year,url in urls.items():
              req=urllib.request.Request(url,method='GET',headers={'User-Agent':'Mozilla/5.0 (compatible; research preflight; no registry records)','Range':'bytes=0-3','Accept':'application/zip,application/octet-stream'})
              entry={'url':url,'method':'GET','range_header':'bytes=0-3','http_status':None,'content_type':None,'redirect_location':None,'byte_prefix_hex':None,'body_bytes_read':0,'zip_signature_candidate':False}
              try:
                  with opener.open(req,timeout=25) as r:
                      entry['http_status']=r.status
                      entry['content_type']=r.headers.get('Content-Type')
                      entry['redirect_location']=r.headers.get('Location')
                      if r.geturl()!=url: raise RuntimeError('Unexpected redirect')
                      magic=r.read(4)
                      entry['byte_prefix_hex']=magic.hex()
                      entry['body_bytes_read']=len(magic)
                      entry['zip_signature_candidate']=magic in (b'PK\x03\x04',b'PK\x05\x06',b'PK\x07\x08')
              except urllib.error.HTTPError as e:
                  entry['http_status']=e.code
                  entry['content_type']=e.headers.get('Content-Type')
                  entry['redirect_location']=e.headers.get('Location')
              except (urllib.error.URLError,TimeoutError,OSError) as e:
                  entry['transport_error_type']=type(e).__name__
              details[year]=entry
          candidate=all(z['http_status'] in (200,206) and z['zip_signature_candidate'] for z in details.values())
          rec={'research':'US-FAA-AIR-F01','issue':220,'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'disposition':'CONTINUE_FAA_F01_FULL_OFFICIAL_ARCHIVE_ACCESS_NOT_YET_PROVEN' if candidate else 'HOLD_FAA_F01_EXACT_OFFICIAL_ARCHIVE_ACCESS_NOT_READY','archive_checks':details,'zip_members_opened':False,'deregistered_records_opened':False,'owner_data_opened':False,'f01_18_gate_result':None,'incremental_monetary_cost_usd':0}
          out=Path('research/US-FAA-AIR-F01/evidence/archive-magic-preflight-01.json');out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(rec,indent=2,sort_keys=True)+chr(10))
          msg=['# FAA F01 archive first-four-byte preflight / 공식 ZIP 4바이트 검증','','- Decision: '+rec['disposition'],'- Read only at most four bytes from each archive, no ZIP members or owner records. / 파일 내부 데이터 미열람.','', '| Archive | HTTP | Read | ZIP signature |','|---|---|---|---|']
          for k,v in details.items():msg.append('| '+k+' | '+str(v['http_status'])+' | '+str(v['body_bytes_read'])+' | '+str(v['zip_signature_candidate'])+' |')
          out.with_suffix('.md').write_text(chr(10).join(msg)+chr(10))
          print('FAA_ARCHIVE_PREFLIGHT',rec['disposition'])
          print('archive_codes',{k:v['http_status'] for k,v in details.items()})
          PY
      - name: Persist one-time transport evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FAA-AIR-F01/evidence/archive-magic-preflight-01.json research/US-FAA-AIR-F01/evidence/archive-magic-preflight-01.md
          git commit -m 'Record FAA exact official ZIP signatures first-four-byte preflight'
          git push origin HEAD:main
