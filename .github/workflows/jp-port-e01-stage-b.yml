name: JP PORT E01 Stage B primary experiment

on:
  push:
    paths:
      - ".github/workflows/jp-port-e01-stage-b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet numpy scipy openpyxl
      - name: Execute frozen JP-PORT-E01 Stage B
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,http.cookiejar,urllib.error
          import json,hashlib,os,re,csv,io,time,math,calendar,platform,sys
          from pathlib import Path
          from collections import defaultdict,Counter
          import numpy as np
          import scipy
          from scipy import stats
          import openpyxl

          ROOT="https://www.data.jma.go.jp/risk/obsdl/index.php"
          SHOW="https://www.data.jma.go.jp/risk/obsdl/show/table"
          CROSS=Path("research/JP-PORT-E01/JMA_STATION_CROSSWALK.md").read_text(encoding="utf-8")
          KEYS_PATH=Path("research/JP-PORT-E01/STAGE_A_PANEL_KEYS.csv")
          OUT="research/JP-PORT-E01/RESULT.md"
          NUM="research/JP-PORT-E01/PRIMARY_RESULT.csv"
          ESTAT={
            2019:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000031909819","c9b52effc6939080290f9cd2d1eaad894769d5a0af8f5c268bd18dce5218bebf"),
            2020:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000031917650","9ee04b6f968fa475f004c7e397cb74303d6bd3498972ef040c12f3414b1fbe46"),
            2021:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000032059434","de510a1510a178a9dc3d3d0dce9ed5ea8da165929ccb0d381458f2005571dd68"),
            2022:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000032170294","f5e1402c0fba0afa2b8a74f8e463638c9dc6ef141ed9c08355f39125b6fa61c4"),
            2023:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000040024002","4670b2ac230cae5b2bdc6a50ae03c72001137ca24b9c023a6f90e28e77156d04"),
            2024:("https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId=000040146718","830c2173b19f9ea106596e043730bd93616dafe93ef0c6a385d633335cef0200"),
          }

          # Frozen Stage-A panel keys.
          panel=[]
          with KEYS_PATH.open("r",encoding="utf-8",newline="") as f:
              r=csv.DictReader(f)
              for row in r:
                  panel.append(row)
          panel_sha=hashlib.sha256(KEYS_PATH.read_bytes()).hexdigest()
          expected_panel_sha="7831034401647ef1602ea8db6f6445206df4b3954ef3bae010dd8e2cd3587486"
          if panel_sha!=expected_panel_sha:
              raise RuntimeError(f"Stage-A panel-key hash drift: {panel_sha}")
          panel_keyset={(r["port"],r["jma_history_station"],r["year_month"]) for r in panel}
          panel_stations=sorted({r["jma_history_station"] for r in panel},key=int)
          panel_ports=sorted({r["port"] for r in panel})
          panel_months=sorted({r["year_month"] for r in panel})

          # Parse exact obsdl crosswalk.
          cross={}
          inx=False
          for ln in CROSS.splitlines():
              if ln.startswith("| JMA history station | Name | obsdl stid |"):
                  inx=True;continue
              if inx:
                  if not ln.startswith("|"):break
                  if ln.startswith("|---"):continue
                  c=[x.strip() for x in ln.split("|")]
                  if len(c)>=7 and c[1].isdigit():
                      cross[c[1]]={"name":c[2],"stid":c[3]}
          if any(h not in cross for h in panel_stations):
              raise RuntimeError("Panel contains station without frozen obsdl crosswalk")

          # Re-download the one preregistered JMA element and compute monthly max only after integrity checks.
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          ua={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          with opener.open(urllib.request.Request(ROOT,headers=ua),timeout=60) as r:
              rootraw=r.read()

          stations=[(hid,cross[hid]) for hid in panel_stations]
          BATCH_SIZE=8
          batches=[stations[i:i+BATCH_SIZE] for i in range(0,len(stations),BATCH_SIZE)]
          jma_manifest=[]
          daily_valid=defaultdict(list)  # (histid, ym) -> values
          homogeneity=defaultdict(set)

          def request_batch(batch):
              stids=[v["stid"] for hid,v in batch]
              data={
                "stationNumList":json.dumps(stids,separators=(",",":")),
                "aggrgPeriod":1,
                "elementNumList":json.dumps([["302",""]],separators=(",",":")),
                "interAnnualType":1,
                "ymdList":json.dumps(["2019","2024","1","12","1","31"],separators=(",",":")),
                "optionNumList":"[]",
                "downloadFlag":"true",
                "rmkFlag":1,
                "disconnectFlag":1,
                "youbiFlag":0,
                "fukenFlag":0,
                "kijiFlag":0,
                "huukouFlag":0,
                "csvFlag":1,
                "jikantaiFlag":0,
                "jikantaiList":"[]",
                "ymdLiteral":1,
              }
              body=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(SHOW,data=body,headers={**ua,"Content-Type":"application/x-www-form-urlencoded","Referer":ROOT})
              for attempt in (1,2):
                  try:
                      with opener.open(req,timeout=180) as r:
                          return r.read(),dict(r.headers),attempt
                  except urllib.error.HTTPError as e:
                      if e.code not in (502,503,504) or attempt==2:
                          raise
                      time.sleep(15)
                  except TimeoutError:
                      if attempt==2: raise
                      time.sleep(15)

          for bi,batch in enumerate(batches,1):
              raw,heads,attempt=request_batch(batch)
              if "application/octet-stream" not in heads.get("Content-Type",""):
                  raise RuntimeError(f"JMA batch {bi} non-CSV content-type")
              hs=hashlib.sha256(raw).hexdigest()
              rows=list(csv.reader(io.StringIO(raw.decode("cp932"))))
              expected_cols=1+5*len(batch)
              if len(rows)<10 or len(rows[2])!=expected_cols:
                  raise RuntimeError(f"JMA batch {bi} schema failure")
              for j,(hid,v) in enumerate(batch):
                  start=1+5*j
                  if any(n!=v["name"] for n in rows[2][start:start+5]):
                      raise RuntimeError(f"JMA station-header mismatch {hid}")
                  if not all("最大風速" in x for x in rows[3][start:start+5]):
                      raise RuntimeError(f"JMA element-header mismatch {hid}")
                  labels=rows[5][start:start+5]
                  if "品質情報" not in labels[1] or "均質番号" not in labels[4]:
                      raise RuntimeError(f"JMA quality/homogeneity schema mismatch {hid}")
              for row in rows[6:]:
                  if not row or not row[0].strip():continue
                  try:
                      d=__import__("datetime").datetime.strptime(row[0].strip(),"%Y/%m/%d")
                  except Exception:
                      continue
                  ym=f"{d.year:04d}-{d.month:02d}"
                  for j,(hid,v) in enumerate(batch):
                      start=1+5*j
                      if len(row)<start+5:continue
                      val=row[start].strip()
                      q=row[start+1].strip()
                      hom=row[start+4].strip()
                      if hom:homogeneity[hid].add(hom)
                      if q=="8" and val!="":
                          try:
                              daily_valid[(hid,ym)].append(float(val))
                          except ValueError:
                              raise RuntimeError(f"Non-numeric quality-8 wind value {hid} {ym}")
              jma_manifest.append({
                  "batch":bi,"history_ids":[hid for hid,v in batch],
                  "obsdl_ids":[v["stid"] for hid,v in batch],
                  "bytes":len(raw),"sha256":hs,"rows":len(rows),"attempt":attempt
              })
              if bi<len(batches):time.sleep(5)

          # Reapply frozen homogeneity and 90% completeness rules.
          hom_bad={hid:sorted(v) for hid,v in homogeneity.items() if len(v)>1}
          if hom_bad:
              raise RuntimeError(f"Stage-B homogeneity drift: {hom_bad}")
          monthly_wind={}
          for hid in panel_stations:
              for year in range(2019,2025):
                  for month in range(1,13):
                      ym=f"{year:04d}-{month:02d}"
                      vals=daily_valid[(hid,ym)]
                      reqdays=math.ceil(0.90*calendar.monthrange(year,month)[1])
                      if len(vals)>=reqdays:
                          monthly_wind[(hid,ym)]=max(vals)

          # Frozen MLIT cargo extraction.
          cargo={}
          mlit_manifest=[]
          for year,(url,expected) in ESTAT.items():
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=180) as r:
                  b=r.read()
              hs=hashlib.sha256(b).hexdigest()
              if hs!=expected:
                  raise RuntimeError(f"MLIT hash drift {year}: {hs}")
              wb=openpyxl.load_workbook(io.BytesIO(b),read_only=True,data_only=True)
              ws=wb["海上出入貨物"]
              # Exactly 12 monthly total-cargo columns: row6=合計, row7=トン数.
              total_cols=[]
              for col in range(5,ws.max_column+1):
                  if str(ws.cell(6,col).value or "").strip()=="合計" and str(ws.cell(7,col).value or "").strip()=="トン数":
                      total_cols.append(col)
              if len(total_cols)!=12:
                  raise RuntimeError(f"MLIT monthly total column count {year}: {len(total_cols)}")
              rows={}
              for ri in range(8,ws.max_row+1):
                  name=str(ws.cell(ri,3).value or "").strip()
                  typ=str(ws.cell(ri,4).value or "").strip()
                  if name and typ=="計":
                      if name in rows:raise RuntimeError(f"Duplicate total row {year} {name}")
                      rows[name]=ri
              for port in panel_ports:
                  if port not in rows:
                      continue
                  ri=rows[port]
                  for month,col in enumerate(total_cols,1):
                      v=ws.cell(ri,col).value
                      if v is None or str(v).strip()=="":
                          continue
                      try:
                          fv=float(v)
                      except Exception:
                          continue
                      cargo[(port,f"{year:04d}-{month:02d}")]=fv
              mlit_manifest.append({"year":year,"bytes":len(b),"sha256":hs,"monthly_total_cols":len(total_cols)})

          # Realized Stage-B rows must be a subset of frozen Stage-A keys.
          rows=[]
          dropped_weather=0
          dropped_cargo=0
          for r in panel:
              port=r["port"];hid=r["jma_history_station"];ym=r["year_month"]
              w=monthly_wind.get((hid,ym))
              if w is None:
                  dropped_weather+=1
                  continue
              c=cargo.get((port,ym))
              if c is None:
                  dropped_cargo+=1
                  continue
              if c<0:
                  raise RuntimeError(f"Negative cargo {port} {ym}")
              rows.append((port,hid,ym,float(w),math.log1p(c)))

          if not rows:
              raise RuntimeError("No Stage-B rows")
          ports_real=sorted({x[0] for x in rows})
          months_real=sorted({x[2] for x in rows})
          clusters=sorted({x[1] for x in rows},key=int)

          # Build frozen design: intercept, W, port dummies minus one, month dummies minus one.
          p_ref=ports_real[0]
          m_ref=months_real[0]
          p_cols={p:i for i,p in enumerate(ports_real[1:],start=2)}
          m_start=2+len(ports_real)-1
          m_cols={m:i for i,m in enumerate(months_real[1:],start=m_start)}
          K=1+1+(len(ports_real)-1)+(len(months_real)-1)
          N=len(rows)
          X=np.zeros((N,K),dtype=float)
          y=np.zeros(N,dtype=float)
          group=np.empty(N,dtype=object)
          X[:,0]=1.0
          for i,(port,hid,ym,w,ly) in enumerate(rows):
              X[i,1]=w
              if port!=p_ref:X[i,p_cols[port]]=1.0
              if ym!=m_ref:X[i,m_cols[ym]]=1.0
              y[i]=ly
              group[i]=hid

          rank=int(np.linalg.matrix_rank(X))
          if rank!=K:
              raise RuntimeError(f"Design rank failure {rank}!={K}")
          coef,resid_sum,rank_lstsq,svals=np.linalg.lstsq(X,y,rcond=None)
          u=y-X@coef
          beta=float(coef[1])

          XtX=X.T@X
          bread=np.linalg.inv(XtX)
          meat=np.zeros((K,K),dtype=float)
          for g in clusters:
              idx=np.where(group==g)[0]
              score=X[idx,:].T@u[idx]
              meat+=np.outer(score,score)
          G=len(clusters)
          if G<=1 or N<=K:
              raise RuntimeError(f"Insufficient cluster/sample support N={N},G={G},K={K}")
          cr1=(G/(G-1))*((N-1)/(N-K))
          V=cr1*(bread@meat@bread)
          varb=float(V[1,1])
          if not np.isfinite(varb) or varb<0:
              raise RuntimeError(f"Invalid beta variance {varb}")
          se=math.sqrt(varb)
          tstat=beta/se
          df=G-1
          tcrit=float(stats.t.ppf(0.975,df))
          lo=beta-tcrit*se
          hi=beta+tcrit*se
          pval=float(2*stats.t.sf(abs(tstat),df))
          pct5=100*(math.exp(5*beta)-1)

          gate="PASS_E01_NEGATIVE_EXTREME_WIND_CARGO_ASSOCIATION" if (beta<0 and hi<0) else "NO_E01_NEGATIVE_EXTREME_WIND_CARGO_ASSOCIATION"

          # Persist one-row numerical result.
          os.makedirs(Path(NUM).parent,exist_ok=True)
          with open(NUM,"w",encoding="utf-8",newline="") as f:
              w=csv.writer(f)
              w.writerow(["gate","N","G","K","beta_per_1ms","cr1_se","t_stat","df","p_two_sided","ci95_low","ci95_high","effect_pct_plus5ms","dropped_weather","dropped_cargo"])
              w.writerow([gate,N,G,K,
                          format(beta,".12g"),format(se,".12g"),format(tstat,".12g"),df,
                          format(pval,".12g"),format(lo,".12g"),format(hi,".12g"),
                          format(pct5,".12g"),dropped_weather,dropped_cargo])
          num_sha=hashlib.sha256(Path(NUM).read_bytes()).hexdigest()

          lines=["---","id: JP-PORT-E01-RESULT","type: preregistered-primary-panel-experiment-result",
                 "created: 2026-09-04",f"final_gate: {gate}",
                 "stage_a_gate: PASS_E01_STAGE_A_SOURCE_IDENTITY_QUALITY",
                 "relationship_outcome_computed: true","incremental_monetary_cost_usd: 0","---","",
                 "# JP-PORT-E01 Result","",
                 f"## Final gate: **{gate}**","",
                 "## Frozen primary model","",
                 "log1p(monthly total maritime cargo) = beta × monthly maximum of quality-8 daily maximum wind + port FE + year-month FE.",
                 "",
                 "Inference: one-way CR1 clustered by frozen JMA history station ID; t critical value uses G-1 degrees of freedom.","",
                 "## Primary numerical result","",
                 f"- N observations: **{N}**",
                 f"- JMA station clusters G: **{G}**",
                 f"- fitted design columns/rank K: **{K}**",
                 f"- beta per +1 m/s: **{beta:.9g}**",
                 f"- CR1 station-clustered SE: **{se:.9g}**",
                 f"- t statistic: **{tstat:.9g}**",
                 f"- degrees of freedom: **{df}**",
                 f"- two-sided p-value: **{pval:.9g}**",
                 f"- 95% CI: **[{lo:.9g}, {hi:.9g}]**",
                 f"- descriptive model-implied change for +5 m/s: **{pct5:.6g}%**",
                 "",
                 "The +5 m/s translation is descriptive only. It is not a causal estimate or an additional PASS threshold.","",
                 "## Realized frozen-panel integrity","",
                 f"- Stage-A panel-key SHA-256: **{panel_sha}**",
                 f"- Stage-A frozen keys: **{len(panel)}**",
                 f"- realized Stage-B rows: **{N}**",
                 f"- realized ports: **{len(ports_real)}**",
                 f"- realized year-months: **{len(months_real)}**",
                 f"- realized station clusters: **{G}**",
                 f"- keys dropped for re-downloaded weather incompleteness: **{dropped_weather}**",
                 f"- keys dropped for missing/non-numeric MLIT cargo: **{dropped_cargo}**","",
                 "## Stage-B JMA raw-response manifest","",
                 f"- session-root SHA-256: **{hashlib.sha256(rootraw).hexdigest()}**",
                 "- element: **302 最大風速 only**",
                 "- period: **2019-01-01..2024-12-31**",
                 f"- requests: **{len(jma_manifest)}**","",
                 "| Batch | History station IDs | obsdl IDs | Bytes | SHA-256 | Rows | Attempt |",
                 "|---:|---|---|---:|---|---:|---:|"]
          for x in jma_manifest:
              lines.append(f"| {x['batch']} | {' '.join(x['history_ids'])} | {' '.join(x['obsdl_ids'])} | {x['bytes']} | {x['sha256']} | {x['rows']} | {x['attempt']} |")
          lines += ["","## MLIT source manifest","",
                    "| Year | Bytes | SHA-256 | Monthly total columns |","|---:|---:|---|---:|"]
          for x in mlit_manifest:
              lines.append(f"| {x['year']} | {x['bytes']} | {x['sha256']} | {x['monthly_total_cols']} |")
          lines += ["","## Runtime","",
                    f"- Python: {sys.version.split()[0]}",
                    f"- platform: {platform.platform()}",
                    f"- numpy: {np.__version__}",
                    f"- scipy: {scipy.__version__}",
                    f"- openpyxl: {openpyxl.__version__}",
                    f"- primary-result CSV SHA-256: **{num_sha}**",
                    f"- primary-result file: `{NUM}`","",
                    "## Interpretation boundary","",
                    "This first experiment tests one preregistered association only.",
                    "",
                    "A PASS would mean the frozen panel shows a statistically detectable negative association under the frozen model. A NO means the preregistered negative-association gate was not met.",
                    "",
                    "Neither gate establishes causality, terminal-level operational disruption, physical tonnage loss, port resilience ranking, policy superiority or investment superiority.",
                    "",
                    "No alternate weather variable, threshold, lag/lead, station remap or port subset was searched to rescue the result.",
                    "","Incremental monetary cost remained **0 USD**.",""]
          Path(OUT).write_text("\n".join(lines),encoding="utf-8")
          PY
      - name: Commit Stage B result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/JP-PORT-E01/RESULT.md research/JP-PORT-E01/PRIMARY_RESULT.csv
          git diff --cached --quiet || git commit -m "complete JP-PORT-E01 primary Stage B experiment"
          git push
