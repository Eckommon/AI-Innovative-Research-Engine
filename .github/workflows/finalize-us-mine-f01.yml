name: Finalize US-MINE-F01 Canonical Result

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-us-mine-f01.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile finalizer
        run: python -m py_compile tools/finalize_us_mine_f01.py
      - name: Verify Issue 134 remains open and corrected staging is frozen input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/issues/134 --jq .state)" = "open"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['active_issue'] == 134
          assert c['active_research'] == 'US-MINE-F01'
          assert c['last_decision'] == 'DEC-183'
          r=json.loads(Path('research/US-MINE-F01/STAGING_RESULT.json').read_text())
          a=json.loads(Path('research/US-MINE-F01/STAGING_SOURCE_AUDIT.json').read_text())
          assert r['gate'] == 'PASS_US_MINE_F01_STRUCTURAL_JOIN_READY__PRODUCTION_SCOPE_RESTRICTED'
          assert all(r['requirements'].values())
          assert r['employment_structural_support']['distinct_keys'] == 663020
          assert r['employment_structural_support']['mines_with_ge_2_distinct_quarters'] == 17060
          assert r['accident_structural_support']['distinct_operator_mine_quarter_subunit_keys'] == 21491
          assert r['accident_structural_support']['exact_employment_overlap_keys'] == 21426
          assert r['accident_structural_support']['overlapping_states'] == 53
          assert r['injury_outcome_values_opened'] is False
          assert r['prohibited_outcome_fields_accessed'] is False
          assert r['relationship_computed'] is False
          assert r['post_execution_rescue_used'] is False
          assert a['forbidden_fields_selected'] == []
          assert a['raw_source_bytes_persisted'] is False
          assert Path('research/US-MINE-F01/SUPERSEDED_RUN_35003705306.md').exists()
          print('US_MINE_F01_FINALIZER_INPUT_VERIFY_PASS')
          PY
      - name: Finalize canonical F01 state
        run: python tools/finalize_us_mine_f01.py
      - name: Verify canonical mirrors
        run: |
          python tools/check_checkpoint.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['active_issue'] == 'none'
          assert c['active_research'] == 'NONE'
          assert c['last_completed_issue'] == 134
          assert c['last_completed_research'] == 'US-MINE-F01'
          assert c['last_decision'] == 'DEC-184'
          assert '`CLM-172`' in Path('registry/CLAIM_LEDGER.md').read_text()
          assert '`DEC-184`' in Path('registry/DECISION_LOG.md').read_text()
          assert 'US_MINE_F01_PASS__N01_AUTHORIZATION_REQUIRED' in Path('STATUS.md').read_text()
          r=json.loads(Path('research/US-MINE-F01/RESULT.json').read_text())
          assert r['workflow_run'] == 35003865979
          assert r['superseded_implementation_run'] == 35003705306
          assert r['gate'] == 'PASS_US_MINE_F01_STRUCTURAL_JOIN_READY__PRODUCTION_SCOPE_RESTRICTED'
          assert r['scientific_contract_changed_after_execution'] is False
          print('US_MINE_F01_CANONICAL_VERIFY_PASS')
          PY
      - name: Commit canonical finalization atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json registry/CLAIM_LEDGER.md registry/DECISION_LOG.md registry/CLM-172.md registry/DEC-184.md research/US-MINE-F01/README.md research/US-MINE-F01/RESULT.json research/US-MINE-F01/RESULT.md
          git commit -m 'Finalize US-MINE-F01 outcome-blind structural PASS'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Close Issue 134 completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH repos/${{ github.repository }}/issues/134 -f state=closed -f state_reason=completed >/dev/null
          test "$(gh api repos/${{ github.repository }}/issues/134 --jq .state)" = "closed"
      - name: Confirm COST-001 boundary
        run: |
          echo 'Standard public-repository GitHub-hosted runner only.'
          echo 'Incremental monetary cost: 0 USD.'
