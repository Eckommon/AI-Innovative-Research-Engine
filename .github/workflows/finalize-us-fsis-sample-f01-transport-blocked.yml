name: Finalize US-FSIS-SAMPLE-F01 Transport Blocked
on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_us_fsis_sample_f01_transport_blocked.py'
      - '.github/workflows/finalize-us-fsis-sample-f01-transport-blocked.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify active branch and transport evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, urllib.request, os
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert str(cp['active_issue']) in {'158','#158'}
          assert cp['active_research']=='US-FSIS-SAMPLE-F01'
          assert cp['last_decision']=='DEC-228'
          assert not Path('research/US-FSIS-SAMPLE-F01/STAGING_RESULT.json').exists()
          assert not Path('research/US-FSIS-SAMPLE-F01/EXPOSURE_MANIFEST.csv').exists()
          for run_id in ('35197113668','35246170772'):
              req=urllib.request.Request(
                  f'https://api.github.com/repos/${{ github.repository }}/actions/runs/{run_id}',
                  headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json'},
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  x=json.load(r)
              assert x['conclusion']=='failure'
          PY
      - name: Build transport-blocked terminal state
        run: python tools/finalize_us_fsis_sample_f01_transport_blocked.py
      - name: Verify local checkpoint mirrors
        run: python tools/check_checkpoint.py
      - name: Commit terminal state locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-FSIS-SAMPLE-F01/RESULT.md registry/DEC-229.md registry/DECISION_LOG.md context/checkpoint.json STATUS.md context/SESSION_HANDOFF.md
          git commit -m 'Terminate FSIS F01 as transport blocked without scientific disposition'
      - name: Close Issue 158 completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close 158 --repo '${{ github.repository }}' --reason completed
      - name: Push terminal state
        run: git push origin HEAD:main
      - name: Confirm terminal boundary
        run: |
          echo 'Scientific F01 gate NOT EXECUTED; no PASS/HOLD claim.'
          echo 'Candidate 2024-2025 recall membership remains unopened; N01 unauthorized; cost=0 USD.'
