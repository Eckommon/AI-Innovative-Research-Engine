name: Audit CA GRAIN E02 Duplicate Keys

on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_ca_grain_e02_duplicate_keys.py'
      - '.github/workflows/audit-ca-grain-e02-duplicate-keys.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate audit
        run: python -m py_compile tools/audit_ca_grain_e02_duplicate_keys.py
      - name: Audit source date/key provenance without values
        run: python tools/audit_ca_grain_e02_duplicate_keys.py
      - name: Commit audit artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/CA-GRAIN-E02/DUPLICATE_KEY_AUDIT.json
          git diff --cached --quiet || git commit -m 'Audit CA-GRAIN-E02 duplicate source keys'
          git push
