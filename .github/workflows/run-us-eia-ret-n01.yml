name: Run US-EIA-RET-N01 Immutable Matching Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-eia-ret-n01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  eia-ret-n01:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 21f28f1cefe65043493a8b3e7c55f0b9e033b212^{commit}
          git cat-file -e d96ccc4346484cb39f719f98eeaca75b142d1301^{commit}
          gh issue view 185 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test -e research/US-EIA-RET-F01/evidence/attempt-02.json
          test ! -e research/US-EIA-RET-N01/evidence/attempt-01.json
          test ! -e research/US-EIA-RET-N01/evidence/matched-manifest-attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260930-US-EIA-RET-N01-ACTIVE'
          assert cp['active_issue']==185
          assert cp['active_research']=='US-EIA-RET-N01'
          assert cp['last_decision']=='DEC-281'
          f=json.loads(Path('research/US-EIA-RET-F01/evidence/attempt-02.json').read_text())
          assert f['attempt_valid'] is True
          assert f['pass_count']==18
          assert f['disposition']=='PASS_US_EIA_RET_F01_EXACT_GENERATOR_FUTURE_RETIREMENT_DESIGN_READY'
          assert f['future_retirement_membership_opened'] is False
          assert f['post_august_2026_860m_body_opened'] is False
          n=Path('research/US-EIA-RET-N01/README.md').read_text()
          assert 'future_retirement_membership_opened: false' in n
          assert 'planned_retirement_used_as_exposure: false' in n
          PY
      - name: Install deterministic workbook dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input             'requests==2.32.5' 'openpyxl==3.1.5'
      - name: Execute frozen N01 Attempt 01
        env:
          EIA_RET_N01_BOUND: '1'
          EIA_RET_N01_CONTRACT_SHA: '21f28f1cefe65043493a8b3e7c55f0b9e033b212'
        run: python tools/run_us_eia_ret_n01.py
      - name: Verify outcome and source firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-EIA-RET-N01/evidence/attempt-01.json').read_text())
          assert e['future_retirement_membership_opened'] is False
          assert e['post_august_2026_860m_body_opened'] is False
          assert e['planned_retirement_used_as_exposure'] is False
          assert e['eia923_row_bodies_opened']==0
          assert e['retired_row_bodies_opened']==0
          assert e['planned_proposed_row_bodies_opened']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable N01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-EIA-RET-N01/evidence/attempt-01.json                   research/US-EIA-RET-N01/evidence/attempt-01.md                   research/US-EIA-RET-N01/evidence/matched-manifest-attempt-01.json
          git commit -m 'Record US-EIA-RET-N01 immutable attempt 01'
          git push origin HEAD:main
