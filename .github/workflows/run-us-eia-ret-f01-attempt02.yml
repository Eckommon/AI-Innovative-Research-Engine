name: Run US-EIA-RET-F01 Immutable Gate Attempt 02
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-eia-ret-f01-attempt02.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  eia-ret-f01-attempt02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and Attempt 02 correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e cce869991b94d8c1ef21c0b3dff401cfd57b0fe3^{commit}
          git cat-file -e 3bdc8193ccb5c9ce7e40bea5a483047d57d4fdbe^{commit}
          git cat-file -e 1e844c6b127ba91c043a3badbb90a133addee806^{commit}
          gh issue view 184 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test -e research/US-EIA-RET-F01/evidence/attempt-01.json
          test ! -e research/US-EIA-RET-F01/evidence/attempt-02.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260930-US-EIA-RET-F01-ACTIVE'
          assert cp['active_issue']==184
          assert cp['active_research']=='US-EIA-RET-F01'
          assert cp['last_decision']=='DEC-279'
          a1=json.loads(Path('research/US-EIA-RET-F01/evidence/attempt-01.json').read_text())
          assert a1['github_run_id']=='36631547648'
          assert a1['planned_proposed_row_bodies_opened']==0
          assert a1['future_retirement_membership_opened'] is False
          sheets=a1['monthly']['2026-08']['sheet_names']
          assert 'Operating' in sheets and 'Operating_PR' in sheets
          assert 'Retired' in sheets and 'Retired_PR' in sheets
          corr=Path('research/US-EIA-RET-F01/IMPLEMENTATION_CORRECTION_02.md').read_text()
          for x in [
              'scientific_threshold_changed: false',
              'historical_months_changed: false',
              'identity_rule_changed: false',
              'future_firewall_changed: false'
          ]:
              assert x in corr
          PY
      - name: Install deterministic workbook dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input             'requests==2.32.5' 'beautifulsoup4==4.14.2' 'openpyxl==3.1.5'
      - name: Execute frozen Attempt 02
        env:
          EIA_RET_F01_BOUND: '1'
          EIA_RET_F01_CONTRACT_SHA: 'cce869991b94d8c1ef21c0b3dff401cfd57b0fe3'
        run: python tools/run_us_eia_ret_f01_attempt02.py
      - name: Verify correction and future firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-EIA-RET-F01/evidence/attempt-02.json').read_text())
          assert e['attempt']==2
          assert e['attempt01_commit']=='3bdc8193ccb5c9ce7e40bea5a483047d57d4fdbe'
          assert e['implementation_correction_commit']=='1e844c6b127ba91c043a3badbb90a133addee806'
          assert e['scientific_threshold_changed'] is False
          assert e['historical_months_changed'] is False
          assert e['identity_rule_changed'] is False
          assert e['future_firewall_changed'] is False
          assert e['post_august_2026_860m_body_opened'] is False
          assert e['future_retirement_membership_opened'] is False
          assert e['planned_proposed_row_bodies_opened']==0
          assert e['eia923_row_bodies_opened']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 02 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-EIA-RET-F01/evidence/attempt-02.json research/US-EIA-RET-F01/evidence/attempt-02.md
          git commit -m 'Record US-EIA-RET-F01 immutable attempt 02'
          git push origin HEAD:main
