name: Activate US-FDIC-BRANCH-N01
on:
  push:
    branches: [main]
    paths:
      - 'tools/activate_us_fdic_branch_n01.py'
      - '.github/workflows/activate-us-fdic-branch-n01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pre-Issue contract and live Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e c0f9f412b88b4ff54fd9999ff57fc3c4be40f374^{commit}
          test ! -e registry/DEC-234.md
          gh issue view 161 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert str(cp['active_issue']).lower() in {'none','null','n/a'}
          assert cp['active_research']=='NONE'
          assert cp['last_completed_issue']==160
          assert cp['last_completed_research']=='US-FDIC-BRANCH-F01'
          assert cp['last_decision']=='DEC-233'
          PY
      - name: Activate canonical state
        run: python tools/activate_us_fdic_branch_n01.py
      - name: Verify active mirrors
        run: python tools/check_checkpoint.py
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/DEC-234.md registry/DECISION_LOG.md context/checkpoint.json STATUS.md context/SESSION_HANDOFF.md
          git commit -m 'Activate US-FDIC-BRANCH-N01'
          git push origin HEAD:main
      - name: Confirm future-outcome firewall
        run: |
          echo 'Only SOD 2022-2024 structural/exposure rows authorized.'
          echo '2025 SOD and future BankFind branch/event membership remain unopened.'
          echo 'E01 unauthorized; cost=0 USD.'
