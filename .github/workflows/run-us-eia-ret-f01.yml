name: Run US-EIA-RET-F01 Immutable Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-eia-ret-f01.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  eia-ret-f01:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e cce869991b94d8c1ef21c0b3dff401cfd57b0fe3^{commit}
          git cat-file -e 140715aecd58bf5371f7c0a6a46feccf761d9457^{commit}
          gh issue view 184 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test -e research/US-EIA-GEN-F01/RESULT.md
          test ! -e research/US-EIA-RET-F01/evidence/attempt-01.json
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260930-US-EIA-RET-F01-ACTIVE'
          assert cp['active_issue']==184
          assert cp['active_research']=='US-EIA-RET-F01'
          assert cp['last_decision']=='DEC-279'
          old=Path('research/US-EIA-GEN-F01/RESULT.md').read_text()
          assert 'HOLD_US_EIA_GEN_F01_COLOCATED_SOLAR_STORAGE_LONGITUDINAL_DESIGN_NOT_READY' in old
          contract=Path('research/US-EIA-RET-F01/README.md').read_text()
          assert 'planned_proposed_row_bodies_opened: 0' in contract
          assert 'post_august_2026_860m_body_opened: false' in contract
          PY
      - name: Install deterministic workbook dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input             'requests==2.32.5' 'beautifulsoup4==4.14.2' 'openpyxl==3.1.5'
      - name: Execute frozen 18-gate EIA retirement attempt
        env:
          EIA_RET_F01_BOUND: '1'
          EIA_RET_F01_CONTRACT_SHA: 'cce869991b94d8c1ef21c0b3dff401cfd57b0fe3'
        run: python tools/run_us_eia_ret_f01.py
      - name: Verify future and sheet firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-EIA-RET-F01/evidence/attempt-01.json').read_text())
          assert e['post_august_2026_860m_body_opened'] is False
          assert e['future_retirement_membership_opened'] is False
          assert e['planned_proposed_row_bodies_opened']==0
          assert e['eia923_row_bodies_opened']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['identity_repair_used'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-EIA-RET-F01/evidence/attempt-01.json research/US-EIA-RET-F01/evidence/attempt-01.md
          git commit -m 'Record US-EIA-RET-F01 immutable attempt 01'
          git push origin HEAD:main
