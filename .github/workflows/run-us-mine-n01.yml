name: Run US-MINE-N01 Outcome-Blind Design

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-mine-n01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify active frozen contract
        run: |
          python -m py_compile tools/run_us_mine_n01.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['active_issue'] == 135
          assert c['active_research'] == 'US-MINE-N01'
          assert c['last_decision'] == 'DEC-185'
          r=Path('research/US-MINE-N01/README.md').read_text()
          assert 'ALL_SECTOR_OPERATOR_HOURS_RAMP_UP' in r
          assert 'accident_source_read: false' in r
          assert 'injury_outcome_values_opened: false' in r
          print('US_MINE_N01_FROZEN_CONTRACT_VERIFY_PASS')
          PY
      - name: Execute exposure-only N01
        run: python tools/run_us_mine_n01.py
      - name: Verify outcome-blind staging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/US-MINE-N01/STAGING_RESULT.json')
          r=json.loads(p.read_text())
          assert r['gate'] in {
            'PASS_US_MINE_N01_HOURS_RAMP_MATCHED_DESIGN_IDENTIFIABLE',
            'PARTIAL_US_MINE_N01_EXPOSURE_IDENTIFIABLE__MATCH_SUPPORT_PENDING',
            'HOLD_US_MINE_N01_SOURCE_OR_DESIGN_SUPPORT',
          }
          assert r['accident_source_read'] is False
          assert r['injury_outcome_values_opened'] is False
          assert r['production_magnitude_parsed'] is False
          assert r['relationship_computed'] is False
          if r.get('source_hash_match_f01'):
              assert Path('research/US-MINE-N01/PAIR_IDENTITIES.jsonl.gz').exists()
          print('US_MINE_N01_STAGING_VERIFY_PASS', r['gate'])
          PY
      - name: Commit immutable staging evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-MINE-N01/STAGING_RESULT.json research/US-MINE-N01/STAGING_SOURCE_AUDIT.json
          if test -f research/US-MINE-N01/PAIR_IDENTITIES.jsonl.gz; then git add research/US-MINE-N01/PAIR_IDENTITIES.jsonl.gz; fi
          git commit -m 'Record US-MINE-N01 outcome-blind staging evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Confirm zero-cost boundary
        run: |
          echo 'Standard public-repository GitHub-hosted runner only.'
          echo 'No paid source or service is used.'
          echo 'Incremental monetary cost: 0 USD.'
