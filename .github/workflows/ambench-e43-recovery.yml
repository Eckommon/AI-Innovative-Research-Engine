name: AMBENCH E43 recovery with bounded network hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambench-e43-recovery.yml'

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct frozen F42 inputs with bounded source retries
        shell: bash
        run: |
          set -euo pipefail
          export E43_ROOT="$RUNNER_TEMP/e43-recovery"
          mkdir -p "$E43_ROOT/generated"
          python - <<'PY'
          import csv, hashlib, http.client, io, json, math, os, re, socket, time, urllib.error, urllib.request, zipfile
          from pathlib import Path

          DSID='mds2-2507'
          EXPECTED_VERSION='1.0.1'
          EXPECTED_SHA='c57a56cc9c906e4db134d7bfb8618b6678e80dd0318324de0b7baf1ce092a3f4'
          EXPECTED_SIZE=18079576
          EXPECTED_ROWS=25051
          EXPECTED_POSITIVE=7408
          EXPECTED_RUN_LENGTHS=[251,376,251,376,21,40,60,79,99,119,138,158,177,197,217,236,256,275,284,284,284,284,284,284,284,277,257,238,218,199,179,159,140,120,101,81,61,42,22]
          RISK_ORDER=[5,39,6,18,24,22,20,21,23,25,27,17,16,28,29,15,14,13,30,26,31,7,32,19,12,11,33,34,10,8,9,38,35,36,37,1,3,2,4]
          EXPECTED_N0='7b2860908b2c96b167e1f383af5fa150b92184ad433e1ca9b3320dba68eeb475'
          EXPECTED_R1='778adef0041061f2413b35539798c3c5836b3290c1054e4c71b39f5dc689cd9b'
          DT=10e-6
          ROOT=Path(os.environ['E43_ROOT'])

          def fetch_complete(url, attempts=3, timeout=240):
              errors=[]
              for attempt in range(1,attempts+1):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'AI-Innovative-Research-Engine/E43-recovery'})
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          data=r.read()
                      return data, attempt, errors
                  except Exception as e:
                      errors.append(f'attempt_{attempt}:{type(e).__name__}:{e}')
                      if attempt<attempts:
                          time.sleep(5)
              raise RuntimeError('all bounded fetch attempts failed: '+' | '.join(errors))

          info={'input_integrity_ok':False,'reasons':[],'network':{},'version':None,'archive_size':None,'archive_sha256':None,'member':None,'rows':0,'positive_rows':0,'run_count':0,'n0_hash':None,'r1_hash':None,'laser_on_time_s':None,'laser_off_time_s':None,'total_time_s':None,'energy_proxy_J':None}
          try:
              meta_raw, meta_attempt, meta_errors=fetch_complete(f'https://data.nist.gov/od/id/{DSID}?format=nerdm')
              info['network']['metadata_attempt_used']=meta_attempt
              info['network']['metadata_prior_errors']=meta_errors
              meta=json.loads(meta_raw.decode('utf-8'))
              version=str(meta.get('version')); info['version']=version
              comps=[c for c in meta.get('components',[]) if c.get('filepath')=='RHF_Command.zip']
              if len(comps)!=1:
                  raise RuntimeError(f'RHF_Command component count={len(comps)}')
              comp=comps[0]
              raw, zip_attempt, zip_errors=fetch_complete(comp['downloadURL'])
              info['network']['archive_attempt_used']=zip_attempt
              info['network']['archive_prior_errors']=zip_errors
              got_sha=hashlib.sha256(raw).hexdigest(); nerdm_sha=(comp.get('checksum') or {}).get('hash')
              info['archive_size']=len(raw); info['archive_sha256']=got_sha
              if version!=EXPECTED_VERSION:
                  raise RuntimeError(f'version mismatch {version}')
              if not (len(raw)==comp.get('size')==EXPECTED_SIZE):
                  raise RuntimeError(f'archive size mismatch local={len(raw)} nerdm={comp.get("size")} expected={EXPECTED_SIZE}')
              if not (got_sha==nerdm_sha==EXPECTED_SHA):
                  raise RuntimeError(f'archive checksum mismatch local={got_sha} nerdm={nerdm_sha}')

              z=zipfile.ZipFile(io.BytesIO(raw))
              rx=re.compile(r'(?:^|/)RHF_P01_layer0001\.csv$',re.I)
              members=[n for n in z.namelist() if rx.search(n)]
              if len(members)!=1:
                  raise RuntimeError(f'P01 member count={len(members)}')
              member=members[0]; info['member']=member
              text=z.read(member).decode('utf-8-sig',errors='strict')
              rows=[]; blank=0; malformed=0
              for row in csv.reader(io.StringIO(text)):
                  if not row or all(not c.strip() for c in row):
                      blank+=1; continue
                  if len(row)!=4:
                      malformed+=1; continue
                  try: vals=tuple(map(float,row))
                  except Exception:
                      malformed+=1; continue
                  if not all(math.isfinite(v) for v in vals):
                      malformed+=1; continue
                  rows.append(vals)
              info['rows']=len(rows)
              if blank or malformed or len(rows)!=EXPECTED_ROWS:
                  raise RuntimeError(f'row integrity blank={blank} malformed={malformed} parsed={len(rows)}')

              run_ranges=[]; start=None
              for i,(_,_,p,_) in enumerate(rows):
                  if p>0 and start is None: start=i
                  if p<=0 and start is not None:
                      run_ranges.append((start,i-1)); start=None
              if start is not None: run_ranges.append((start,len(rows)-1))
              lengths=[b-a+1 for a,b in run_ranges]; positive=sum(lengths)
              info['positive_rows']=positive; info['run_count']=len(run_ranges)
              if lengths!=EXPECTED_RUN_LENGTHS or positive!=EXPECTED_POSITIVE or len(run_ranges)!=39:
                  raise RuntimeError('F42 source-run identity drift')

              leading_off=run_ranges[0][0]
              gaps=[run_ranges[i][0]-run_ranges[i-1][1]-1 for i in range(1,len(run_ranges))]
              trailing_off=len(rows)-1-run_ranges[-1][1]
              if leading_off+sum(gaps)+trailing_off+positive!=len(rows) or len(gaps)!=38:
                  raise RuntimeError('source timing partition mismatch')

              run_points={}; allpos=[]
              for rid,(a,b) in enumerate(run_ranges,start=1):
                  pts=[(rows[i][0],rows[i][1]) for i in range(a,b+1)]
                  run_points[rid]=pts; allpos.extend(pts)
              minx=min(x for x,y in allpos); miny=min(y for x,y in allpos)
              translated={rid:[(x-minx,y-miny) for x,y in pts] for rid,pts in run_points.items()}

              def path_text(order):
                  lines=['Mode\tX(mm)\tY(mm)\tZ(mm)\tPmod\tVel(m/s)/Time(s)']
                  first=order[0]; x0,y0=translated[first][0]
                  if leading_off>0: lines.append(f'1\t{x0:.15g}\t{y0:.15g}\t0\t0\t{leading_off*DT:.15g}')
                  for pos,rid in enumerate(order):
                      if pos>0:
                          xs,ys=translated[rid][0]
                          lines.append(f'1\t{xs:.15g}\t{ys:.15g}\t0\t0\t{gaps[pos-1]*DT:.15g}')
                      for x,y in translated[rid]:
                          lines.append(f'1\t{x:.15g}\t{y:.15g}\t0\t1\t{DT:.15g}')
                  if trailing_off>0:
                      xe,ye=translated[order[-1]][-1]
                      lines.append(f'1\t{xe:.15g}\t{ye:.15g}\t0\t0\t{trailing_off*DT:.15g}')
                  return '\n'.join(lines)+'\n'

              n0=path_text(list(range(1,40))); r1=path_text(RISK_ORDER)
              n0_hash=hashlib.sha256(n0.encode()).hexdigest(); r1_hash=hashlib.sha256(r1.encode()).hexdigest()
              info['n0_hash']=n0_hash; info['r1_hash']=r1_hash
              if n0_hash!=EXPECTED_N0 or r1_hash!=EXPECTED_R1:
                  raise RuntimeError(f'F42 path hash mismatch N0={n0_hash} R1={r1_hash}')
              (ROOT/'generated'/'N0.Path.txt').write_text(n0,encoding='utf-8')
              (ROOT/'generated'/'R1.Path.txt').write_text(r1,encoding='utf-8')
              info['laser_on_time_s']=positive*DT
              info['laser_off_time_s']=(leading_off+sum(gaps)+trailing_off)*DT
              info['total_time_s']=len(rows)*DT
              info['energy_proxy_J']=positive*DT*600.0
              info['input_integrity_ok']=True
          except Exception as e:
              info['reasons'].append(f'{type(e).__name__}: {e}')
          (ROOT/'input_meta.json').write_text(json.dumps(info,indent=2),encoding='utf-8')
          print(json.dumps(info,indent=2))
          PY

      - name: Build pinned 3DThesis and prepare cases
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/e43-recovery"
          INPUT_OK="$(python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'e43-recovery'/'input_meta.json').read_text())
          print('1' if m.get('input_integrity_ok') else '0')
          PY
          )"
          if [ "$INPUT_OK" != 1 ]; then
            printf '{"build_ok":false,"reason":"input integrity failed; build skipped"}\n' > "$ROOT/build_meta.json"
            exit 0
          fi
          WORK="$ROOT/3DThesis"
          set +e
          git clone --filter=blob:none https://github.com/ORNL-MDF/3DThesis.git "$WORK" > "$ROOT/build.log" 2>&1; CLONE_RC=$?
          if [ $CLONE_RC -eq 0 ]; then git -C "$WORK" checkout --detach 2de7fc6d8cfa5de78b111df97b1a4d9156a8cf60 >> "$ROOT/build.log" 2>&1; CHECKOUT_RC=$?; else CHECKOUT_RC=99; fi
          if [ $CHECKOUT_RC -eq 0 ]; then cmake -S "$WORK" -B "$WORK/build" -D CMAKE_INSTALL_PREFIX="$WORK/install" >> "$ROOT/build.log" 2>&1; CONFIG_RC=$?; else CONFIG_RC=99; fi
          if [ $CONFIG_RC -eq 0 ]; then cmake --build "$WORK/build" --parallel 2 >> "$ROOT/build.log" 2>&1; BUILD_RC=$?; else BUILD_RC=99; fi
          if [ $BUILD_RC -eq 0 ]; then cmake --install "$WORK/build" >> "$ROOT/build.log" 2>&1; INSTALL_RC=$?; else INSTALL_RC=99; fi
          set -e
          OK=false
          if [ $CLONE_RC -eq 0 ] && [ $CHECKOUT_RC -eq 0 ] && [ $CONFIG_RC -eq 0 ] && [ $BUILD_RC -eq 0 ] && [ $INSTALL_RC -eq 0 ]; then OK=true; fi
          printf '{"build_ok":%s,"clone_rc":%s,"checkout_rc":%s,"configure_rc":%s,"build_rc":%s,"install_rc":%s}\n' "$OK" "$CLONE_RC" "$CHECKOUT_RC" "$CONFIG_RC" "$BUILD_RC" "$INSTALL_RC" > "$ROOT/build_meta.json"
          if [ "$OK" != true ]; then exit 0; fi
          for CASE in N0 R1; do
            D="$ROOT/cases/$CASE"; mkdir -p "$D"
            cp "$WORK/examples/solidification_mpstats/Material.txt" "$D/Material.txt"
            cp "$WORK/examples/solidification_mpstats/Beam.txt" "$D/Beam.txt"
            cp "$WORK/examples/solidification_mpstats/Output.txt" "$D/Output.txt"
            cp "$WORK/examples/solidification_mpstats/Settings.txt" "$D/Settings.txt"
            cp "$ROOT/generated/$CASE.Path.txt" "$D/Path.txt"
            cat > "$D/Mode.txt" <<'EOF'
          Solidification
          {
            Tracking Surface
            Timestep 1e-5
          }
          EOF
            cat > "$D/Domain.txt" <<'EOF'
          X
          {
            Min -0.001
            Max 0.004
            Res 5.0e-5
          }
          Y
          {
            Min -0.001
            Max 0.003
            Res 5.0e-5
          }
          Z
          {
            Min -0.001
            Max 0.000
            Res 2.5e-5
          }
          EOF
            cat > "$D/ParamInput.txt" <<EOF
          Simulation
          {
            Name $CASE
            Mode Mode.txt
            Material Material.txt
            Beam Beam.txt
            Path Path.txt
          }
          Options
          {
            Domain Domain.txt
            Output Output.txt
            Settings Settings.txt
          }
          EOF
          done

      - name: Execute frozen N0 and R1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/e43-recovery"
          BUILD_OK="$(python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'e43-recovery'/'build_meta.json').read_text())
          print('1' if m.get('build_ok') else '0')
          PY
          )"
          if [ "$BUILD_OK" != 1 ]; then
            printf '{"N0":{"executed":false,"rc":null,"elapsed_s":null},"R1":{"executed":false,"rc":null,"elapsed_s":null}}\n' > "$ROOT/runtime_meta.json"
            exit 0
          fi
          EXE="$ROOT/3DThesis/install/bin/3DThesis"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP']+'/e43-recovery/runtime_meta.json').write_text('{}')
          PY
          for CASE in N0 R1; do
            D="$ROOT/cases/$CASE"; cd "$D"; rm -rf Data run.log
            START=$(date +%s)
            set +e
            timeout 480 "$EXE" ./ParamInput.txt > run.log 2>&1
            RC=$?
            set -e
            END=$(date +%s); ELAPSED=$((END-START))
            export CASE RC ELAPSED E43_ROOT="$ROOT"
            python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['E43_ROOT'])/'runtime_meta.json'; m=json.loads(p.read_text())
          m[os.environ['CASE']]={'executed':True,'rc':int(os.environ['RC']),'elapsed_s':int(os.environ['ELAPSED'])}
          p.write_text(json.dumps(m,indent=2))
          PY
            if [ "$RC" -ne 0 ]; then break; fi
          done
          export E43_ROOT="$ROOT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['E43_ROOT'])/'runtime_meta.json'; m=json.loads(p.read_text())
          for c in ('N0','R1'): m.setdefault(c,{'executed':False,'rc':None,'elapsed_s':None})
          p.write_text(json.dumps(m,indent=2))
          print(json.dumps(m,indent=2))
          PY

      - name: Apply unchanged frozen aggregate gate and write result
        shell: bash
        run: |
          set -euo pipefail
          export E43_ROOT="$RUNNER_TEMP/e43-recovery"
          python - <<'PY'
          import csv,json,math,os,statistics
          from pathlib import Path
          ROOT=Path(os.environ['E43_ROOT'])
          inp=json.loads((ROOT/'input_meta.json').read_text()) if (ROOT/'input_meta.json').exists() else {'input_integrity_ok':False,'reasons':['missing input_meta']}
          bld=json.loads((ROOT/'build_meta.json').read_text()) if (ROOT/'build_meta.json').exists() else {'build_ok':False,'reason':'missing build_meta'}
          run=json.loads((ROOT/'runtime_meta.json').read_text()) if (ROOT/'runtime_meta.json').exists() else {'N0':{'executed':False},'R1':{'executed':False}}
          reasons=[]
          if not inp.get('input_integrity_ok'): reasons += ['input:'+x for x in inp.get('reasons',[])]
          if not bld.get('build_ok'): reasons.append('build/runtime preparation failed')
          for c in ('N0','R1'):
              r=run.get(c,{})
              if not r.get('executed') or r.get('rc')!=0: reasons.append(f'{c} runtime not successful: {r}')

          metrics={}
          expected_header=['x','y','z','MP_width','MP_length','MP_depth']
          if not reasons:
              for c in ('N0','R1'):
                  f=ROOT/'cases'/c/'Data'/f'{c}.Solidification.Final.csv'
                  if not f.exists():
                      reasons.append(f'{c} output missing: {f.name}'); continue
                  with f.open(newline='') as fh:
                      rd=csv.reader(fh); header=next(rd,None)
                      if header!=expected_header:
                          reasons.append(f'{c} output schema mismatch: {header}'); continue
                      vals=[]
                      for row in rd:
                          if len(row)!=6: continue
                          try: v=float(row[3])
                          except Exception: continue
                          if math.isfinite(v) and v>0: vals.append(v)
                  if len(vals)<100:
                      reasons.append(f'{c} positive MP_width records <100: {len(vals)}'); continue
                  mean=statistics.fmean(vals); sd=statistics.stdev(vals); cv=sd/mean
                  metrics[c]={'positive_count':len(vals),'mean_positive_width':mean,'sample_sd_positive_width':sd,'cv_width':cv,'max_positive_width':max(vals)}

          gate='HOLD_E43_RUNTIME_OR_INTEGRITY'; comparison={}
          if not reasons and all(c in metrics for c in ('N0','R1')):
              n=metrics['N0']; r=metrics['R1']
              mean_ratio=r['mean_positive_width']/n['mean_positive_width']
              count_ratio=r['positive_count']/n['positive_count']
              cv_ratio=r['cv_width']/n['cv_width']
              improvement=1-cv_ratio
              comparison={'cv_ratio_R1_over_N0':cv_ratio,'cv_improvement_fraction':improvement,'mean_width_ratio_R1_over_N0':mean_ratio,'positive_count_ratio_R1_over_N0':count_ratio}
              constraints=(0.95<=mean_ratio<=1.05 and 0.90<=count_ratio<=1.10)
              if r['cv_width'] < n['cv_width'] and constraints:
                  gate='PASS_E43_PATH_ORDER_ADDED_VALUE' if r['cv_width'] <= 0.90*n['cv_width'] else 'PARTIAL_E43_PATH_ORDER_SMALL_GAIN'
              else:
                  gate='NO_E43_PATH_ORDER_ADDED_VALUE'

          lines=['---','id: AMBENCH-E43-RESULT','type: source-grounded-path-order-only-thermal-benchmark-result','created: 2026-09-03','recovery_under: AMBENCH-E43-AMENDMENT-03','incremental_monetary_cost_usd: 0','---','','# AMBENCH-E43 Result — P01 Source-Grounded Path-Order-Only Thermal Benchmark','# AMBENCH-E43 결과 — P01 Source-Grounded Path-Order-Only Thermal Benchmark','',f'**Final gate / 최종 gate: `{gate}`**','', '## Integrity / 무결성',f'- NIST version: `{inp.get("version")}`',f'- archive size: `{inp.get("archive_size")}`',f'- archive SHA-256: `{inp.get("archive_sha256")}`',f'- archive download attempt used: `{inp.get("network",{}).get("archive_attempt_used")}`',f'- N0 path SHA-256: `{inp.get("n0_hash")}`',f'- R1 path SHA-256: `{inp.get("r1_hash")}`',f'- laser-on time: `{inp.get("laser_on_time_s")}` s',f'- laser-off time: `{inp.get("laser_off_time_s")}` s',f'- total modeled process time: `{inp.get("total_time_s")}` s',f'- benchmark energy proxy: `{inp.get("energy_proxy_J")}` J',f'- pinned 3DThesis: `2de7fc6d8cfa5de78b111df97b1a4d9156a8cf60`',f'- timestep: `1e-5 s`',f'- domain: `101 x 81 x 41 = 335421` grid points','', '## Runtime / 실행시간',f'- N0: `{run.get("N0")}`',f'- R1: `{run.get("R1")}`','']
          if metrics:
              lines += ['## Frozen aggregate metrics / 고정 집계 지표','', '```json',json.dumps(metrics,indent=2,sort_keys=True),'```','', '## Frozen comparison / 고정 비교','', '```json',json.dumps(comparison,indent=2,sort_keys=True),'```','']
          if reasons:
              lines += ['## HOLD reasons / HOLD 사유','']+[f'- {x}' for x in reasons]+['']
          lines += ['## Boundary / 경계','', 'This is a deterministic pinned semi-analytic thermal benchmark. No row-level p-value is used. A PASS does not establish physical-machine superiority, NIST physical replication, scanner-kinematic feasibility, patent novelty, material universality, or production readiness.','', 'Raw simulator CSV and generated paths remain transient and are not committed.','']
          Path('research/AMBENCH-E43/RESULT.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(gate); print(json.dumps(metrics,indent=2)); print(json.dumps(comparison,indent=2))
          PY

      - name: Persist E43 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add research/AMBENCH-E43/RESULT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'record AMBENCH-E43 recovered path-order benchmark result'
          git push

  terminal_recorder:
    if: ${{ always() }}
    needs: experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist fail-closed result if experiment job was forcibly terminated
        shell: bash
        env:
          EXPERIMENT_RESULT: ${{ needs.experiment.result }}
        run: |
          set -euo pipefail
          if [ -f research/AMBENCH-E43/RESULT.md ]; then exit 0; fi
          mkdir -p research/AMBENCH-E43
          cat > research/AMBENCH-E43/RESULT.md <<EOF
          ---
          id: AMBENCH-E43-RESULT
          type: source-grounded-path-order-only-thermal-benchmark-result
          created: 2026-09-03
          recovery_under: AMBENCH-E43-AMENDMENT-03
          incremental_monetary_cost_usd: 0
          ---

          # AMBENCH-E43 Result — Terminal Fail-Closed Record
          # AMBENCH-E43 결과 — Terminal Fail-Closed 기록

          **Final gate / 최종 gate: \`HOLD_E43_RUNTIME_OR_INTEGRITY\`**

          The 20-minute frozen experiment job did not persist a normal result. GitHub job result: \`${EXPERIMENT_RESULT}\`.

          This recorder does not infer performance and does not change any experiment parameter. Treat E43 as HOLD unless a verified normal aggregate result exists.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add research/AMBENCH-E43/RESULT.md
          git commit -m 'record AMBENCH-E43 terminal fail-closed hold'
          git push
