name: US WW N01 Leakage Control Probe

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_us_ww_n01.py'
      - '.github/workflows/us-ww-n01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zero-cost browser driver library
        run: python -m pip install --disable-pip-version-check selenium
      - name: Validate runner
        run: python -m py_compile tools/run_us_ww_n01.py
      - name: Execute outcome-blind leakage-control design probe
        run: python tools/run_us_ww_n01.py
      - name: Commit derived design manifest only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WW-N01/DESIGN_MANIFEST.json
          git diff --cached --quiet || git commit -m 'Probe US-WW-N01 leakage-control design'
          git push
