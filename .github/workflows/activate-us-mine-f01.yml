name: Activate US-MINE-F01 Canonical State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-us-mine-f01.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile activation finalizer
        run: python -m py_compile tools/activate_us_mine_f01.py
      - name: Verify Issue 134 and authorization inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/issues/134 --jq .state)" = "open"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['active_issue'] == 'none'
          assert c['last_completed_issue'] == 133
          assert c['last_decision'] == 'DEC-182'
          r=Path('research/US-MINE-F01/README.md').read_text()
          assert 'state: AUTHORIZED_OUTCOME_BLIND_FEASIBILITY' in r
          assert 'injury_outcome_values_opened: false' in r
          assert Path('registry/DEC-183.md').exists()
          print('US_MINE_F01_AUTHORIZATION_INPUT_VERIFY_PASS')
          PY
      - name: Activate US-MINE-F01 canonical state
        run: python tools/activate_us_mine_f01.py
      - name: Verify canonical mirrors
        run: |
          python tools/check_checkpoint.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('context/checkpoint.json').read_text())
          assert c['active_issue'] == 134
          assert c['active_research'] == 'US-MINE-F01'
          assert c['last_completed_issue'] == 133
          assert c['last_decision'] == 'DEC-183'
          assert '`DEC-183`' in Path('registry/DECISION_LOG.md').read_text()
          assert 'US_MINE_F01_ACTIVE__OUTCOME_BLIND_STRUCTURAL_FEASIBILITY' in Path('STATUS.md').read_text()
          assert 'next_issue: 134' in Path('research/PORTFOLIO-R27/RESULT.md').read_text()
          print('US_MINE_F01_CANONICAL_ACTIVATION_VERIFY_PASS')
          PY
      - name: Commit activation atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md context/SESSION_HANDOFF.md context/checkpoint.json registry/DECISION_LOG.md research/PORTFOLIO-R27/RESULT.md
          git commit -m 'Activate US-MINE-F01 outcome-blind feasibility'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Confirm COST-001 boundary
        run: |
          echo 'Standard public-repository GitHub-hosted runner only.'
          echo 'Incremental monetary cost: 0 USD.'
