name: Run US-HUD-MF-N01 Immutable Gate
on:
  workflow_dispatch:
  issues:
    types: [edited]
permissions:
  contents: write
  issues: read
jobs:
  hud-mf-n01:
    if: github.event_name != 'issues' || github.event.issue.number == 169
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and immutable evidence slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e 01c5a19215a30572c74309cd5b1dbe9851880224^{commit}
          gh issue view 169 --repo '${{ github.repository }}' --json state --jq '.state' | grep -qx OPEN
          test ! -e research/US-HUD-MF-N01/evidence/attempt-01.json
          test ! -e research/US-HUD-MF-N01/evidence/attempt-01.md
          test ! -e research/US-HUD-MF-N01/evidence/attempt-01-pairs.csv
          python - <<'PY'
          import json
          from pathlib import Path
          cp=json.loads(Path('context/checkpoint.json').read_text())
          assert cp['checkpoint_id']=='CHK-20260928-US-HUD-MF-N01-ACTIVE'
          assert cp['active_issue']==169
          assert cp['active_research']=='US-HUD-MF-N01'
          assert cp['last_decision']=='DEC-248'
          text=Path('research/US-HUD-MF-N01/README.md').read_text()
          assert 'future_terminated_membership_opened: false' in text
          assert '18/18 PASS' in text
          PY
      - name: Install deterministic spreadsheet parsers
        run: python -m pip install --disable-pip-version-check --no-input 'openpyxl==3.1.5' 'xlrd==2.0.1'
      - name: Execute frozen 18-gate N01 design attempt
        env:
          HUD_MF_N01_ISSUE_BOUND: '1'
          HUD_MF_N01_CONTRACT_SHA: '01c5a19215a30572c74309cd5b1dbe9851880224'
        run: python tools/run_us_hud_mf_n01.py
      - name: Verify outcome firewall and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('research/US-HUD-MF-N01/evidence/attempt-01.json').read_text())
          assert e['future_terminated_rows_opened']==0
          assert e['future_adverse_membership_opened'] is False
          assert e['future_entity_body_bytes_consumed']==0
          assert e['relationship_computed'] is False
          assert e['prediction_computed'] is False
          assert e['ranking_computed'] is False
          assert e['causal_claim_made'] is False
          assert e['incremental_monetary_cost_usd']==0
          print(e['disposition'],e.get('pass_count'),e.get('failed_gates'))
          PY
      - name: Commit immutable Attempt 01 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-HUD-MF-N01/evidence/attempt-01.json research/US-HUD-MF-N01/evidence/attempt-01.md
          if test -e research/US-HUD-MF-N01/evidence/attempt-01-pairs.csv; then
            git add research/US-HUD-MF-N01/evidence/attempt-01-pairs.csv
          fi
          git commit -m 'Record US-HUD-MF-N01 immutable attempt 01'
          git push origin HEAD:main
      - name: Confirm COST-001 and future firewall
        run: |
          echo 'Standard public-repository GitHub-hosted runner only.'
          echo 'No post-2026-09-21 terminated-mortgage body was opened.'
          echo 'Incremental monetary cost = 0 USD.'
