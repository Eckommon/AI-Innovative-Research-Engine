name: US WATERWAY F01 named-lock alias diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-waterway-f01-alias-diagnostic.yml'
      - 'tools/us_waterway_f01_alias_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run identity-only alias diagnostic
        run: python tools/us_waterway_f01_alias_diagnostic.py
      - name: Commit alias diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/US-WATERWAY-F01/NAMED_LOCK_ALIAS_DIAGNOSTIC.json research/US-WATERWAY-F01/NAMED_LOCK_ALIAS_DIAGNOSTIC.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record US-WATERWAY-F01 named-lock alias diagnostic'
          git push
