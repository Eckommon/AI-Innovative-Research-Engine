name: EU-STEEL-R01 Reproduction

on:
  push:
    branches: [main]
    paths:
      - 'src/reproduce_eu_steel_mercury.py'
      - '.github/workflows/eu-steel-r01-reproduce.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official raw inputs
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p work/raw work/extracted work/logs
          : > work/logs/download.txt

          EPRTR_URL='https://sdi.eea.europa.eu/webdav/datastore/public/eea_t_ied-eprtr_p_2007-2022_v11_r00/User%20friendly%20.csv%20file/F1_3_Total%20Release%20at%20E-PRTR%20Annex%20I%20Activity%20into%20Air.csv'
          echo "EPRTR_URL=$EPRTR_URL" | tee -a work/logs/download.txt
          curl -fL --retry 3 --retry-delay 2 \
            -A 'AI-Innovative-Research-Engine/0.3' \
            "$EPRTR_URL" \
            -o work/raw/eprtr_F1_3.csv 2>&1 | tee -a work/logs/download.txt
          echo "EPRTR_CURL_EXIT=${PIPESTATUS[0]}" | tee -a work/logs/download.txt

          EUROSTAT_BASE='https://ec.europa.eu/eurostat/api/dissemination/files'
          EUROSTAT_FILE='comext/EUROPROMS/epanntotal-r2.zip'
          echo "EUROSTAT_BASE=$EUROSTAT_BASE" | tee -a work/logs/download.txt
          echo "EUROSTAT_FILE=$EUROSTAT_FILE" | tee -a work/logs/download.txt
          curl -fL --retry 3 --retry-delay 2 -G \
            "$EUROSTAT_BASE" \
            --data-urlencode "file=$EUROSTAT_FILE" \
            -o work/raw/epanntotal-r2.zip 2>&1 | tee -a work/logs/download.txt
          echo "PRODCOM_CURL_EXIT=${PIPESTATUS[0]}" | tee -a work/logs/download.txt

          if [ -f work/raw/eprtr_F1_3.csv ]; then sha256sum work/raw/eprtr_F1_3.csv | tee -a work/logs/sha256.txt; fi
          if [ -f work/raw/epanntotal-r2.zip ]; then sha256sum work/raw/epanntotal-r2.zip | tee -a work/logs/sha256.txt; fi
          ls -lh work/raw | tee work/logs/files.txt

      - name: Inspect raw schemas and target codes
        id: inspect
        continue-on-error: true
        shell: bash
        run: |
          set -uxo pipefail
          python - <<'PY' 2>&1 | tee work/logs/inspect.txt
          from pathlib import Path
          import csv, io, zipfile

          e = Path('work/raw/eprtr_F1_3.csv')
          if e.exists():
              raw = e.read_bytes()
              text = raw.decode('utf-8-sig', errors='replace')
              sample = text[:20000]
              try:
                  delim = csv.Sniffer().sniff(sample, delimiters=',;\t|').delimiter
              except Exception:
                  delim = ';' if sample.count(';') > sample.count(',') else ','
              r = csv.reader(io.StringIO(text), delimiter=delim)
              print('EPRTR_SIZE', len(raw))
              print('EPRTR_DELIMITER', repr(delim))
              for i, row in zip(range(5), r):
                  print('EPRTR_ROW', i, row)
          else:
              print('EPRTR_MISSING')

          zpath = Path('work/raw/epanntotal-r2.zip')
          if zpath.exists() and zipfile.is_zipfile(zpath):
              with zipfile.ZipFile(zpath) as z:
                  print('PRODCOM_MEMBERS')
                  for n in z.namelist():
                      print(n)
                      if not n.endswith('/'):
                          out = Path('work/extracted') / Path(n).name
                          out.write_bytes(z.read(n))
          elif zpath.exists():
              print('PRODCOM_NOT_ZIP', zpath.stat().st_size, zpath.read_bytes()[:200])
          else:
              print('PRODCOM_MISSING')

          targets = ['2410T121','2410T122','2410T131','2410T132','2410T141','2410T142']
          print('TARGET_CODE_COUNTS')
          for p in sorted(Path('work/extracted').glob('*')):
              if not p.is_file():
                  continue
              b = p.read_bytes()
              txt = b.decode('latin-1', errors='ignore')
              counts = {t: txt.count(t) for t in targets}
              print(p.name, p.stat().st_size, counts)
              print('HEAD', txt[:1500].replace('\r','\\r').replace('\n','\\n'))
          PY

      - name: Run conservative harness
        id: harness
        continue-on-error: true
        shell: bash
        run: |
          set -uxo pipefail
          if [ ! -f work/raw/eprtr_F1_3.csv ] || [ ! -f work/raw/epanntotal-r2.zip ]; then
            echo 'Raw input missing; harness not executed.' | tee work/logs/harness.txt
            exit 0
          fi
          PROD_MEMBER=$(python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('work/raw/epanntotal-r2.zip')
          files=[n for n in z.namelist() if not n.endswith('/')]
          textish=[n for n in files if n.lower().endswith(('.csv','.txt','.tsv','.dat'))]
          print(textish[0] if len(textish)==1 else (files[0] if len(files)==1 else ''))
          PY
          )
          if [ -n "$PROD_MEMBER" ]; then
            python src/reproduce_eu_steel_mercury.py \
              --eprtr work/raw/eprtr_F1_3.csv \
              --prodcom work/raw/epanntotal-r2.zip \
              --prodcom-member "$PROD_MEMBER" \
              --workdir work/harness \
              --inspect 2>&1 | tee work/logs/harness.txt
          else
            echo 'Multiple/ambiguous PRODCOM members; inspect log required before harness execution.' | tee work/logs/harness.txt
          fi

      - name: Write inspection report into repository
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p research/EU-STEEL-R01
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os

          def read(name):
              p=Path('work/logs')/name
              return p.read_text(errors='replace') if p.exists() else '(not produced)'

          now = datetime.now(timezone.utc)
          body = f'''---
id: EU-STEEL-R01-ACTION-INSPECTION
type: experiment-log
state: ACTIVE
tags:
  - type/experiment
  - state/experiment
  - evidence/observed
  - region/eu
  - domain/industry
updated: {now.date().isoformat()}
source_of_truth: github-actions
---

# EU-STEEL-R01 GitHub Actions Raw Inspection / GitHub Actions Raw 원천 검사

**Generated / 생성:** {now.isoformat()}  
**Workflow run / 실행:** `{os.environ.get('RUN_ID', 'UNKNOWN')}`  
**Commit / 커밋:** `{os.environ.get('HEAD_SHA', 'UNKNOWN')}`

## Download Log / 다운로드 로그
```text
{read('download.txt')[-12000:]}
```

## SHA-256 / 무결성
```text
{read('sha256.txt')}
```

## File Inventory / 파일 인벤토리
```text
{read('files.txt')}
```

## Raw Schema Inspection / Raw 스키마 검사
```text
{read('inspect.txt')[-20000:]}
```

## Harness Inspection / 하네스 검사
```text
{read('harness.txt')[-12000:]}
```

## Interpretation Rule / 해석 규칙
This file is machine-generated evidence. A successful download/schema observation may be promoted to `V3_REPRODUCED` only after the project research record verifies the relevant fields and calculations. / 본 파일은 기계생성 근거이며 다운로드·스키마 관측만으로 최종 연구결론을 승격하지 않는다.
'''
          Path('research/EU-STEEL-R01/action_inspection.md').write_text(body, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/EU-STEEL-R01/action_inspection.md
          if ! git diff --cached --quiet; then
            git commit -m 'experiment: record EU-STEEL-R01 raw inspection [skip ci]'
            git push
          fi

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-steel-r01-evidence
          path: |
            work/logs/
            work/extracted/
          if-no-files-found: warn
          retention-days: 30
